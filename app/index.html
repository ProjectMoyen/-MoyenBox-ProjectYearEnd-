    h('button', { class: 'button', type: 'button', onClick: () => this.app.router.go('create') }, 'Isi invoice sendiri'),
    fileInput);
    return this.zone;
  }

  async exportNow() {
    await this.app.transfer.exportFile('invoices');
    Dialog.toast('Export Invoice dibuat. Simpan filenya di flashdisk.');
    await this.app.router.refresh();
  }

  async handleFile(file) {
    if (!file || this.reading) return;
    if (!/\.pdf$/i.test(file.name)) {
      Dialog.toast('File harus berformat PDF.');
      return;
    }
    if (file.size > HomeModule.MAX_PDF_BYTES) {
      Dialog.toast('File terlalu besar untuk sebuah PO. Periksa lagi filenya.');
      return;
    }
    this.reading = true;
    this.hint.textContent = 'Membaca PO...';
    try {
      const draft = PoLine.remaining(await this.app.poParser.parse(file), await this.app.invoices.all());
      this.hint.textContent = HomeModule.DROP_HINT;
      if (draft.lines.length === 0) {
        const numbers = draft.previous.map((invoice) => invoice.number).join(', ');
        const revisedNote = draft.revised ? ' Isi PO ini berubah sejak itu, jadi cocokkan dengan hotel.' : '';
        await Dialog.open('PO sudah lengkap', h('p', {}, `Semua barang di PO ${draft.poNumber} sudah ditagih di ${numbers}.${revisedNote}`), [{ label: 'Tutup', value: false, primary: true }]);
        return;
      }
      if (!await this.review(draft)) return;
      this.app.pendingDraft = draft;
      this.app.router.go('create');
    } catch (error) {
      const manual = await Dialog.open(
        'File PO gagal dibaca',
        h('p', {}, error instanceof PoParseError ? error.message : 'File ini tidak bisa dibaca. Coba file lain, atau isi invoice sendiri.'), [
        { label: 'Tutup', value: false },
        { label: 'Buat manual', value: true, primary: true },
      ]);
      if (manual) this.app.router.go('create');
    } finally {
      this.reading = false;
      this.hint.textContent = HomeModule.DROP_HINT;
    }
  }

  async review({ customer, poNumber, lines, note, review, previous, manual, revised, poLineCount }) {
    const row = (label, value) => value && [h('dt', {}, label), h('dd', {}, value)];
    const numbers = (invoices) => invoices.map((invoice) => invoice.number).join(', ');
    const partial = previous.length > 0;
    const left = lines.reduce((sum, line) => sum + InvoiceCalculator.lineAmount(line), 0);
    const cancelled = /cancel|void|reject/i.test(review.status);
    // A real risk gets no default button, so a habitual Enter cannot pass it.
    const risky = cancelled || revised || manual.length > 0;
    return Dialog.open('Periksa PO', [
      partial && h('div', { class: 'notice notice-info' }, `Sebagian PO ini sudah ditagih di ${numbers(previous)}. Hanya sisa barangnya yang dimuat.`),
      revised && h('div', { class: 'notice notice-error' }, `Isi PO ini berubah sejak ${numbers(previous)}, jadi sisa barang bisa keliru. Cocokkan dengan invoice itu sebelum lanjut.`),
      manual.length > 0 && h('div', { class: 'notice notice-warning' }, `No. PO ini sudah dipakai di ${numbers(manual)} yang diisi sendiri. Sisa barang tidak menghitung invoice itu, jadi periksa agar tidak tertagih dua kali.`),
      cancelled && h('div', { class: 'notice notice-error' }, `Status PO ini ${review.status}. Pastikan ke hotel sebelum membuat invoice.`),
      review.totalDue === null && h('div', { class: 'notice notice-warning' }, 'Total akhir PO tidak terbaca. Cocokkan sendiri dengan file PO, siapa tahu ada ongkos, pajak, atau diskon.'),
      review.totalDue !== null && review.totalDue !== review.subTotal && h('div', { class: 'notice notice-warning' }, `Total PO ${Format.rupiah(review.totalDue)} berbeda dari jumlah barang ${Format.rupiah(review.subTotal)}, karena ada ongkos, pajak, atau diskon. Isi sendiri di invoice kalau perlu.`),
      h('dl', { class: 'review-list' },
        row('No. PO', poNumber),
        row('Pelanggan', customer.name),
        row('Attn', customer.attn),
        row('Telepon', customer.contact),
        row('Alamat', customer.address),
        row('Tanggal kirim', review.deliveryDate && Format.date(review.deliveryDate)),
        row('Ditujukan ke', review.supplier),
        row('Status PO', review.status),
        row('Barang', partial ? `${lines.length} dari ${poLineCount} baris` : `${lines.length} baris`),
        row('Department', review.departments.join(', ')),
        row(partial ? 'Nilai sisa' : 'Total PO', Format.rupiah(partial ? left : review.subTotal)),
        row('Catatan PO', note)),
    ], [
      { label: 'Kembali', value: false },
      { label: 'Buat invoice', value: true, primary: true, focus: !risky },
    ]);
  }
}

// The invoice lines table. PO lines keep what the hotel wrote; manual lines stay free to edit.
class LinesTable {
  constructor(form) {
    this.form = form;
  }

  render() {
    this.body = h('tbody');
    this.draw();
    return h('section', { class: 'panel', 'data-tour': 'lines' },
      h('h2', {}, 'Barang'),
      h('div', { class: 'table-scroll' },
        h('table', { class: this.form.fromPo ? 'table lines-table table-stack is-po' : 'table lines-table table-stack' },
          h('thead', {}, h('tr', {},
            h('th', {}, 'No.'),
            h('th', {}, 'Kode PO'),
            h('th', {}, 'Nama Barang'),
            h('th', {}, 'Banyak'),
            h('th', {}, 'Satuan'),
            h('th', { class: 'number' }, 'Harga satuan'),
            h('th', { class: 'number' }, 'Jumlah Harga'),
            h('th', { 'aria-label': 'Hapus' }))),
          this.body)),
      h('div', { class: 'panel-footer' },
        h('p', { class: 'panel-hint' }, this.form.fromPo
          ? 'Banyak mengikuti PO. Turunkan kalau barang kurang, isi 0 kalau barang tidak ada.'
          : 'Tekan Enter di baris terakhir untuk menambah baris.'),
        !this.form.fromPo && h('button', { class: 'button', type: 'button', onClick: () => this.addLine() }, '+ Tambah baris')));
  }

  draw() {
    const rows = [];
    let department;
    this.form.state.lines.forEach((line, index) => {
      if (line.department && line.department !== department) {
        rows.push(h('tr', { class: 'dept-row' }, h('td', { colspan: 8 }, line.department)));
      }
      department = line.department;
      rows.push(this.row(line, index));
    });
    this.body.replaceChildren(...rows);
  }

  row(line, index) {
    const label = (name) => `${name} baris ${index + 1}`;
    const fromPo = PoLine.isPo(line);
    // PO identity stays as the hotel wrote it; Tab skips straight to the fields a vendor may change.
    const locked = fromPo ? { readonly: true, tabindex: -1 } : {};
    const code = this.form.input(line, 'code', { type: 'text', maxlength: CreateModule.MAX_CODE, 'aria-label': label('Kode PO'), ...locked });
    const description = this.form.input(line, 'description', {
      type: 'text',
      list: fromPo ? null : 'item-options',
      maxlength: CreateModule.MAX_DESCRIPTION,
      'aria-label': label('Nama barang'),
      ...locked,
    });
    const qty = this.form.input(line, 'qty', { type: 'text', inputmode: 'decimal', 'aria-label': label('Banyak') });
    const unit = this.form.input(line, 'unit', { type: 'text', maxlength: CreateModule.MAX_UNIT, 'aria-label': label('Satuan'), ...locked });
    const price = this.form.input(line, 'price', { type: 'text', inputmode: 'numeric', class: 'number', 'aria-label': label('Harga satuan') });
    line.inputs = { code, description, qty, unit, price };
    Module.selectOnFocus(qty);
    Module.selectOnFocus(price);

    const fillFromDb = (item) => {
      if (!item) return;
      Object.assign(line, { code: item.code, description: item.description, unit: item.unit, price: Format.number(item.price) });
      for (const key of ['code', 'description', 'unit', 'price']) {
        line.inputs[key].value = line[key];
        CreateModule.clearInvalid(line.inputs[key]);
      }
      this.form.markDirty();
    };
    const find = (key, text) => this.form.items.find((item) => item[key] && item[key].toLowerCase() === text.trim().toLowerCase());
    if (!fromPo) {
      code.addEventListener('change', () => fillFromDb(find('code', line.code)));
      description.addEventListener('change', () => fillFromDb(find('description', line.description)));
    }
    price.addEventListener('change', () => {
      const parsed = Format.parseRupiah(line.price);
      if (Number.isFinite(parsed)) price.value = line.price = Format.number(parsed);
    });
    qty.addEventListener('input', () => {
      if (!fromPo || !(Format.parseQty(line.qty) > line.maxQty)) return;
      qty.value = line.qty = Format.qty(line.maxQty);
      Dialog.toast(`Maksimal ${Format.qty(line.maxQty)} ${line.unit} sesuai PO.`);
      this.form.updateTotals();
    });
    qty.addEventListener('change', () => {
      const parsed = Format.parseQty(line.qty);
      if (fromPo && !String(line.qty).trim()) qty.value = line.qty = '0';
      if (Number.isFinite(parsed) && Format.fitsThreeDecimals(parsed)) qty.value = line.qty = Format.qty(parsed);
      this.form.updateTotals();
    });

    line.priceHint = h('small', { class: 'price-hint' });
    line.amountCell = h('td', { class: 'col-amount', 'data-label': 'Jumlah Harga' });
    line.mark = fromPo ? h('span', { class: 'qty-mark' }) : null;
    const row = h('tr', {
      onKeyDown: (event) => {
        if (event.key !== 'Enter' || event.target.tagName !== 'INPUT') return;
        event.preventDefault();
        const next = this.form.state.lines[index + 1];
        if (next) next.inputs[fromPo ? 'qty' : 'description'].focus();
        else if (!this.form.fromPo) this.addLine();
      },
    },
    h('td', { class: 'col-no', 'data-label': 'Baris' }, String(index + 1).padStart(2, '0')),
    h('td', { class: 'col-code', 'data-label': 'Kode PO' }, code),
    h('td', { class: 'col-description', 'data-label': 'Nama Barang' },
      fromPo ? h('span', { class: 'line-name' }, line.description) : description,
      line.note && h('small', { class: 'line-note' }, line.note)),
    h('td', { class: 'col-qty', 'data-label': 'Banyak' }, fromPo
      ? h('div', { class: 'qty-wrap' }, line.mark, qty, h('small', { class: 'qty-max' }, `/ ${Format.qty(line.maxQty)}`))
      : qty),
    h('td', { class: 'col-unit', 'data-label': 'Satuan' }, fromPo ? unit : UnitCombobox.wrap(unit)),
    h('td', { class: 'col-price', 'data-label': 'Harga Satuan' }, price, line.priceHint),
    line.amountCell,
    h('td', { class: 'col-remove' },
      !fromPo && h('button', { class: 'icon-button', type: 'button', title: 'Hapus baris', 'aria-label': `Hapus baris ${index + 1}`, onClick: () => this.removeLine(index) }, '×')));
    line.row = row;
    return row;
  }

  addLine() {
    const line = CreateModule.blankLine();
    this.form.state.lines.push(line);
    this.body.append(this.row(line, this.form.state.lines.length - 1));
    this.form.updateTotals();
    line.inputs.description.focus();
  }

  // A misclick must not remove a filled line.
  async removeLine(index) {
    const name = this.form.state.lines[index].description.trim() || this.form.state.lines[index].code.trim();
    if (name && !await Dialog.confirm(`Hapus ${name} dari invoice ini?`, 'Hapus', true)) return;
    this.form.state.lines.splice(index, 1);
    if (this.form.state.lines.length === 0) this.form.state.lines.push(CreateModule.blankLine());
    this.draw();
    this.form.markDirty();
  }

  updateRow(index, live) {
    const line = this.form.state.lines[index];
    line.amountCell.textContent = Format.number(InvoiceCalculator.lineAmount(live));
    line.priceHint.replaceChildren(LinesTable.priceHint(live, this.form.items), this.priceChoice(line, live) || '');
    const delivery = PoLine.delivery(live);
    const price = PoLine.price(live);
    const { classList } = line.row;
    classList.toggle('is-partial', delivery === 'partial');
    classList.toggle('is-none', delivery === 'none');
    classList.toggle('price-lower', price === 'lower');
    classList.toggle('price-higher', price === 'higher');
    if (line.mark) {
      line.mark.textContent = PoLine.DELIVERY_MARKS[delivery];
      line.mark.className = `qty-mark is-${delivery}`;
      line.mark.title = PoLine.DELIVERY_LABELS[delivery];
    }
  }

  // The PO price stays the default; the vendor's list price is one deliberate click away, and so is the way back.
  // Only offered for the same unit, since a price per SAK says nothing about a price per KG.
  priceChoice(line, live) {
    if (!PoLine.isPo(live)) return null;
    if (live.price !== live.poPrice) {
      return h('button', { class: 'link-button', type: 'button', onClick: () => this.usePrice(line, live.poPrice) }, 'Pakai harga PO');
    }
    if (live.poPrice === 0) return null;
    const item = InvoiceAudit.findItem(live, this.form.items);
    if (!item || !ItemSync.same(item.unit, line.unit) || item.price === live.poPrice) return null;
    return h('button', { class: 'link-button', type: 'button', onClick: () => this.usePrice(line, item.price) }, `Daftar ${Format.number(item.price)} · Pakai`);
  }

  usePrice(line, price) {
    line.price = Format.number(price);
    line.inputs.price.value = line.price;
    this.form.markDirty();
    line.inputs.price.focus();
  }

  static priceHint(line, items) {
    if (PoLine.isPo(line)) {
      if (line.price === line.poPrice) return '';
      if (line.poPrice === 0) return 'PO Rp 0';
      const percent = ((line.price - line.poPrice) / line.poPrice) * 100;
      return `PO ${Format.number(line.poPrice)} (${InvoiceAudit.percentText(percent)})`;
    }
    const variance = InvoiceAudit.priceVariance(line, items);
    return variance ? `Daftar ${Format.number(variance.dbPrice)} (${InvoiceAudit.percentText(variance.percent)})` : '';
  }
}

// The "Detail Invoice" panel of the invoice form: customer, date, payment term and PO number.
// It remembers customers from earlier invoices and shows the due date in words.
class InvoiceDetailsPanel {
  constructor(form) {
    this.form = form;
  }

  // Suggestions for the customer field, taken from earlier invoices.
  customerList() {
    return h('datalist', { id: 'customer-options' },
      this.form.customers.map((customer) => h('option', { value: customer.name }, customer.address || customer.contact || '')));
  }

  customerFor(name) {
    const key = InvoiceRepository.customerKey(name || '');
    return key ? this.form.customers.find((customer) => InvoiceRepository.customerKey(customer.name) === key) : null;
  }

  // An edited invoice keeps its own term, and an old one without a term keeps its one-month due date.
  // A new invoice follows the customer's last invoice, then Pengaturan.
  initialTerm(source) {
    const { original, config } = this.form;
    if (original) {
      const { termDays, date } = original;
      return Number.isInteger(termDays) ? termDays : DateUtil.daysBetween(date, DateUtil.addMonths(date, 1));
    }
    const known = this.customerFor(source ? source.customer.name : config.customer.name);
    return known ? known.termDays : config.termDays;
  }

  // True when the saved invoice must carry the term on screen. An invoice from before terms existed
  // keeps its one-month due date unless the term or the date is changed, and then saves the due date shown.
  termChanged() {
    const { original, state } = this.form;
    return !original || Number.isInteger(original.termDays) || state.termDays !== this.openedTerm || state.date !== original.date;
  }

  // A known name fills the rest from that customer's last invoice, on a pick from the list or on leaving the field,
  // never per keystroke, so 'Hotel Santika' on the way to 'Hotel Santika Premiere' takes nothing.
  // Only fields still empty or still holding what the form put there change, so typed details are kept.
  // A PO already carries fresher contact details, so it only takes the term.
  fillCustomer(apply) {
    const { state, fields, fromPo, config } = this.form;
    const known = this.customerFor(state.customer.name);
    if (known !== this.filledFrom) this.customerHint.textContent = '';
    if (!apply || known === this.filledFrom) return;
    // A name no one used before clears what an earlier fill wrote, so no other customer's address is printed.
    if (!known && !this.autoFilled) return;
    this.filledFrom = known;
    this.autoFilled = Boolean(known);
    if (!fromPo) {
      for (const key of ['attn', 'contact', 'address']) {
        if (state.customer[key] && state.customer[key] !== this.autoValues[key]) continue;
        state.customer[key] = (known && known[key]) || '';
        fields[key].value = state.customer[key];
        this.autoValues[key] = state.customer[key];
      }
    }
    if (!this.termTouched) {
      state.termDays = String(known ? known.termDays : config.termDays);
      fields.termDays.value = state.termDays;
      this.updateDue();
    }
    if (!known || !known.number) return;
    const source = `${known.number}, ${Format.date(known.date)}`;
    if (!fromPo) this.customerHint.textContent = `Diisi dari ${source}`;
    else if (!this.termTouched) this.customerHint.textContent = `Termin diisi dari ${source}`;
  }

  // Dates are spelled out in words, so 11/03 is never read as 3 November or 11 March by mistake.
  updateDue() {
    const { date, termDays } = this.form.state;
    const valid = /^\d{4}-\d{2}-\d{2}$/.test(date);
    const term = Reminder.parseTerm(termDays);
    this.dateHint.textContent = valid ? RangeCalendar.longDate(date) : '';
    // A missing date is reported under Tanggal on save, so the term is not blamed for it here.
    if (!valid) this.dueHint.textContent = '';
    else if (term === null) this.dueHint.textContent = 'Isi 0 sampai 180 hari';
    else this.dueHint.textContent = term === 0 ? 'Tunai, jatuh tempo hari itu juga' : `Jatuh tempo ${RangeCalendar.longDate(DateUtil.addDays(date, term))}`;
  }

  render() {
    const { form } = this;
    const { state, fields } = form;
    fields.customerName = form.input(state.customer, 'name', {
      type: 'text', maxlength: 60, placeholder: 'Contoh: Marriott Bandar Lampung', 'data-tour': 'customer', list: 'customer-options', autocomplete: 'off',
    });
    // A pick from the suggestion list arrives as one replacement, not as typed letters.
    fields.customerName.addEventListener('input', (event) => this.fillCustomer(!event.inputType || event.inputType === 'insertReplacementText'));
    fields.customerName.addEventListener('change', () => this.fillCustomer(true));
    // On leaving the field, a known name takes its recorded spelling, so 'hotel contoh' prints as 'Hotel Contoh'.
    fields.customerName.addEventListener('change', () => {
      const known = this.customerFor(state.customer.name);
      if (!known || state.customer.name === known.name) return;
      state.customer.name = known.name;
      fields.customerName.value = known.name;
    });
    fields.attn = form.input(state.customer, 'attn', { type: 'text', maxlength: 60 });
    fields.contact = form.input(state.customer, 'contact', { type: 'text', maxlength: 60 });
    fields.address = form.input(state.customer, 'address', { type: 'text', maxlength: 100 });
    fields.date = form.input(state, 'date', { type: 'date' });
    Module.pickerOnClick(fields.date);
    fields.date.addEventListener('input', () => this.updateDue());
    fields.termDays = form.input(state, 'termDays', { type: 'text', inputmode: 'numeric', maxlength: 3, class: 'number' });
    Module.selectOnFocus(fields.termDays);
    fields.termDays.addEventListener('input', () => {
      this.termTouched = true;
      this.updateDue();
    });
    this.customerHint = h('span', {});
    this.dateHint = h('span', {});
    this.dueHint = h('span', {});
    // Opening the page must not refill what the form already holds.
    this.filledFrom = this.customerFor(state.customer.name);
    this.autoFilled = false;
    this.termTouched = false;
    this.openedTerm = state.termDays;
    this.autoValues = { attn: state.customer.attn || '', contact: state.customer.contact || '', address: state.customer.address || '' };
    return h('section', { class: 'panel' },
      h('h2', {}, 'Detail Invoice'),
      h('div', { class: 'form-grid form-grid-3' },
        form.field('Nama pelanggan', fields.customerName, this.customerHint, true),
        form.field('Attn', fields.attn),
        form.field('Kontak pelanggan', fields.contact),
        form.field('Alamat pelanggan', fields.address, null, false, true),
        form.field('Tanggal', fields.date, this.dateHint, true),
        form.field('Termin (hari)', fields.termDays, this.dueHint, true),
        // The PO number links deliveries together, so a PO-based invoice cannot change it.
        state.lines.some(PoLine.isPo)
          ? form.field('No. PO', form.input(state, 'poNumber', { type: 'text', readonly: true, class: 'is-locked' }), 'Terkunci karena mengikuti PO')
          : form.field('No. PO', form.input(state, 'poNumber', { type: 'text', maxlength: 30 }), 'Kosongkan kalau tidak ada PO')));
  }
}

// Every check the invoice form runs before saving, in the order a vendor reads the form.
// It changes nothing: it returns either the first problem, with the field to fix,
// or the cleaned lines and totals that are ready to save.
class InvoiceFormValidator {
  static validate(form) {
    const { state, config, fields } = form;
    if (!config.store.name.trim()) {
      return { error: 'Nama toko belum diisi.', link: { href: '#/config', label: 'Buka Pengaturan Toko' } };
    }
    if (!state.customer.name.trim()) return { error: 'Nama pelanggan belum diisi.', target: fields.customerName };
    if (!state.date) return { error: 'Tanggal belum diisi.', target: fields.date };
    if (state.date < '2000-01-01' || state.date > '2100-12-31') return { error: 'Tahun pada tanggal invoice tidak wajar.', target: fields.date };
    if (Reminder.parseTerm(state.termDays) === null) return { error: 'Termin harus angka 0 sampai 180 hari.', target: fields.termDays };

    const checked = InvoiceFormValidator.lines(form);
    if (checked.error) return checked;
    const { lines } = checked;

    const ppnRate = form.ppnRateValue();
    if (state.ppnEnabled && !(ppnRate > 0 && ppnRate <= 100)) return { error: 'Tarif PPN harus di antara 0 dan 100.', target: fields.ppnRate };
    const discount = Format.parseRupiah(state.discount);
    if (Number.isNaN(discount)) return { error: 'Diskon harus rupiah bulat, contoh 50.000.', target: fields.discount };
    const finalRate = ppnRate > 0 ? ppnRate : config.ppnRate;
    const totals = InvoiceCalculator.totals({ lines, discount, ppnEnabled: state.ppnEnabled, ppnRate: finalRate });
    if (totals.taxBase <= 0 && discount > 0) return { error: 'Diskon harus lebih kecil dari subtotal.', target: fields.discount };
    if (totals.taxBase <= 0 && !form.fromPo) return { error: 'Total invoice masih Rp 0. Periksa Banyak dan Harga satuan.' };
    if (totals.total > InvoiceCalculator.MAX_TOTAL) return { error: 'Total melebihi batas Rp 999.999.999.999. Periksa qty dan harga.' };
    return { lines, discount, ppnRate: finalRate, totals };
  }

  // Blank rows are skipped. A PO row may stay at 0 or without a price when the PO itself has none.
  static lines(form) {
    const { state, items } = form;
    const lines = [];
    for (const [index, line] of state.lines.entries()) {
      const isBlank = !line.code.trim() && !line.description.trim() && !String(line.qty).trim() && !String(line.price).trim();
      if (isBlank) continue;
      const rowName = `Baris ${index + 1}`;
      const fromPo = PoLine.isPo(line);
      const qty = fromPo && !String(line.qty).trim() ? 0 : Format.parseQty(line.qty);
      const price = Format.parseRupiah(line.price);
      if (!line.description.trim()) return { error: `${rowName}: nama barang belum diisi.`, target: line.inputs.description };
      if (!Number.isFinite(qty) || (qty <= 0 && !fromPo)) return { error: `${rowName}: banyak barang harus angka lebih dari 0, contoh 2,5.`, target: line.inputs.qty };
      if (fromPo && qty > line.maxQty) return { error: `${rowName}: banyak barang melebihi PO.`, target: line.inputs.qty };
      if (!Format.fitsThreeDecimals(qty)) return { error: `${rowName}: banyak barang maksimal 3 angka di belakang koma.`, target: line.inputs.qty };
      if (Number.isNaN(price)) return { error: `${rowName}: harga harus rupiah bulat, contoh 12.500.`, target: line.inputs.price };
      const priceOptional = fromPo && (line.poPrice === 0 || qty === 0);
      if (price <= 0 && !priceOptional) return { error: `${rowName}: harga satuan belum diisi.`, target: line.inputs.price };
      lines.push({
        code: line.code.trim(),
        description: line.description.trim(),
        unit: UnitCatalog.canonical(line.unit, items),
        qty,
        price,
        ...(fromPo && { poLine: line.poLine, poQty: line.poQty, poPrice: line.poPrice, department: line.department, note: line.note }),
      });
    }
    if (lines.length === 0) return { error: 'Tambahkan minimal satu barang.', target: state.lines[0].inputs.description };
    if (lines.every((line) => line.qty === 0)) return { error: 'Semua barang masih 0. Isi Banyak minimal satu barang.', target: state.lines[0].inputs.qty };
    return { lines };
  }
}

  <script>
// After an invoice is saved, its lines update Daftar Barang: new items are added directly,
// and items that differ are shown side by side so the vendor chooses which data to keep.
class ItemSyncPrompt {
  constructor(app) {
    this.app = app;
  }

  // Returns the message for the toast. The invoice is already safe here,
  // so a failure in Daftar Barang must not read as a failed save.
  async run(lines, previousLines = []) {
    try {
      const edited = ItemSync.editedLines(lines, previousLines);
      const { added, changes } = ItemSync.review(edited, await this.app.items.all());
      if (added.length > 0) await this.app.items.sync(added, []);
      const accepted = changes.length > 0 ? await this.compare(changes) : [];
      if (accepted.length > 0) await this.app.items.sync([], accepted);
      return [
        'Invoice tersimpan.',
        added.length > 0 && `${added.length} barang baru masuk Daftar Barang.`,
        accepted.length > 0 && `${accepted.length} barang di Daftar Barang diperbarui.`,
      ].filter(Boolean).join(' ');
    } catch (error) {
      return 'Invoice tersimpan, tetapi Daftar Barang belum diperbarui.';
    }
  }

  // Every item starts on "Biarkan", so nothing in Daftar Barang changes unless the vendor asks for it.
  async compare(changes) {
    const chosen = new Set();
    const confirmed = await Dialog.open('Bandingkan dengan Daftar Barang', [
      h('p', {}, 'Barang ini sudah ada di Daftar Barang dengan data berbeda. Pilih data untuk invoice berikutnya. Invoice ini tidak berubah.'),
      h('div', { class: 'compare-list' }, changes.map((change) => ItemSyncPrompt.choice(change, chosen))),
    ], [{ label: 'Simpan pilihan', value: true, primary: true }]);
    return confirmed ? changes.filter((change) => chosen.has(change)) : [];
  }

  static choice(change, chosen) {
    const show = ({ key }, value) => (key === 'price' ? Format.rupiah(value) : value || '—');
    const options = [{ update: false, label: 'Biarkan' }, { update: true, label: 'Perbarui' }];
    const buttons = options.map(({ update, label }) => h('button', {
      class: update ? '' : 'is-active',
      type: 'button',
      'aria-pressed': String(!update),
      onClick: () => {
        if (update) chosen.add(change);
        else chosen.delete(change);
        buttons.forEach((button, index) => {
          const isActive = options[index].update === update;
          button.classList.toggle('is-active', isActive);
          button.setAttribute('aria-pressed', String(isActive));
        });
      },
    }, label));
    return h('div', { class: 'compare-item' },
      h('div', { class: 'compare-head' },
        h('strong', {}, change.item.description),
        h('div', { class: 'segmented', role: 'group', 'aria-label': `Pilihan untuk ${change.item.description}` }, buttons)),
      change.differences.map((difference) => h('div', { class: 'compare-value' },
        h('span', {}, difference.label),
        h('span', {}, `Daftar: ${show(difference, difference.db)}`),
        h('strong', {}, `Invoice: ${show(difference, difference.invoice)}`))));
  }
}

  <script>
// Buat Invoice / Ubah Invoice page. It owns the form state, the totals and saving.
// The details panel, the line table, the save checks and the Daftar Barang update live in their own classes:
// InvoiceDetailsPanel, LinesTable, InvoiceFormValidator and ItemSyncPrompt.
class CreateModule extends Module {
  static MAX_DESCRIPTION = 80;
  static MAX_CODE = 16;
  static MAX_UNIT = 8;

  isDirty() {
    return Boolean(this.dirty);
  }

  markDirty() {
    this.dirty = true;
    if (this.barMessage) this.barMessage.textContent = '';
    this.updateTotals();
  }

  static clearInvalid(input) {
    input.classList.remove('is-invalid');
    input.removeAttribute('aria-invalid');
  }

  async render(outlet, params) {
    this.config = await this.app.config.get();
    this.items = await this.app.items.all();
    const id = params[0] ? Number(params[0]) : null;
    this.original = Number.isInteger(id) ? await this.app.invoices.get(id) : null;
    this.invoices = await this.app.invoices.all();
    this.customers = InvoiceRepository.customers(this.invoices, this.config);
    if (params[0] && (!this.original || this.original.voided)) {
      this.app.router.go('invoices');
      return;
    }
    if (this.original && this.original.paid) {
      Dialog.toast('Invoice sudah dibayar sehingga tidak bisa diubah.');
      this.app.router.go(`invoice/${this.original.id}`);
      return;
    }
    this.details = new InvoiceDetailsPanel(this);
    this.state = this.initialState();
    this.message = h('div', { class: 'no-print' });
    this.fields = {};

    this.fromPo = this.state.lines.some(PoLine.isPo);
    this.table = new LinesTable(this);
    const description = this.original
      ? `Nomor ${this.original.number} tetap sama walaupun isi atau tanggalnya diubah.`
      : (this.fromPo ? 'Data terisi dari PO. Periksa kolom Banyak dan Harga satuan, lalu simpan.' : 'Pilih barang dari daftar atau ketik baru. Kolom bertanda * wajib diisi.');
    outlet.append(h('div', { class: 'page' },
      this.pageHeader('Penagihan', this.original ? 'Ubah Invoice' : 'Buat Invoice Baru', description),
      this.message,
      this.datalist(),
      this.details.customerList(),
      this.details.render(),
      this.table.render(),
      this.summaryPanel(),
      this.actionBar()));
    this.updateTotals();
    this.details.updateDue();
    this.warnIfNotReady();
  }

  warnIfNotReady() {
    if (this.original) return;
    const { store, invoiceNumber } = this.config;
    const fromPo = this.state.lines.some(PoLine.isPo);
    const link = { href: '#/config', label: 'Buka Pengaturan Toko' };
    if (!store.name.trim()) {
      this.showMessage('Nama toko belum diisi, jadi invoice belum bisa disimpan.', 'warning', link);
    } else if (NumberFormatter.needsInput(invoiceNumber.pattern) && !invoiceNumber.input.trim()) {
      this.showMessage('Pola nomor invoice butuh masukan.', 'warning', link);
    } else if (!this.config.bank.account.trim()) {
      // The invoice keeps the bank details it was issued with, so filling them in later will not fix it.
      this.showMessage('Rekening bank belum diisi, jadi invoice ini tercetak tanpa nomor rekening.', 'warning', link);
    } else if (this.items.length === 0 && !fromPo) {
      this.showMessage('Daftar Barang masih kosong. Barang yang diketik di sini otomatis masuk daftar saat invoice disimpan.', 'info');
    }
  }

  initialState() {
    const source = this.original || this.app.pendingDraft;
    const config = this.config;
    this.app.pendingDraft = null;
    this.dirty = Boolean(source && !this.original);
    return {
      customer: { ...config.customer, ...(source ? source.customer : {}) },
      date: (source && source.date) || DateUtil.today(),
      poNumber: (source && source.poNumber) || '',
      poTotal: source && source.poTotal,
      note: source && source.note !== undefined ? source.note : config.note,
      discount: (source && source.discount) || 0,
      ppnEnabled: Boolean(source && source.ppnEnabled),
      ppnRate: (source && source.ppnRate) || config.ppnRate,
      includeSj: Boolean(source && source.includeSj),
      termDays: String(this.details.initialTerm(source)),
      lines: source
        ? source.lines.map((line) => ({
          ...line,
          qty: Format.qty(line.qty),
          price: Format.number(line.price),
          maxQty: this.original && PoLine.isPo(line) ? PoLine.editLimit(line, this.original, this.invoices) : line.poQty,
        }))
        : [CreateModule.blankLine()],
    };
  }

  static blankLine() {
    return { code: '', description: '', unit: '', qty: '', price: '' };
  }

  datalist() {
    return h('datalist', { id: 'item-options' },
      this.items.map((item) => h('option', { value: item.description }, `${item.code || ''} ${Format.rupiah(item.price)}`.trim())));
  }

  input(object, key, attrs = {}) {
    const element = h('input', {
      ...attrs,
      value: object[key],
      onInput: (event) => {
        object[key] = event.target.value;
        CreateModule.clearInvalid(event.target);
        this.markDirty();
      },
    });
    return element;
  }

  summaryPanel() {
    const { state, fields } = this;
    const discount = this.input(state, 'discount', { type: 'text', inputmode: 'numeric', class: 'number', 'aria-label': 'Diskon' });
    discount.value = Format.number(state.discount);
    discount.addEventListener('change', () => {
      const parsed = Format.parseRupiah(state.discount);
      if (Number.isFinite(parsed)) discount.value = Format.number(parsed);
    });
    fields.discount = discount;
    Module.selectOnFocus(discount);
    fields.ppnRate = this.input(state, 'ppnRate', { type: 'text', inputmode: 'decimal', class: 'number', 'aria-label': 'Tarif PPN persen' });
    Module.selectOnFocus(fields.ppnRate);
    const toggle = (key, label) => h('label', { class: 'check' },
      h('input', {
        type: 'checkbox',
        checked: state[key],
        onChange: (event) => {
          state[key] = event.target.checked;
          this.markDirty();
        },
      }),
      label);

    this.subtotalValue = h('span');
    this.ppnValue = h('span');
    this.ppnRow = h('div', { class: 'totals-row' }, h('span', {}, 'PPN'), this.ppnValue);
    this.totalValue = h('span');

    return h('section', { class: 'panel' },
      h('h2', {}, 'Ringkasan'),
      h('div', { class: 'summary-grid' },
        h('div', {},
          this.field('Catatan', this.textarea(state, 'note'), 'Contoh untuk kiriman parsial: Pengiriman ke-2 dari 3'),
          h('div', { class: 'options' },
            h('div', { class: 'option-row' }, toggle('ppnEnabled', 'Tambahkan PPN'), fields.ppnRate, '%'),
            h('div', { class: 'option-row' }, toggle('includeSj', 'Buat Surat Jalan')))),
        h('div', {},
          h('div', { class: 'totals-row' }, h('span', {}, 'Subtotal'), this.subtotalValue),
          h('div', { class: 'totals-row' }, h('span', {}, 'Diskon (Rp)'), discount),
          this.ppnRow,
          h('div', { class: 'totals-row totals-grand' }, h('span', {}, 'TOTAL'), this.totalValue))));
  }

  actionBar() {
    this.barTotal = h('strong');
    // Errors live here because this bar is always visible at any scroll position.
    this.barMessage = h('div', { class: 'action-message', role: 'alert' });
    this.saveButton = h('button', { class: 'button button-primary', type: 'button', onClick: () => this.save() },
      this.original ? 'Simpan perubahan' : 'Simpan invoice');
    this.barProgress = this.fromPo ? h('div', { class: 'action-progress' }) : null;
    return h('div', { class: 'action-bar' },
      h('div', { class: 'action-total' }, 'Total invoice', this.barTotal),
      this.barProgress,
      this.barMessage,
      h('div', { class: 'form-actions' },
        h('a', { class: 'button', href: this.original ? `#/invoice/${this.original.id}` : '#/' }, 'Batal'),
        this.saveButton));
  }

  textarea(object, key) {
    return h('textarea', {
      value: object[key],
      rows: 3,
      maxlength: 240,
      onInput: (event) => {
        object[key] = event.target.value;
        this.markDirty();
      },
    });
  }

  // Incomplete lines count as zero so the total stays readable while typing.
  liveLines() {
    return this.state.lines.map((line) => {
      // A trailing comma means the vendor is still typing a decimal such as 2,5.
      const qty = Format.parseQty(String(line.qty).replace(/[.,]$/, ''));
      const price = Format.parseRupiah(line.price);
      return {
        code: line.code,
        description: line.description,
        qty: Number.isFinite(qty) ? qty : 0,
        price: Number.isFinite(price) ? price : 0,
        poQty: line.poQty,
        poPrice: line.poPrice,
      };
    });
  }

  ppnRateValue() {
    return Format.parseQty(this.state.ppnRate);
  }

  updateTotals() {
    if (!this.totalValue) return;
    const lines = this.liveLines();
    lines.forEach((line, index) => this.table.updateRow(index, line));
    const totals = InvoiceCalculator.totals({
      lines,
      discount: Format.parseRupiah(this.state.discount) || 0,
      ppnEnabled: this.state.ppnEnabled,
      ppnRate: this.ppnRateValue() || 0,
    });
    this.subtotalValue.textContent = Format.rupiah(totals.subtotal);
    this.ppnValue.textContent = Format.rupiah(totals.ppn);
    this.ppnRow.style.display = this.state.ppnEnabled ? '' : 'none';
    this.totalValue.textContent = Format.rupiah(totals.total);
    this.barTotal.textContent = Format.rupiah(totals.total);
    if (this.barProgress) this.drawProgress(lines);
  }

  // Shows how the delivery compares with the PO without scrolling through every line.
  drawProgress(lines) {
    const counts = PoLine.count(lines, PoLine.delivery);
    const poTotal = lines.reduce((sum, line) => sum + InvoiceCalculator.lineAmount({ qty: line.poQty, price: line.poPrice }), 0);
    this.barProgress.replaceChildren(
      ...['full', 'partial', 'none'].map((tone) => h('span', { title: PoLine.DELIVERY_LABELS[tone] },
        h('b', { class: `qty-mark is-${tone}` }, PoLine.DELIVERY_MARKS[tone]), ` ${counts[tone] || 0}`)),
      h('span', {}, `PO ${Format.rupiah(poTotal)}`));
  }

  showMessage(text, kind = 'error', link) {
    this.message.replaceChildren(h('div', { class: `notice notice-${kind}`, role: 'alert' },
      text, link && [' ', h('a', { href: link.href }, link.label)]));
  }

  // This lock stops a double click from creating two invoices for one bill.
  async save() {
    if (this.saving) return;
    this.saving = true;
    this.saveButton.disabled = true;
    try {
      await this.submit();
    } finally {
      this.saving = false;
      this.saveButton.disabled = false;
    }
  }

  async confirmWarnings(fields, totals) {
    const warnings = InvoiceAudit.review({ ...fields, totals }, {
      items: this.items,
      invoices: await this.app.invoices.all(),
      today: DateUtil.today(),
      id: this.original ? this.original.id : null,
    });
    if (warnings.length === 0) return true;
    return Dialog.open('Periksa sebelum menyimpan', [
      h('ul', {}, warnings.map((warning) => h('li', {}, warning))),
    ], [
      { label: 'Periksa lagi', value: false },
      { label: 'Tetap simpan', value: true, primary: true },
    ]);
  }

  async submit() {
    const result = InvoiceFormValidator.validate(this);
    if (result.error) {
      this.barMessage.textContent = result.error;
      if (result.link) this.showMessage(result.error, 'error', result.link);
      if (result.target) {
        result.target.classList.add('is-invalid');
        result.target.setAttribute('aria-invalid', 'true');
        result.target.focus();
      }
      return;
    }
    const { state } = this;
    const fields = {
      customer: {
        name: state.customer.name.trim(),
        attn: (state.customer.attn || '').trim(),
        contact: state.customer.contact.trim(),
        address: state.customer.address.trim(),
      },
      date: state.date,
      poNumber: state.poNumber.trim(),
      ...(state.poTotal && { poTotal: state.poTotal }),
      note: state.note.trim(),
      discount: result.discount,
      ppnEnabled: state.ppnEnabled,
      ppnRate: result.ppnRate,
      includeSj: state.includeSj,
      ...(this.details.termChanged() && { termDays: Reminder.parseTerm(state.termDays) }),
      lines: result.lines,
    };
    if (!await this.confirmWarnings(fields, result.totals)) return;
    let invoice;
    try {
      invoice = this.original
        ? await this.app.invoices.revise(this.original.id, fields)
        : await this.app.invoices.create(fields);
      this.dirty = false;
    } catch (error) {
      if (error instanceof InvoiceLockedError) {
        this.barMessage.textContent = `${error.message} Perubahan tidak disimpan.`;
        return;
      }
      this.barMessage.textContent = 'Invoice gagal disimpan. Data belum berubah, silakan coba lagi.';
      throw error;
    }
    Dialog.toast(await new ItemSyncPrompt(this.app).run(fields.lines, this.original ? this.original.lines : []));
    if (this.app.router.current === this) this.app.router.go(`invoice/${invoice.id}`);
  }
}

  <script>
class ItemsModule extends Module {
  isDirty() {
    return Boolean(this.dirty);
  }

  async render(outlet) {
    this.items = await this.app.items.all();
    this.editing = null;
    this.search = '';
    this.message = h('div');
    this.form = h('section', { class: 'panel' });
    this.list = h('section', { class: 'panel' });
    outlet.append(h('div', { class: 'page' },
      this.pageHeader('Data Toko', 'Daftar Barang dan Harga', 'Harga di sini dipakai saat membuat invoice. Kolom bertanda * wajib diisi.'),
      this.message,
      this.form,
      this.list));
    this.renderForm();
    this.renderList();
  }

  renderForm() {
    const item = this.editing || { code: '', description: '', unit: '', price: 0 };
    this.dirty = false;
    const code = h('input', { type: 'text', value: item.code, maxlength: CreateModule.MAX_CODE });
    const description = h('input', { type: 'text', value: item.description, maxlength: CreateModule.MAX_DESCRIPTION, required: true });
    const unit = h('input', { type: 'text', value: item.unit, maxlength: CreateModule.MAX_UNIT, placeholder: 'EA, KG, PK' });
    const price = h('input', { type: 'text', inputmode: 'numeric', class: 'number', value: item.price ? Format.number(item.price) : '' });
    Module.selectOnFocus(price);
    price.addEventListener('change', () => {
      const parsed = Format.parseRupiah(price.value);
      if (Number.isFinite(parsed)) price.value = Format.number(parsed);
    });

    const form = h('form', {
      onInput: () => { this.dirty = true; },
      onSubmit: (event) => {
        event.preventDefault();
        this.save({
          ...item,
          code: code.value.trim(),
          description: description.value.trim(),
          unit: unit.value.trim(),
          price: Format.parseRupiah(price.value),
        });
      },
    },
    h('div', { class: 'form-grid' },
      this.field('Kode Barang PO', code, 'Khusus Marriott, boleh kosong'),
      this.field('Nama barang', description, null, true),
      this.field('Satuan', UnitCombobox.wrap(unit)),
      this.field('Harga', price, null, true)),
    h('div', { class: 'form-actions' },
      this.editing && h('button', { class: 'button', type: 'button', onClick: () => this.cancelEdit() }, 'Batal'),
      h('button', { class: 'button button-primary', type: 'submit' }, this.editing ? 'Simpan perubahan' : 'Tambah barang')));
    this.form.replaceChildren(h('h2', {}, this.editing ? 'Ubah Barang' : 'Tambah Barang'), form);
    if (this.editing) description.focus();
    else if (this.keepFocus) code.focus();
    this.keepFocus = false;
  }

  cancelEdit() {
    this.editing = null;
    this.renderForm();
  }

  async save(item) {
    if (this.saving) return undefined;
    if (!item.description) return this.showError('Nama barang belum diisi.');
    if (!(item.price > 0)) return this.showError('Harga harus rupiah bulat lebih dari 0, contoh 12.500.');
    const others = this.items.filter((other) => other.id !== item.id);
    const sameCode = item.code && others.find((other) => other.code.toLowerCase() === item.code.toLowerCase());
    if (sameCode) return this.showError(`Kode ${item.code} sudah dipakai oleh ${sameCode.description}.`);
    const sameName = !item.code && others.find((other) => other.description.toLowerCase() === item.description.toLowerCase());
    if (sameName) return this.showError(`${item.description} sudah ada di daftar.`);
    this.saving = true;
    try {
      this.message.replaceChildren();
      await this.app.items.save(item);
      Dialog.toast('Barang tersimpan.');
      this.editing = null;
      this.items = await this.app.items.all();
      this.keepFocus = true;
      this.renderForm();
      this.renderList();
    } finally {
      this.saving = false;
    }
    return undefined;
  }

  showError(text) {
    this.message.replaceChildren(h('div', { class: 'notice notice-error', role: 'alert' }, text));
  }

  matches(item) {
    const text = `${item.code} ${item.description}`.toLowerCase();
    return text.includes(this.search.toLowerCase());
  }

  download() {
    TransferService.save(Xlsx.blob('Daftar Barang', TransferService.itemRows(this.items)), `Daftar-Barang-${DateUtil.today()}.xlsx`);
    Dialog.toast(`Daftar ${this.items.length} barang dibuat. Buka dengan Excel.`);
  }

  renderList() {
    this.rows = h('tbody');
    this.list.replaceChildren(
      h('h2', {}, 'Daftar Barang'),
      h('div', { class: 'toolbar' },
        h('div', { class: 'search' }, this.field(`Cari dari ${this.items.length} barang`, h('input', {
          type: 'search',
          value: this.search,
          onInput: (event) => {
            this.search = event.target.value;
            this.renderRows();
          },
        }))),
        // The whole list is downloaded, even while a search narrows what is on screen.
        this.items.length > 0 && h('button', { class: 'button items-download', type: 'button', onClick: () => this.download() }, 'Unduh semua (Excel)')),
      h('div', { class: 'table-scroll' },
        h('table', { class: 'table table-stack' },
          h('thead', {}, h('tr', {},
            h('th', {}, 'Kode Barang PO'),
            h('th', {}, 'Nama Barang'),
            h('th', {}, 'Satuan'),
            h('th', { class: 'number' }, 'Harga'),
            h('th', { 'aria-label': 'Aksi' }))),
          this.rows)));
    this.renderRows();
  }

  renderRows() {
    const visible = this.items.filter((item) => this.matches(item));
    if (visible.length === 0) {
      const text = this.items.length === 0 ? 'Belum ada barang. Tambahkan barang pertama di atas.' : 'Tidak ada barang yang cocok.';
      this.rows.replaceChildren(h('tr', {}, h('td', { class: 'empty', colspan: 5 }, text)));
      return;
    }
    this.rows.replaceChildren(...visible.map((item) => h('tr', {},
      h('td', { 'data-label': 'Kode Barang PO' }, item.code || '—'),
      h('td', { 'data-label': 'Nama Barang' }, item.description),
      h('td', { 'data-label': 'Satuan' }, item.unit),
      h('td', { class: 'number', 'data-label': 'Harga' }, Format.number(item.price)),
      h('td', { class: 'number' },
        h('button', { class: 'button button-small', type: 'button', onClick: () => this.edit(item) }, 'Ubah'), ' ',
        h('button', { class: 'button button-small button-danger', type: 'button', onClick: () => this.remove(item) }, 'Hapus')))));
  }

  async edit(item) {
    if (this.dirty && !await Dialog.confirm('Barang yang sedang diisi belum disimpan. Tinggalkan isiannya?', 'Tinggalkan')) return;
    this.editing = item;
    this.renderForm();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async remove(item) {
    const confirmed = await Dialog.confirm(`Hapus ${item.description} dari daftar? Invoice lama tidak berubah.`, 'Hapus', true);
    if (!confirmed) return;
    await this.app.items.delete(item.id);
    this.items = await this.app.items.all();
    if (this.editing && this.editing.id === item.id) this.cancelEdit();
    this.renderList();
  }
}

  <script>
class InvoicesModule extends Module {
  // Redraw after a typing pause, so a word matching thousands of invoices does not stall typing.
  static SEARCH_DELAY_MS = 200;
  static MODES = [
    { id: 'day', label: 'Hari' },
    { id: 'week', label: 'Minggu' },
    { id: 'month', label: 'Bulan' },
  ];

  // Chosen but not yet marked invoices count as unsaved work, so leaving the page asks first.
  isDirty() {
    return Boolean(this.dirty);
  }

  // Someone used to the old instant tick may think the ticks are already saved.
  leaveMessage() {
    return `${this.selected.size} invoice sudah dicentang tapi belum ditandai sudah dibayar. Tinggalkan halaman ini?`;
  }

  async render(outlet) {
    this.filter = this.app.invoiceFilter;
    if (this.filter.day !== DateUtil.today() && !this.filter.range) {
      Object.assign(this.filter, { anchor: DateUtil.today(), day: DateUtil.today() });
    }
    this.view = outlet;
    // A tick only chooses; one confirmation marks every chosen invoice, because one transfer often pays several.
    this.selected = new Set();
    this.dirty = false;
    this.body = h('div');
    this.bar = this.selectionBar();
    // Always in the page, because a live region that appears together with its text is often not read out.
    this.announcer = h('p', { class: 'sr-only selection-status', 'aria-live': 'polite' });
    const header = this.pageHeader('Penagihan', 'Invoice Tersimpan', 'Centang invoice yang sudah dibayar, lalu tekan Tandai sudah dibayar.',
      [h('a', { class: 'button', href: '#/aging' }, 'Umur piutang'), h('a', { class: 'button button-primary', href: '#/create' }, '+ Buat invoice')]);
    this.backLink = header.querySelector('.back-link');
    outlet.append(h('div', { class: 'page' },
      header,
      this.body,
      this.announcer,
      this.bar));
    await this.reload();
  }

  // The control just used is often redrawn or hidden, so keyboard focus returns to the page instead of the top.
  keepFocus() {
    this.view.focus({ preventScroll: true });
  }

  async reload() {
    this.invoices = await this.app.invoices.all();
    const open = new Set(this.invoices.filter((invoice) => !invoice.paid && !invoice.voided).map((invoice) => invoice.id));
    for (const id of this.selected) if (!open.has(id)) this.selected.delete(id);
    this.app.updateAlarm();
    this.draw();
  }

  draw() {
    this.results = h('div');
    this.body.replaceChildren(this.reminders(), this.toolbar(), this.results);
    this.drawResults();
  }

  reminders() {
    const today = DateUtil.today();
    const due = Reminder.due(this.invoices, today);
    if (due.length === 0) return '';
    const total = due.reduce((sum, invoice) => sum + invoice.totals.total, 0);
    return h('div', { class: 'notice notice-warning', role: 'status' },
      h('strong', {}, `${due.length} invoice sudah jatuh tempo, total ${Format.rupiah(total)}. Centang yang sudah dibayar.`),
      h('div', { class: 'reminder-list' }, due.map((invoice) => h('div', { class: 'reminder-item' },
        h('label', { class: 'check reminder-main' },
          this.pickBox(invoice),
          h('span', {},
            h('a', { href: `#/invoice/${invoice.id}` }, invoice.number),
            // The agreed term is at hand when the vendor phones the hotel about it.
            ` • ${invoice.customer.name} • ${Format.rupiah(invoice.totals.total)} • ${Reminder.dueText(invoice, today)}`,
            Number.isInteger(invoice.termDays) ? ` (termin ${invoice.termDays} hari)` : '')),
        h('button', {
          class: 'button button-small',
          type: 'button',
          'aria-label': `Belum, ingatkan minggu depan: ${invoice.number}`,
          onClick: () => this.snooze(invoice),
        }, 'Belum, ingatkan minggu depan')))));
  }

  pickBox(invoice) {
    return h('input', {
      type: 'checkbox',
      'data-pick': invoice.id,
      'aria-label': `Pilih ${invoice.number} untuk ditandai sudah dibayar`,
      onChange: (event) => {
        if (event.target.checked) this.selected.add(invoice.id);
        else this.selected.delete(invoice.id);
        this.syncSelection();
      },
    });
  }

  // The same invoice can sit in the reminder and in the table, so every box for it shows one choice.
  syncSelection() {
    for (const box of this.body.querySelectorAll('[data-pick]')) {
      box.checked = this.selected.has(Number(box.dataset.pick));
      const label = box.parentElement.querySelector('.pick-label');
      if (label) label.textContent = box.checked ? 'Dipilih' : 'Belum';
    }
    const chosen = this.invoices.filter((invoice) => this.selected.has(invoice.id));
    this.dirty = chosen.length > 0;
    this.bar.hidden = !this.dirty;
    const total = Format.rupiah(chosen.reduce((sum, invoice) => sum + invoice.totals.total, 0));
    this.barCount.textContent = `${chosen.length} invoice dipilih`;
    this.barTotal.textContent = total;
    this.announcer.textContent = this.dirty ? `${chosen.length} invoice dipilih, total ${total}` : '';
  }

  selectionBar() {
    this.barCount = h('span', {});
    this.barTotal = h('strong', {});
    return h('div', { class: 'action-bar invoice-bar', hidden: true },
      h('div', { class: 'action-total' },
        this.barCount, this.barTotal, h('small', {}, 'Cocokkan dengan uang yang masuk di rekening.')),
      h('div', { class: 'form-actions' },
        h('button', {
          class: 'button',
          type: 'button',
          onClick: () => {
            this.selected.clear();
            this.syncSelection();
            this.keepFocus();
          },
        }, 'Batal pilih'),
        h('button', { class: 'button button-primary', type: 'button', onClick: () => this.markSelected() }, 'Tandai sudah dibayar')));
  }

  toolbar() {
    const { filter } = this;
    // One calendar for every view: the whole button opens it, a day is one tap, a week or a month is two.
    this.picker = new RangeCalendar({
      ...this.period(),
      mode: filter.mode,
      onPick: (range) => this.usePeriod(range),
    });
    const move = (step) => {
      const range = DateUtil.shiftPeriod(this.period(), step);
      this.picker.set(range);
      this.usePeriod(range);
    };
    return h('div', { class: 'toolbar' },
      h('div', { class: 'segmented', role: 'group', 'aria-label': 'Tampilkan per' },
        InvoicesModule.MODES.map((mode) => h('button', {
          class: filter.mode === mode.id ? 'is-active' : '',
          type: 'button',
          'aria-pressed': String(filter.mode === mode.id),
          onClick: () => {
            // Pressing the active view again must not throw away a range picked on the calendar.
            if (filter.mode === mode.id) return;
            filter.mode = mode.id;
            filter.range = null;
            this.draw();
          },
        }, mode.label))),
      h('div', { class: 'date-nav' },
        h('button', { class: 'button', type: 'button', 'aria-label': 'Sebelumnya', onClick: () => move(-1) }, '‹'),
        this.picker.element,
        h('button', { class: 'button', type: 'button', 'aria-label': 'Berikutnya', onClick: () => move(1) }, '›')),
      h('select', {
        'aria-label': 'Status pembayaran',
        onChange: (event) => {
          filter.status = event.target.value;
          this.drawResults();
        },
      },
      [['all', 'Semua status'], ['unpaid', 'Belum dibayar (semua tanggal)'], ['paid', 'Sudah dibayar']].map(([value, label]) =>
        h('option', { value, selected: filter.status === value }, label))),
      h('input', {
        class: 'search',
        type: 'search',
        placeholder: 'Cari nomor, PO, atau pelanggan',
        'aria-label': 'Cari invoice',
        value: filter.search,
        onInput: (event) => {
          filter.search = event.target.value;
          clearTimeout(this.searchTimer);
          this.searchTimer = setTimeout(() => this.drawResults(), InvoicesModule.SEARCH_DELAY_MS);
        },
      }));
  }

  // A range is kept with its mode, so switching between week and month never reuses a range that does not fit.
  period() {
    const { mode, range, anchor } = this.filter;
    if (mode !== 'day' && range && range.mode === mode) return { from: range.from, to: range.to };
    return DateUtil.range(mode, anchor);
  }

  usePeriod(range) {
    this.filter.range = { ...range, mode: this.filter.mode };
    this.filter.anchor = range.from;
    this.drawResults();
  }

  // Money still owed is not limited to one month, so 'Belum dibayar' looks across every date.
  allDates() {
    return Boolean(this.filter.search.trim()) || Boolean(this.filter.customer) || this.filter.status === 'unpaid';
  }

  visible() {
    const { filter } = this;
    const query = filter.search.trim().toLowerCase();
    const customer = filter.customer && InvoiceRepository.customerKey(filter.customer);
    const range = this.period();
    // Statements write 1.500.000,00 or 1,500,000.00, so the cents are dropped and only digits are kept.
    const amount = /^(rp\.?\s*)?[\d.,\s]+$/.test(query) ? query.replace(/[.,]00$/, '').replace(/\D/g, '') : '';
    return this.invoices.filter((invoice) => {
      if (filter.status === 'paid' && !invoice.paid) return false;
      if (filter.status === 'unpaid' && (invoice.paid || invoice.voided)) return false;
      if (customer && InvoiceRepository.customerKey(invoice.customer.name) !== customer) return false;
      if (query) {
        // The amount is searchable too, because a bank statement shows the money, not the invoice number.
        // It must match whole, so 1.500 does not also list 11.500.000 and 21.500.000.
        return `${invoice.number} ${invoice.sjNumber || ''} ${invoice.poNumber} ${invoice.customer.name}`.toLowerCase().includes(query)
          || (amount !== '' && String(invoice.totals.total) === amount);
      }
      return this.allDates() || (invoice.date >= range.from && invoice.date <= range.to);
    });
  }

  emptyState() {
    const { filter } = this;
    if (filter.search.trim()) return h('div', { class: 'panel empty' }, h('p', {}, 'Tidak ada invoice yang cocok.'));
    if (filter.status !== 'all') {
      const text = filter.status === 'unpaid' ? 'Semua invoice sudah dibayar.' : 'Tidak ada invoice yang sudah dibayar pada periode ini.';
      return h('div', { class: 'panel empty' },
        h('p', {}, text),
        h('button', {
          class: 'button',
          type: 'button',
          onClick: () => {
            filter.status = 'all';
            this.draw();
            this.keepFocus();
          },
        }, 'Tampilkan semua status'));
    }
    return h('div', { class: 'panel empty' },
      h('p', {}, 'Belum ada invoice pada periode ini.'),
      h('a', { class: 'button', href: '#/create' }, '+ Buat invoice'));
  }

  drawResults() {
    const { filter } = this;
    const invoices = this.visible();
    const active = invoices.filter((invoice) => !invoice.voided);
    const sum = (list) => list.reduce((total, invoice) => total + invoice.totals.total, 0);
    const range = this.period();
    // The whole period prints as one PDF, for example to send a month of invoices to the hotel.
    const printable = !this.allDates() && filter.status === 'all' && invoices.length > 0;

    this.results.replaceChildren(
      this.filterNote(),
      h('div', { class: 'stats' },
        this.stat('Periode', this.allDates() ? 'Semua tanggal' : RangeCalendar.label(range)),
        this.stat('Jumlah invoice', active.length),
        this.stat('Total tagihan', Format.rupiah(sum(active))),
        this.stat('Belum dibayar', Format.rupiah(sum(active.filter((invoice) => !invoice.paid))))),
      invoices.length > 0 ? h('div', { class: 'results-actions' },
        // The recap holds exactly the rows on screen, so what the vendor sees is what the accountant gets.
        h('button', { class: 'button button-small recap-period', type: 'button', onClick: () => this.saveRecap(invoices, range) }, 'Unduh rekap (Excel)'),
        printable && h('a', { class: 'button button-small print-period', href: `#/print-all/${range.from}~${range.to}` }, 'Cetak / Simpan PDF periode ini')) : '',
      invoices.length === 0
        ? this.emptyState()
        : h('div', { class: 'table-scroll' }, h('table', { class: 'table table-stack' },
          h('thead', {}, h('tr', {},
            h('th', {}, 'Tanggal'),
            h('th', {}, 'No. Invoice'),
            h('th', {}, 'No. PO'),
            h('th', {}, 'Pelanggan'),
            h('th', { class: 'number' }, 'Total'),
            h('th', {}, 'Dibayar'))),
          h('tbody', {}, invoices.map((invoice) => this.row(invoice))))));
    // Search and 'Belum dibayar' look across every date, so the period controls would do nothing.
    for (const control of this.body.querySelectorAll('.toolbar .segmented button, .date-nav > .button, .range-trigger')) {
      control.disabled = this.allDates();
      // A greyed-out control needs a reason, or it looks broken.
      control.title = this.allDates() ? 'Sedang menampilkan semua tanggal. Kosongkan pencarian atau pilih Semua status untuk memilih periode.' : '';
    }
    this.syncSelection();
  }

  // A list narrowed by status or search says so, with one tap back to everything. Coming from Umur Piutang,
  // the way back leads there instead of to the home page.
  filterNote() {
    const { filter } = this;
    const search = filter.search.trim();
    const narrowed = search || filter.customer || filter.status !== 'all';
    if (!narrowed) filter.from = null;
    const fromAging = filter.from === 'aging';
    this.backLink.href = fromAging ? '#/aging' : '#/';
    this.backLink.textContent = fromAging ? '← Kembali ke Umur Piutang' : '← Kembali ke Halaman Utama';
    if (!narrowed) return '';
    const status = { unpaid: ' yang belum dibayar', paid: ' yang sudah dibayar' }[filter.status] || '';
    return h('div', { class: 'filter-note', role: 'status' },
      h('span', {}, `Menampilkan invoice${status}${filter.customer ? ` dari ${filter.customer}` : ''}${search ? ` dengan kata "${search}"` : ''}.`),
      h('button', {
        class: 'button button-small',
        type: 'button',
        onClick: () => {
          Object.assign(filter, { status: 'all', search: '', customer: null, from: null });
          this.draw();
          this.keepFocus();
        },
      }, 'Hapus filter'));
  }

  paidCell(invoice) {
    if (invoice.voided) {
      return [h('span', { class: 'badge badge-void' }, 'Dibatalkan'),
        h('small', { class: 'void-reason' }, invoice.voidReason || 'Alasan tidak dicatat')];
    }
    if (invoice.paid) {
      return [h('span', { class: 'badge badge-paid' }, 'Sudah dibayar'),
        invoice.paidAt && h('small', { class: 'due-note' }, Format.date(invoice.paidAt))];
    }
    const today = DateUtil.today();
    const late = DateUtil.daysBetween(Reminder.dueDate(invoice), today) >= 0;
    return [h('label', { class: 'check' }, this.pickBox(invoice), h('span', { class: 'pick-label' }, 'Belum')),
      h('small', { class: late ? 'due-note is-late' : 'due-note' }, Reminder.dueText(invoice, today))];
  }

  row(invoice) {
    return h('tr', { class: invoice.voided ? 'is-voided' : '' },
      h('td', { 'data-label': 'Tanggal' }, Format.date(invoice.date)),
      h('td', { 'data-label': 'No. Invoice' }, h('a', { href: `#/invoice/${invoice.id}` }, invoice.number)),
      h('td', { 'data-label': 'No. PO' }, invoice.poNumber || '—'),
      h('td', { 'data-label': 'Pelanggan' }, invoice.customer.name),
      h('td', { class: 'number', 'data-label': 'Total' }, Format.number(invoice.totals.total)),
      h('td', { 'data-label': 'Dibayar' }, this.paidCell(invoice)));
  }

  saveRecap(invoices, range) {
    // A recap of paid invoices only must not pass for the whole period, in the file name or in its total row.
    const paidOnly = this.filter.status === 'paid';
    let name = `Rekap-Invoice-${paidOnly ? 'sudah-dibayar-' : ''}${range.from}_${range.to}.xlsx`;
    if (this.filter.status === 'unpaid') name = `Rekap-Invoice-belum-dibayar-${DateUtil.today()}.xlsx`;
    if (this.filter.search.trim()) name = `Rekap-Invoice-pencarian-${DateUtil.today()}.xlsx`;
    TransferService.save(Xlsx.blob('Rekap', TransferService.recapRows(invoices, paidOnly ? 'TOTAL sudah dibayar' : undefined)), name);
    // Counted like the 'Jumlah invoice' figure on screen, so the two numbers agree.
    const voided = invoices.filter((invoice) => invoice.voided).length;
    Dialog.toast(`Rekap ${invoices.length - voided} invoice${voided ? ` (+${voided} dibatalkan)` : ''} dibuat. Buka dengan Excel.`);
  }

  async markSelected() {
    const chosen = this.invoices.filter((invoice) => this.selected.has(invoice.id));
    const paidAt = await this.askPaidDate(chosen);
    if (!paidAt) return;
    try {
      const count = await this.app.invoices.markPaid(chosen.map((invoice) => invoice.id), paidAt);
      Dialog.toast(`${count} invoice ditandai sudah dibayar.`);
      this.selected.clear();
    } catch (error) {
      if (!(error instanceof InvoiceLockedError)) throw error;
      Dialog.toast(error.message);
    }
    await this.reload();
    this.keepFocus();
  }

  async snooze(invoice) {
    await this.app.invoices.snooze(invoice.id, DateUtil.today());
    // The vendor just said it is not paid, and its box leaves the reminder, so it must not stay chosen.
    this.selected.delete(invoice.id);
    Dialog.toast('Akan ditanyakan lagi minggu depan.');
    await this.reload();
    this.keepFocus();
  }
}

  <script>
// Document preview, print to PDF, and actions for one saved invoice.
class InvoiceDetailModule extends Module {
  static VOID_REASONS = ['Salah input', 'Tagihan ganda', 'Dibatalkan hotel', 'Barang tidak jadi dikirim', 'Lainnya'];
  static OTHER_REASON = 'Lainnya';

  static voidSummary(invoice) {
    const when = invoice.voidedAt ? `Dibatalkan ${Format.date(invoice.voidedAt)}` : 'Dibatalkan';
    return `${when}: ${invoice.voidReason || 'Alasan tidak dicatat'}`;
  }

  async render(outlet, params) {
    this.id = Number(params[0]);
    this.view = 'invoice';
    this.container = h('div', { class: 'page' });
    outlet.append(this.container);
    await this.reload();
  }

  async reload() {
    this.invoice = Number.isInteger(this.id) ? await this.app.invoices.get(this.id) : null;
    if (!this.invoice) {
      this.app.router.go('invoices');
      return;
    }
    this.config = await this.app.config.get();
    this.app.updateAlarm();
    this.draw();
  }

  status() {
    if (this.invoice.voided) return h('span', { class: 'badge badge-void' }, 'Dibatalkan');
    return this.invoice.paid
      ? h('span', { class: 'badge badge-paid' }, `Sudah dibayar ${this.invoice.paidAt ? Format.date(this.invoice.paidAt) : ''}`.trim())
      : [h('span', { class: 'badge badge-unpaid' }, 'Belum dibayar'), ' ',
        h('span', { class: DateUtil.daysBetween(Reminder.dueDate(this.invoice), DateUtil.today()) >= 0 ? 'due-note due-inline is-late' : 'due-note due-inline' }, `${Reminder.dueText(this.invoice, DateUtil.today())} (termin ${Number.isInteger(this.invoice.termDays) ? `${this.invoice.termDays} hari` : '1 bulan'})`)];
  }

  actions() {
    const { invoice } = this;
    const hasSj = invoice.includeSj && invoice.sjNumber;
    const editable = !invoice.voided && !invoice.paid;
    return [
      h('button', { class: 'button button-primary', type: 'button', onClick: () => this.print() }, 'Cetak / Simpan PDF'),
      editable && h('a', { class: 'button', href: `#/create/${invoice.id}` }, 'Ubah'),
      !invoice.voided && !hasSj && h('button', { class: 'button', type: 'button', onClick: () => this.addDeliveryNote() }, 'Buat Surat Jalan'),
      !invoice.voided && h('button', { class: 'button', type: 'button', onClick: () => this.togglePaid() },
        invoice.paid ? 'Tandai belum dibayar' : 'Tandai sudah dibayar'),
      editable && h('button', { class: 'button button-danger', type: 'button', onClick: () => this.voidInvoice() }, 'Batalkan'),
    ];
  }

  history() {
    const entries = this.invoice.history || [];
    return h('details', { class: 'history no-print' },
      h('summary', {}, `Riwayat invoice (${entries.length})`),
      h('ul', {}, entries.map((entry) => {
        const time = new Date(entry.at);
        const day = DateUtil.toIso(time);
        const clock = `${String(time.getHours()).padStart(2, '0')}.${String(time.getMinutes()).padStart(2, '0')}`;
        return h('li', {}, `${Format.date(day)} ${clock} • ${entry.action}${entry.detail ? ` • ${entry.detail}` : ''}`);
      })));
  }

  draw() {
    const { invoice } = this;
    const hasSj = invoice.includeSj && invoice.sjNumber;
    if (!hasSj) this.view = 'invoice';
    const documentClass = this.view === 'invoice' ? InvoiceDocument : DeliveryNoteDocument;
    const tab = (view, label) => h('button', {
      class: this.view === view ? 'is-active' : '',
      type: 'button',
      onClick: () => {
        this.view = view;
        this.draw();
      },
    }, label);

    const stage = h('div', { class: 'document-stage' });
    this.container.replaceChildren(
      h('div', { class: 'no-print' },
        h('div', { class: 'page-header' },
          h('div', {},
            h('a', { class: 'back-link', href: '#/invoices' }, '← Kembali ke Invoice Tersimpan'),
            h('p', { class: 'eyebrow' }, 'Invoice'),
            h('h1', {}, invoice.number),
            this.status()),
          h('div', { class: 'page-actions' }, this.actions())),
        !InvoiceCalculator.isConsistent(invoice) && h('div', { class: 'notice notice-error', role: 'alert' },
          'Total tersimpan tidak cocok dengan barisnya. Jangan kirim invoice ini sebelum diperiksa.'),
        invoice.voided && h('div', { class: 'notice notice-warning' }, InvoiceDetailModule.voidSummary(invoice)),
        invoice.paid && h('div', { class: 'notice notice-info' },
          'Invoice sudah dibayar sehingga terkunci. Tandai belum dibayar kalau perlu mengubah.'),
        this.history(),
        hasSj && h('div', { class: 'tabs' }, tab('invoice', 'Invoice'), tab('sj', 'Surat Jalan'))),
      stage);
    new documentClass(invoice, this.config).renderInto(stage);
  }

  // The page title becomes the default file name when saving a PDF.
  print() {
    const originalTitle = document.title;

    if (this.invoice.paid) {

      const received = this.invoice.paidAt ? ` Tanggal uang masuk ${Format.date(this.invoice.paidAt)} tetap tercatat di riwayat.` : '';
      if (!await Dialog.confirm(`Tandai ${this.invoice.number} belum dibayar?${received}`, 'Ya, belum dibayar')) return;

  async voidInvoice() {
    const placeholder = h('option', { value: '' }, 'Pilih alasan');

      placeholder, InvoiceDetailModule.VOID_REASONS.map((text) => h('option', { value: text }, text)));
    const note = h('input', { type: 'text', maxlength: 120, placeholder: 'Contoh: diganti dengan invoice baru' });
    const error = h('p', { class: 'dialog-error', role: 'alert' });
    const summary = () => {
      const detail = note.value.trim();
      if (reason.value === InvoiceDetailModule.OTHER_REASON) return detail;
      return detail ? `${reason.value} (${detail})` : reason.value;
    };
    const validate = () => {
      if (!reason.value) {
        error.textContent = 'Pilih alasan pembatalan.';
        reason.focus();
      } else if (!summary()) {
        error.textContent = 'Tulis alasan pada kolom catatan.';
        note.focus();
      } else {

      }
      return false;

    const confirmed = await Dialog.open('Batalkan invoice', [
      h('p', {}, `Batalkan ${this.invoice.number}? Nomornya tidak dipakai ulang dan invoice ini tidak bisa diubah lagi.`),
      this.field('Alasan', reason, null, true),
      this.field('Catatan', note, 'Wajib kalau memilih Lainnya'),
      error,
    ], [
      { label: 'Kembali', value: false },
      { label: 'Batalkan invoice', value: true, danger: true, validate },
    ]);
    if (confirmed) await this.runGuarded(() => this.app.invoices.voidInvoice(this.id, summary()));
  }

  // Status can change from another tab, so a rejection is shown and the page refreshes.
  async runGuarded(action) {
    try {
      await action();
    } catch (error) {
      if (!(error instanceof InvoiceLockedError)) throw error;
      Dialog.toast(error.message);
    }
    await this.reload();
  }
}

  <script>

  get dirty() {

  }

  set dirty(value) {

    if (!this.saveState) return;

  async render(outlet) {
    this.value = await this.app.config.get();

    outlet.append(h('div', { class: 'page' },
      this.pageHeader('Data Toko', 'Pengaturan Toko', 'Identitas toko dan format invoice. Cukup diisi sekali. Kolom bertanda * wajib diisi.'),

      storagePanel,
      transferPanel,

  }

  bind(object, key, attrs = {}, onChange) {
    return h('input', {
      type: 'text',
      ...attrs,
      value: object[key] ?? '',
      onInput: (event) => {
        object[key] = event.target.value;
        this.dirty = true;
        if (onChange) onChange();
      },
    });
  }

  storePanel() {
    const { store } = this.value;
    this.logoPreview = h('div', { class: 'logo-preview' });

    this.drawLogo();

      const digits = Number(rule.digits);

      const shown = ready ? NumberFormatter.format({ ...rule, input: rule.input.trim() || '(Masukan)', digits }, DateUtil.today(), next, prefix) : '—';

      onChange: (event) => {
        rule.pattern = event.target.value;
        this.dirty = true;
        draw();
      },
    }, NumberFormatter.PATTERNS.map((item) => {
      const label = prefix === 'SJ' ? item.label.replace('INV', 'SJ') : item.label;
      return h('option', { value: item.id, selected: rule.pattern === item.id }, label);

    return panel;
  }

  defaultsPanel() {
    const { value } = this;
    const note = h('textarea', {
      value: value.note,
      rows: 2,
      maxlength: 240,
      onInput: (event) => {
        value.note = event.target.value;
        this.dirty = true;
      },
    });
    return h('section', { class: 'panel' },
      h('h2', {}, 'Bawaan Invoice'),
      h('div', { class: 'form-grid form-grid-3' },
        this.field('Nama pelanggan utama', this.bind(value.customer, 'name', { maxlength: 60 }), 'Terisi otomatis di invoice baru. Pelanggan lain diingat dari invoice sebelumnya.'),
        this.field('Kontak pelanggan', this.bind(value.customer, 'contact', { maxlength: 60 })),
        this.field('Alamat pelanggan', this.bind(value.customer, 'address', { maxlength: 100 })),
        this.field('Tarif PPN (%)', this.bind(value, 'ppnRate', { inputmode: 'decimal' }), 'Hanya dipakai kalau PPN dicentang saat membuat invoice'),
        this.field('Termin pembayaran (hari)', this.bind(value, 'termDays', { inputmode: 'numeric', maxlength: 3 }), 'Untuk pelanggan baru. Pelanggan lama memakai termin invoice terakhirnya, dan bisa diubah per invoice.'),
        this.field('Ucapan penutup', this.bind(value, 'closing', { maxlength: 80 })),

  }

  storagePanel() {
    const { storage } = this.app;
    if (storage.mode === 'browser') {
      return h('section', { class: 'panel panel-spaced' },
        h('h2', {}, 'Tempat Menyimpan Data'),
        h('div', { class: 'notice notice-warning' },
          'Browser ini tidak bisa menyimpan ke folder, jadi data ada di dalam browser dan bisa hilang saat data browser dihapus. Gunakan Edge atau Chrome, atau Export secara berkala.'));
    }
    return h('section', { class: 'panel panel-spaced' },
      h('h2', {}, 'Tempat Menyimpan Data'),

        `Berkas data utama rusak, jadi data dipulihkan dari cadangan ${storage.recoveredFrom}. Periksa invoice terbaru.`),
      h('p', { class: 'muted panel-text' },
        `Data Anda ada di folder "${storage.folderName}" di komputer ini, dan dicadangkan otomatis setiap hari. Aman walaupun riwayat browsing dihapus.`),
      // The daily copies sit on the same disk, so a broken laptop takes them too.
      h('p', { class: 'muted panel-text' }, 'Tips: folder di dalam OneDrive atau Google Drive ikut tersimpan di internet, jadi data tetap aman kalau laptop rusak.'),
      h('button', { class: 'button', type: 'button', onClick: () => this.changeFolder() }, 'Ganti tempat penyimpanan'));

  async changeFolder() {
    // Switching folders reloads the site, which would throw away settings typed but not saved.
    if (this.dirty) {
      Dialog.toast('Simpan pengaturan dulu sebelum ganti tempat.');

  transferPanel() {

  async exportFile(kind) {
    if (kind === 'config' && this.dirty) {
      Dialog.toast('Simpan pengaturan dulu sebelum export.');

  importQuestion(kind, file) {
    const { transfer } = this.app;
    if (kind === 'invoices') {
      const { fresh, same, conflicts } = transfer.previewInvoices(file);
      const skipped = conflicts.length > 0
