        : '';
      return `${fresh.length} invoice baru akan ditambahkan, ${same.length} sudah ada.${skipped}`;
    }
    if (kind === 'items') {
      const { added, updated } = transfer.previewItems(file);
      return `${added} barang baru akan ditambahkan, ${updated} barang yang sama akan diperbarui.`;
    }
    return `Identitas toko dan format invoice akan diganti dengan isi berkas (${file.config.store.name || 'tanpa nama toko'}). Invoice lama tidak berubah.`;
  }

  async importFile(kind, selected) {
    if (!selected) return;
    let file;
    try {
      file = TransferService.parse(await selected.text(), kind);
    } catch (error) {
      if (!(error instanceof TransferError)) throw error;
      this.showError(error.message);
      return;
    }
    const confirmed = await Dialog.confirm(this.importQuestion(kind, file), 'Import');
    if (!confirmed) return;
    const { transfer } = this.app;
    if (kind === 'invoices') await transfer.importInvoices(file);
    else if (kind === 'items') await transfer.importItems(file);
    else await transfer.importConfig(file);
    this.dirty = false;
    Dialog.toast(`Import ${TransferService.LABELS[kind]} berhasil.`);
    await this.app.router.refresh();
  }

  showError(text) {
    this.message.replaceChildren(h('div', { class: 'notice notice-error', role: 'alert' }, text));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  validateRule(rule, name) {
    const digits = Number(rule.digits);
    const next = Number(rule.next);
    if (NumberFormatter.needsInput(rule.pattern) && !rule.input.trim()) return `Pola ${name} butuh Masukan.`;
    if (!Number.isInteger(digits) || digits < 1 || digits > 8) return `Jumlah digit ${name} harus 1 sampai 8.`;
    if (!Number.isInteger(next) || next < 1) return `Nomor berikutnya ${name} harus angka 1 atau lebih.`;
    return null;
  }

  async save() {
    const { value } = this;
    if (!value.store.name.trim()) return this.showError('Nama toko belum diisi.');
    const ruleError = this.validateRule(value.invoiceNumber, 'invoice') || this.validateRule(value.sjNumber, 'surat jalan');
    if (ruleError) return this.showError(ruleError);
    const ppnRate = Format.parseQty(value.ppnRate);
    if (!(ppnRate > 0 && ppnRate <= 100)) return this.showError('Tarif PPN harus di antara 0 dan 100.');
    // Capped, so a typo such as 300 cannot silence the payment reminders for most of a year.
    const termDays = Reminder.parseTerm(value.termDays);
    if (termDays === null) return this.showError('Termin pembayaran harus 0 sampai 180 hari.');

    for (const rule of [value.invoiceNumber, value.sjNumber]) {
      rule.digits = Number(rule.digits);
      rule.next = Number(rule.next);
      rule.input = rule.input.trim();
    }
    value.ppnRate = ppnRate;
    value.termDays = Number(termDays);
    value.store.name = value.store.name.trim();
    this.message.replaceChildren();
    await this.app.config.save(value);
    this.dirty = false;
    Dialog.toast('Pengaturan tersimpan.');
  }
}

// Puts all invoices in one print view, to save as a single PDF.
class PrintAllModule extends Module {
  static LIMIT = 500;

  // One print job with thousands of sheets produces no file, so large data goes month by month.
  static needsMonth(count) {
    return count > PrintAllModule.LIMIT;
  }

  static partCount(count) {
    return Math.max(1, Math.ceil(count / PrintAllModule.LIMIT));
  }

  // 'YYYY-MM' for a month, or 'YYYY-MM-DD~YYYY-MM-DD' for a range chosen on Invoice Tersimpan.
  static parsePeriod(param) {
    if (/^\d{4}-\d{2}$/.test(param || '')) return { ...DateUtil.range('month', `${param}-01`), month: param };
    const range = /^(\d{4}-\d{2}-\d{2})~(\d{4}-\d{2}-\d{2})$/.exec(param || '');
    return range && range[1] <= range[2] ? { from: range[1], to: range[2] } : null;
  }

  async render(outlet, params) {
    const all = (await this.app.invoices.all()).reverse();
    const period = PrintAllModule.parsePeriod(params[0]);
    const byMonth = PrintAllModule.needsMonth(all.length);
    this.month = period && period.month ? period.month : '';
    this.period = params[0] && period ? params[0] : '';
    // A range comes from Invoice Tersimpan, so the way back leads there.
    this.range = period && !period.month ? period : null;
    const inMonth = period
      ? all.filter((invoice) => invoice.date >= period.from && invoice.date <= period.to)
      : (byMonth ? [] : all);
    // A single month can also exceed the limit, so it is split into parts of the same size.
    this.parts = PrintAllModule.partCount(inMonth.length);
    this.part = Math.min(Math.max(Number(params[1]) || 1, 1), this.parts);
    const invoices = inMonth.slice((this.part - 1) * PrintAllModule.LIMIT, this.part * PrintAllModule.LIMIT);
    const config = await this.app.config.get();
    const list = h('div', { class: 'print-all' });
    const monthInput = h('input', { type: 'month', value: this.month });
    Module.pickerOnClick(monthInput);
    outlet.append(h('div', { class: 'page' },
      h('div', { class: 'no-print' },
        this.pageHeader('Cetak',
          period ? `Invoice ${RangeCalendar.label(period)} (${inMonth.length})` : `Semua Invoice (${all.length})`,
          `Pada jendela cetak, pilih "Save as PDF". ${period ? 'Invoice periode ini' : (byMonth ? 'Satu bulan' : 'Semua invoice')} menjadi satu file PDF.`,
          invoices.length > 0 && h('button', { class: 'button button-primary', type: 'button', onClick: () => this.print() }, 'Cetak / Simpan PDF'),
          this.range ? { href: '#/invoices', label: 'Invoice Tersimpan' } : { href: '#/config', label: 'Pengaturan Toko' }),
        byMonth && !this.range && h('div', { class: 'notice notice-info' }, `Ada ${all.length} invoice, terlalu banyak untuk satu file. Pilih bulan, lalu simpan satu per satu.`),
        // Typing a year passes through odd months, so the page moves only on an explicit choice.
        byMonth && !this.range && h('form', {
          class: 'print-month',
          onSubmit: (event) => {
            event.preventDefault();
            this.app.router.go(`print-all/${monthInput.value}`);
          },
        },
        this.field('Bulan', monthInput, this.month ? `${inMonth.length} invoice di bulan ini` : null),
        h('button', { class: 'button', type: 'submit' }, 'Tampilkan')),
        this.parts > 1 && h('div', { class: 'print-month print-part' },
          h('span', {}, 'Bagian:'),
          Array.from({ length: this.parts }, (_, index) => h('a', {
            class: index + 1 === this.part ? 'button button-primary' : 'button',
            href: `#/print-all/${this.period}/${index + 1}`,
            'aria-current': index + 1 === this.part ? 'page' : null,
          }, `${index * PrintAllModule.LIMIT + 1}–${Math.min((index + 1) * PrintAllModule.LIMIT, inMonth.length)}`)))),
      invoices.length === 0 && (!byMonth || period) && h('div', { class: 'panel empty' }, period ? 'Tidak ada invoice pada periode ini.' : 'Belum ada invoice.'),
      list));
    for (const invoice of invoices) {
      const stage = h('div', { class: 'document-stage' });
      list.append(stage);
      new InvoiceDocument(invoice, config).renderInto(stage);
    }
  }

  print() {
    const originalTitle = document.title;
    const name = this.range ? `${this.range.from}_${this.range.to}` : (this.month || DateUtil.today());
    document.title = `Semua-Invoice-${name}${this.parts > 1 ? `-bagian-${this.part}` : ''}`;
    window.addEventListener('afterprint', () => { document.title = originalTitle; }, { once: true });
    window.print();
  }
}

class AgingModule extends Module {
  async render(outlet) {
    // A list opened from this report was only a look at one customer, so coming back here ends it
    // and Invoice Tersimpan opens unfiltered again.
    const filter = this.app.invoiceFilter;
    if (filter.from === 'aging') Object.assign(filter, { status: 'all', search: '', customer: null, from: null });
    const today = DateUtil.today();
    const report = InvoiceRepository.aging(await this.app.invoices.all(), today);
    const money = (amount) => (amount ? Format.number(amount) : '—');
    const labels = InvoiceRepository.AGING;
    outlet.append(h('div', { class: 'page' },
      this.pageHeader('Laporan', 'Umur Piutang', 'Uang yang belum dibayar, dikelompokkan menurut lamanya lewat jatuh tempo. Invoice yang dibatalkan tidak dihitung.',
        report.customers.length > 0 && h('button', { class: 'button aging-download', type: 'button', onClick: () => this.save(report) }, 'Unduh laporan (Excel)'),
        { href: '#/invoices', label: 'Invoice Tersimpan' }),
      this.alarm(report),
      h('div', { class: 'stats' },
        this.stat('Per tanggal', Format.date(today)),
        this.stat('Total piutang', Format.rupiah(report.total)),
        this.stat('Sudah lewat jatuh tempo', Format.rupiah(report.total - report.amounts[0])),
        this.stat('Lebih dari 90 hari', Format.rupiah(report.amounts[4]))),
      report.customers.length === 0
        ? h('div', { class: 'panel empty' }, h('p', {}, 'Tidak ada piutang. Semua invoice sudah dibayar.'))
        : h('div', { class: 'table-scroll' }, h('table', { class: 'table table-stack aging-table' },
          h('thead', {}, h('tr', {},
            h('th', {}, 'Pelanggan'),
            labels.map((label) => h('th', { class: 'number' }, label)),
            h('th', { class: 'number' }, 'Total'))),
          h('tbody', {}, report.customers.map((group) => h('tr', {},
            h('td', { 'data-label': 'Pelanggan' },
              // Opens this customer's unpaid invoices, where they can be marked paid.
              h('button', { class: 'link-button aging-customer', type: 'button', onClick: () => this.openCustomer(group.name) }, group.name),
              h('span', { class: 'muted' }, ` (${group.invoices.length} invoice)`)),
            group.amounts.map((amount, index) => h('td', { class: `number${amount ? '' : ' is-zero'}${index > 0 && amount ? ' is-late' : ''}`, 'data-label': labels[index] }, money(amount))),
            h('td', { class: 'number', 'data-label': 'Total' }, h('strong', {}, Format.number(group.total)))))),
          h('tfoot', {}, h('tr', {},
            h('td', {}, h('strong', {}, 'Total semua pelanggan')),
            report.amounts.map((amount, index) => h('td', { class: amount ? 'number' : 'number is-zero', 'data-label': labels[index] }, money(amount))),
            h('td', { class: 'number', 'data-label': 'Total' }, h('strong', {}, Format.number(report.total)))))))));
  }

  // Overdue money is named before the table, with the invoice waiting longest, so the first call is obvious.
  // Past 60 days it turns to the danger color, because that money is at real risk.
  alarm(report) {
    const overdue = report.customers.flatMap((group) => group.invoices
      .map((invoice) => ({ invoice, name: group.name, late: DateUtil.daysBetween(Reminder.dueDate(invoice), report.today) }))
      .filter((entry) => entry.late > 0));
    if (overdue.length === 0) return '';
    const oldest = overdue.reduce((a, b) => (b.late > a.late ? b : a));
    const total = overdue.reduce((sum, entry) => sum + entry.invoice.totals.total, 0);
    return h('div', { class: `notice ${oldest.late > 60 ? 'notice-error' : 'notice-warning'} aging-alarm`, role: 'alert' },
      h('div', {},
        h('strong', {}, `${overdue.length} invoice lewat jatuh tempo, total ${Format.rupiah(total)}.`),
        ` Paling lama ${oldest.invoice.number} dari ${oldest.name}, lewat ${oldest.late} hari.`),
      h('button', {
        class: 'button button-small',
        type: 'button',
        onClick: () => {
          Object.assign(this.app.invoiceFilter, { status: 'unpaid', search: '', customer: null, from: 'aging' });
          this.app.router.go('invoices');
        },
      }, 'Tandai yang sudah dibayar'));
  }

  openCustomer(name) {
    Object.assign(this.app.invoiceFilter, { status: 'unpaid', search: '', customer: name, from: 'aging' });
    this.app.router.go('invoices');
  }

  save(report) {
    TransferService.save(Xlsx.blob('Umur Piutang', TransferService.agingRows(report)), `Umur-Piutang-${report.today}.xlsx`);
    Dialog.toast('Laporan umur piutang dibuat. Buka dengan Excel.');
  }
}

</script>
  <script>
// Screen before the site opens: pick a data location, or continue with the chosen one.
class StorageGate {
  constructor(outlet) {
    this.outlet = outlet;
  }

  // Returns a usable folder after the user presses the button.
  ask(remembered, errorMessage) {
    return new Promise((resolve) => {
      this.message = h('div');
      if (errorMessage) this.showError(errorMessage);
      const primary = h('button', {
        class: 'button button-primary',
        type: 'button',
        onClick: () => (remembered ? this.reconnect(remembered, resolve) : this.pick(resolve)),
      }, remembered ? 'Lanjutkan' : 'Pilih tempat penyimpanan');
      this.outlet.replaceChildren(h('div', { class: 'page gate' },
        h('div', { class: 'panel gate-panel' },
          remembered ? this.returningContent(remembered) : this.firstTimeContent(),
          this.message,
          h('div', { class: 'gate-actions' },
            primary,
            remembered && h('button', { class: 'link-button', type: 'button', onClick: () => this.pick(resolve) }, 'Pilih tempat lain')))));
      primary.focus();
    });
  }

  firstTimeContent() {
    return [
      h('p', { class: 'eyebrow' }, 'Selamat datang'),
      h('h1', {}, 'Tempat Menyimpan Data'),
      h('p', { class: 'muted' }, 'Invoice Anda disimpan di komputer ini, seperti file Word. Situs hanya perlu tahu tempatnya.'),
      h('ol', { class: 'gate-steps' },
        h('li', {}, 'Tekan Pilih tempat penyimpanan.'),
        h('li', {}, 'Buat folder baru bernama ', h('strong', {}, 'ProjectYearEnd-Data'), ', lalu pilih folder itu.'),
        h('li', {}, 'Kalau browser meminta izin, pilih yang mengizinkan.')),
      h('p', { class: 'muted' }, 'Tips: buat foldernya di dalam OneDrive atau Google Drive, supaya data ikut tersimpan di internet dan tetap aman kalau laptop rusak.'),
    ];
  }

  returningContent(folder) {
    return [
      h('p', { class: 'eyebrow' }, 'Selamat datang kembali'),
      h('h1', {}, 'Lanjutkan Pekerjaan Anda'),
      h('p', { class: 'muted' }, `Data Anda ada di "${folder.name}".`),
      h('p', { class: 'muted' }, 'Browser mungkin meminta izin membuka folder tersebut. Ini normal dan menjaga data tetap aman.'),
    ];
  }

  showError(text) {
    this.message.replaceChildren(h('div', { class: 'notice notice-error', role: 'alert' }, text));
  }

  async pick(resolve) {
    try {
      resolve(await StorageManager.chooseFolder());
    } catch (error) {
      if (error.name !== 'AbortError') this.showError('Tempat ini tidak bisa dipakai. Buat folder baru di dalam Documents, lalu coba lagi.');
    }
  }

  async reconnect(folder, resolve) {
    try {
      if (await StorageManager.requestPermission(folder)) resolve(folder);
      else this.showError('Izin belum diberikan. Tekan Lanjutkan lagi, lalu pilih yang mengizinkan.');
    } catch (error) {
      this.showError('Tempat penyimpanan tidak ditemukan. Tekan Pilih tempat lain untuk mencarinya.');
    }
  }
}

  <script>
class App {
  constructor() {
    this.pendingDraft = null;
    this.poParser = new MarriottPoParser();
    // range holds a week or month picked on the calendar; without one, the period follows anchor.
    this.invoiceFilter = { mode: 'month', anchor: DateUtil.today(), day: DateUtil.today(), range: null, status: 'all', search: '', customer: null, from: null };
  }

  useStore(store) {
    this.store = store;
    this.config = new ConfigRepository(store);
    this.items = new ItemRepository(store);
    this.invoices = new InvoiceRepository(store);
    this.transfer = new TransferService(store);
  }

  async start() {
    const outlet = document.getElementById('outlet');
    this.setUpTheme();
    this.setUpGuards();
    document.getElementById('help-button').addEventListener('click', () => this.showHelp());
    StorageManager.removeRetiredData();
    try {
      await this.connect(outlet);
    } catch (error) {
      outlet.replaceChildren(h('div', { class: 'page' }, h('div', { class: 'notice notice-error', role: 'alert' },
        'Data tidak bisa dibuka. Tutup tab lain lalu muat ulang, atau buka situs dengan Edge atau Chrome.')));
      await Splash.finish();
      return;
    }
    await this.mountRouter(outlet).start();
    window.addEventListener('focus', () => this.refreshIfStale());
    await Splash.finish();
    const { store } = await this.config.get();
    if (Tour.shouldStart(store.name, Tour.seen())) new Tour(this).start();
  }

  mountRouter(outlet) {
    this.router = new Router(outlet, {
      '': () => new HomeModule(this),
      create: () => new CreateModule(this),
      items: () => new ItemsModule(this),
      invoices: () => new InvoicesModule(this),
      invoice: () => new InvoiceDetailModule(this),
      config: () => new ConfigModule(this),
      'print-all': () => new PrintAllModule(this),
      aging: () => new AgingModule(this),
    }, (route) => this.markRoute(route));
    return this.router;
  }

  async connect(outlet) {
    if (!StorageManager.supportsFiles()) {
      const store = new DataStore(new BrowserBackend());
      await store.load();
      this.useStore(store);
      this.storage = { mode: 'browser' };
      return;
    }
    let folder = await StorageManager.rememberedFolder();
    const gate = new StorageGate(outlet);
    if (!folder || !await this.isUsable(folder)) {
      Splash.finish();
      folder = await gate.ask(folder);
    }
    await this.openFolder(folder, gate);
  }

  async isUsable(folder) {
    try {
      return await StorageManager.hasPermission(folder);
    } catch (error) {
      return false;
    }
  }

  // An unreadable file is never overwritten. The user is asked to pick another folder.
  async openFolder(folder, gate) {
    let candidate = folder;
    for (;;) {
      const backend = new FileBackend(candidate);
      const store = new DataStore(backend);
      try {
        await store.load();
        this.useStore(store);
        this.storage = { mode: 'file', folderName: candidate.name, recoveredFrom: backend.recoveredFrom };
        return;
      } catch (error) {
        const isMissing = error.name === 'NotFoundError';
        if (!isMissing && !(error instanceof DataInvalidError)) throw error;
        Splash.finish();
        candidate = await gate.ask(null, isMissing
          ? 'Data Anda tidak ditemukan di tempat biasanya. Foldernya mungkin dipindah, diganti nama, atau flashdisk terlepas. Tekan tombol di bawah lalu pilih lagi foldernya.'
          : `${error.message} Pilih tempat lain. File di folder itu tidak diubah.`);
      }
    }
  }

  setUpTheme() {
    const button = document.getElementById('theme-button');
    const draw = () => {
      const isDark = Theme.current() === 'dark';
      const label = isDark ? 'Ganti ke mode terang' : 'Ganti ke night mode';
      button.replaceChildren(Icon.create(isDark ? 'sun' : 'moon', 18));
      button.setAttribute('aria-label', label);
      button.title = label;
    };
    button.addEventListener('click', () => {
      Theme.toggle();
      draw();
    });
    Theme.followSystem(draw);
    draw();
  }

  setUpGuards() {
    // A file dropped outside the upload area must not navigate the browser away from the site.
    for (const type of ['dragover', 'drop']) window.addEventListener(type, (event) => event.preventDefault());
    window.addEventListener('unhandledrejection', (event) => {
      const { reason } = event;
      if (reason instanceof DataConflictError) this.reloadAfterConflict();
      else if (['NotFoundError', 'NotAllowedError', 'QuotaExceededError'].includes(reason && reason.name)) {
        Dialog.toast('Data gagal disimpan. Periksa tempat penyimpanan dan sisa ruang disk, lalu muat ulang situs.');
      } else {
        Dialog.toast('Terjadi kesalahan. Silakan coba lagi.');
      }
    });
  }

  // A method, so tests can see a reload without leaving the page.
  reload() {
    location.reload();
  }

  async reloadAfterConflict() {
    if (this.reloading) return;
    this.reloading = true;
    await Dialog.open('Data sudah berubah', h('p', {},
      'Data diubah dari tab atau jendela lain. Yang sedang diisi di tab ini belum tersimpan. Situs dimuat ulang agar data terbaru tidak tertimpa.'),
    [{ label: 'Muat ulang', value: true, primary: true }]);
    this.router.current.dirty = false;
    this.reload();
  }

  // An open dialog can hold typed text, such as a void reason, that no page tracks as dirty.
  hasUnsavedWork() {
    return this.router.current.isDirty() || document.querySelector('dialog[open]') !== null;
  }

  // A tab left open shows old data, so it is caught on return, before anyone types into it.
  // A read failure is ignored here because saving reports it.
  async refreshIfStale() {
    if (this.reloading || !await this.store.isStale().catch(() => false)) return;
    if (!this.hasUnsavedWork()) {
      this.reload();
      return;
    }
    if (this.staleWarned) return;
    this.staleWarned = true;
    const reload = await Dialog.open('Data sudah berubah', h('p', {},
      'Data diubah dari tab atau jendela lain, jadi isian di tab ini tidak bisa disimpan. Catat dulu yang perlu, lalu muat ulang.'),
    [{ label: 'Catat dulu', value: false }, { label: 'Muat ulang', value: true, primary: true }]);
    if (!reload) return;
    this.router.current.dirty = false;
    this.reload();
  }

  static TITLES = {
    create: 'Buat Invoice',
    items: 'Daftar Barang',
    invoices: 'Invoice Tersimpan',
    invoice: 'Invoice',
    config: 'Pengaturan Toko',
    'print-all': 'Semua Invoice',
    aging: 'Umur Piutang',
  };

  markRoute(route) {
    this.baseTitle = App.TITLES[route] ? `${App.TITLES[route]} - ProjectYearEnd` : 'ProjectYearEnd';
    document.title = this.baseTitle;
    this.updateAlarm();
    document.body.dataset.route = this.routesWithNav(route) ? 'module' : 'home';
    document.querySelectorAll('.app-nav a').forEach((link) => {
      const isCurrent = link.dataset.routes.split(' ').includes(route);
      if (isCurrent) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
    // On a phone the menu scrolls sideways, so the current page is centred and never hidden off screen.
    const current = document.querySelector('.app-nav a[aria-current="page"]');
    if (current) {
      const nav = current.parentElement.getBoundingClientRect();
      const link = current.getBoundingClientRect();
      current.parentElement.scrollLeft += (link.left + link.width / 2) - (nav.left + nav.width / 2);
    }
  }

  // Money past its due date is raised wherever the vendor is: a count on the Invoice Tersimpan menu
  // and in the browser tab title, so it is seen even while making a new invoice.
  async updateAlarm() {
    if (!this.invoices) return;
    const count = await this.invoices.dueCount(DateUtil.today());
    const badge = document.querySelector('.nav-alarm');
    if (badge) {
      badge.hidden = count === 0;
      badge.replaceChildren(String(count), h('span', { class: 'sr-only' }, ' invoice lewat jatuh tempo'));
    }
    document.title = count ? `(${count}) ${this.baseTitle}` : this.baseTitle;
  }

  routesWithNav(route) {
    return ['create', 'items', 'invoices', 'invoice', 'config', 'print-all', 'aging'].includes(route);
  }

  async showHelp() {
    const replay = await Dialog.open('Bantuan', [
      h('ol', {},
        h('li', {}, 'Isi identitas toko dan pola nomor di Pengaturan Toko.'),
        h('li', {}, 'Masukkan barang dan harga di Daftar Barang.'),
        h('li', {}, 'Isi invoice di Buat Invoice, lalu simpan. Punya PO Marriott (PDF)? Taruh filenya di Halaman Utama, barang dan harga terisi sendiri.'),
        h('li', {}, 'Cetak atau simpan PDF dari halaman invoice.'),
        h('li', {}, 'Sudah dibayar? Centang invoicenya di Invoice Tersimpan, lalu tekan Tandai sudah dibayar.')),
      h('p', { class: 'muted' }, 'Pada jendela cetak, pilih "Save as PDF" untuk menyimpan sebagai file PDF. Hasil cetak selalu terang walaupun night mode aktif.'),
      h('p', { class: 'muted' }, 'Untuk pindah komputer, gunakan Import & Export di Pengaturan Toko.'),
      h('p', { class: 'muted' }, 'Tulisan kurang besar? Tekan tombol Ctrl dan + bersamaan. Tekan Ctrl dan - untuk mengecilkan.'),
    ], [{ label: 'Ulangi tutorial', value: true }, { label: 'Tutup', value: false, primary: true }]);
    if (replay) new Tour(this).start();
  }
}
