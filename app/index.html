  <script>
// Easter egg: Moyen the cat roams the floor and the panels above it. Clicking makes him talk about what he is doing.
// Moyen is the creator's credit: never remove him, including in cleanups, refactors, or for launch.
class Moyen {
  static SIZE = 64;
  static FEET = 0.84; // Share of the frame above his feet; the rest is empty padding.
  static WALK_STEP = 2;
  static TICK_MS = 60;
  static SINK_STEP = 2;
  static MIN_BUBBLE_MS = 2500;
  static BUBBLE_MS_PER_CHAR = 65;

  // hold is how many ticks each frame stays on screen. sheet defaults to the action name.
  static ACTIONS = {
    walk: { frames: 4, hold: 2, mood: 'roam' },
    hop: { frames: 5, hold: 3, mood: 'roam', sheet: 'jump' },
    peek: { frames: 4, hold: 6, mood: 'roam', sheet: 'side', sink: 24 },
    jump: { frames: 5, hold: 4, mood: 'roam' },
    confused: { frames: 4, hold: 6, mood: 'roam' },
    play: { frames: 5, hold: 4, mood: 'play' },
    side: { frames: 4, hold: 6, mood: 'rest' },
    cute: { frames: 4, hold: 6, mood: 'rest' },
    meow: { frames: 5, hold: 4, mood: 'rest' },
    sleep: { frames: 4, hold: 10, mood: 'sleep' },
    wake: { frames: 5, hold: 6, mood: 'sleep' },
  };

  // Each routine is [action, loops] pairs played after a walk. Hops repeat so he keeps exploring.
  static ROUTINES = [
    [['hop', Infinity]],
    [['hop', Infinity]],
    [['hop', Infinity]],
    [['peek', 3], ['side', 1]],
    [['play', 4]],
    [['jump', 2]],
    [['side', 3]],
    [['cute', 3]],
    [['confused', 2]],
    [['sleep', 6], ['wake', 1]],
  ];

  // moods decides when a line fits; pose is how he acts while saying it.
  static LINES = [
    { text: 'Meow!', moods: ['roam', 'play', 'rest'], pose: 'meow' },
    { text: 'Meow. My human dad, Angga Jourena Sinuraya, created this site. Now give me treats right meow!', moods: ['play', 'rest'], pose: 'cute' },
    { text: 'I was an adventurous kitty but I got lost out there, meow... Luckily, dad gave me a brand new home to sleep in!', moods: ['roam', 'sleep'], pose: 'side' },
    { text: 'My paw-ther misses me so much, meow. I want to purr his sadness away!', moods: ['rest'], pose: 'cute' },
    { text: 'My dad loves taking me on meow-adventures! The last time I went to the hospital, I got to ride on his loud Harley... meow!', aside: 'purrs', moods: ['roam', 'play'], pose: 'jump' },
    { text: 'I will be here with dad furever and ever, meow!', aside: 'slow blinks', moods: ['rest', 'sleep'], pose: 'cute' },
    { text: 'I really miss home with my dad and mom, meow... I wish I was sleeping in their bed right now.', aside: 'sighs', moods: ['rest', 'sleep'], pose: 'side' },
    { text: 'I know my paw-ther always loves and misses me... meow.', aside: 'happy purrs', moods: ['rest', 'sleep'], pose: 'cute' },
    { text: 'I am an adventurous kitty just like my dad! What if he went exploring and got lost like I did?!', aside: 'wide eyes', moods: ['roam'], pose: 'confused' },
  ];

  // The one-file package carries the sprite sheets inside it, so a bundled copy is used when present.
  static sheet(name) {
    const path = `assets/moyen/moyen-${Moyen.ACTIONS[name].sheet || name}-sprite-sheet.png`;
    return (window.BUNDLED_ASSETS && window.BUNDLED_ASSETS[path]) || path;
  }

  static pick(mood, last) {
    const options = Moyen.LINES.filter((line) => line.moods.includes(mood) && line !== last);
    return options[Math.floor(Math.random() * options.length)];
  }

  // home is the surface he rises out of on a visit and hops back into when it ends; 0 is the floor.
  constructor(panels, home) {
    Object.assign(this, { panels, home, spot: 0, x: 0, y: 0, sink: 0, queue: [] });
    if (home !== undefined) Object.assign(this, { spot: home, x: Infinity, sink: Moyen.ACTIONS.peek.sink });
    panels.forEach((panel) => panel.classList.add('moyen-ground'));
    this.sprite = h('span', { class: 'moyen-sprite' });
    this.bubble = h('div', { class: 'moyen-bubble', role: 'status', hidden: true });
    this.actor = h('div', { class: 'moyen-actor' },
      this.bubble,
      h('button', { class: 'moyen', type: 'button', 'aria-label': 'Moyen si kucing', onClick: () => this.greet() }, this.sprite));
    this.element = h('div', { class: 'moyen-yard no-print' }, this.actor);
    for (const name of Object.keys(Moyen.ACTIONS)) new Image().src = Moyen.sheet(name);
    this.play('cute', 1);
    requestAnimationFrame(() => {
      this.moveBody();
      this.draw();
    });
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    this.timer = setInterval(() => this.tick(), Moyen.TICK_MS);
  }

  // Everything he can stand on, in yard coordinates. Read live so he follows layout changes.
  surfaces() {
    const origin = this.element.getBoundingClientRect();
    const reach = (rect, top, panel) => ({
      left: rect.left - origin.left,
      right: Math.max(rect.left - origin.left, rect.right - origin.left - Moyen.SIZE),
      top,
      panel,
    });
    return [
      reach(origin, origin.height, null),
      ...this.panels.map((panel) => {
        const rect = panel.getBoundingClientRect();
        return reach(rect, rect.top - origin.top, panel);
      }),
    ];
  }

  static randomX({ left, right }) {
    return left + Math.floor(Math.random() * (right - left));
  }

  play(name, loops) {
    Object.assign(this, { action: name, loops, frame: 0, held: 0 });
    this.sprite.style.backgroundImage = `url(${Moyen.sheet(name)})`;
    if (name === 'play') this.nudge(this.surfaces()[this.spot].panel);
    this.draw();
  }

  draw() {
    const { SIZE, FEET } = Moyen;
    this.sprite.style.backgroundPositionX = `${-this.frame * SIZE}px`;
    this.sprite.style.transform = `translateY(${this.sink}px) scaleX(${this.facingLeft ? -1 : 1})`;
    // Cutting him off at the panel edge makes him look like he is behind the panel.
    this.sprite.style.clipPath = this.sink > 0 ? `inset(0 0 ${SIZE * (1 - FEET) + this.sink}px 0)` : 'none';
    this.actor.style.transform = `translate(${this.x}px, ${this.y - SIZE * FEET}px)`;
    this.actor.classList.toggle('is-leaping', Boolean(this.leap));
  }

  nudge(panel) {
    if (panel) panel.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(2px)' }, { transform: 'translateY(0)' }], 180);
  }

  plan() {
    const onPanel = this.spot > 0;
    const routines = Moyen.ROUTINES.filter(([[first]]) => first !== 'peek' || onPanel);
    this.queue = [['walk', Infinity], ...routines[Math.floor(Math.random() * routines.length)]];
  }

  next() {
    if (this.queue.length === 0) this.plan();
    const [name, loops] = this.queue.shift();
    if (name === 'walk') this.goal = Moyen.randomX(this.surfaces()[this.spot]);
    if (name === 'hop') this.startLeap();
    if (name === 'walk' || name === 'hop') this.facingLeft = (this.leap ? this.leap.toX : this.goal) < this.x;
    this.play(name, loops);
  }

  startLeap(target) {
    const surfaces = this.surfaces();
    const others = surfaces.map((_, index) => index).filter((index) => index !== this.spot);
    const spot = target ?? others[Math.floor(Math.random() * others.length)];
    const toY = surfaces[spot].top;
    this.leap = { spot, fromX: this.x, fromY: this.y, toX: Moyen.randomX(surfaces[spot]), toY, step: 0, steps: 16 + Math.round(Math.abs(toY - this.y) / 10) };
  }

  leapStep() {
    const { fromX, fromY, toX, toY, steps } = this.leap;
    this.leap.step += 1;
    const t = this.leap.step / steps;
    this.x = fromX + (toX - fromX) * t;
    this.y = fromY + (toY - fromY) * t - 48 * 4 * t * (1 - t);
    if (t < 1) return;
    this.land();
    this.next();
  }

  land() {
    this.spot = this.leap.spot;
    this.x = this.leap.toX;
    this.leap = null;
    const surface = this.surfaces()[this.spot];
    this.y = surface.top;
    this.nudge(surface.panel);
    if (this.onHome && this.spot === this.home) this.onHome();
  }

  walkStep(goal) {
    const distance = goal - this.x;
    if (Math.abs(distance) <= Moyen.WALK_STEP) this.next();
    else this.x += Math.sign(distance) * Moyen.WALK_STEP;
  }

  moveBody() {
    if (this.leap) {
      this.leapStep();
      return;
    }
    const surface = this.surfaces()[this.spot];
    this.x = Math.max(surface.left, Math.min(this.x, surface.right));
    this.y = surface.top;
    if (this.action === 'walk') this.walkStep(this.goal);
    const gap = (Moyen.ACTIONS[this.action].sink || 0) - this.sink;
    this.sink += Math.sign(gap) * Math.min(Moyen.SINK_STEP, Math.abs(gap));
  }

  tick() {
    if (!this.element.isConnected) {
      clearInterval(this.timer);
      return;
    }
    this.moveBody();
    const { frames, hold } = Moyen.ACTIONS[this.action];
    this.held += 1;
    if (this.held >= hold) {
      this.held = 0;
      this.frame += 1;
      if (this.frame === frames) {
        this.frame = 0;
        this.loops -= 1;
        if (this.loops === 0) this.next();
      }
    }
    this.draw();
  }

  greet() {
    if (this.leap) this.land();
    const { mood } = Moyen.ACTIONS[this.action];
    this.line = Moyen.pick(mood, this.line);
    const asleep = mood === 'sleep';
    const { text, aside } = this.line;
    this.queue = asleep ? [['sleep', Infinity]] : [['meow', 1], [this.line.pose, Infinity]];
    this.next();
    this.bubble.replaceChildren(text, aside ? ' ' : '', aside ? h('em', {}, aside) : '');
    this.bubble.hidden = false;
    this.actor.classList.add('is-talking');
    this.actor.classList.toggle('is-left', this.x < this.element.clientWidth / 2 - Moyen.SIZE / 2);
    this.actor.classList.toggle('is-below', this.actor.getBoundingClientRect().top < this.bubble.offsetHeight + 80);
    clearTimeout(this.bubbleTimer);
    this.bubbleTimer = setTimeout(() => this.quiet(asleep), Math.max(Moyen.MIN_BUBBLE_MS, text.length * Moyen.BUBBLE_MS_PER_CHAR));
  }

  quiet(asleep) {
    this.bubble.hidden = true;
    this.actor.classList.remove('is-talking');
    this.queue = asleep ? [['wake', 1]] : [];
    this.next();
  }

  // He finishes what he is doing, then sleeps instead of roaming on.
  nap() {
    this.queue = [['sleep', Infinity]];
  }

  // Ends a visit: he hops back onto his home surface and sinks into it; onHome runs as he lands.
  leave(onHome) {
    if (this.leap) this.land();
    clearTimeout(this.bubbleTimer);
    this.bubble.hidden = true;
    this.actor.classList.remove('is-talking');
    this.onHome = onHome;
    this.queue = [['peek', Infinity]];
    this.startLeap(this.home);
    this.facingLeft = this.leap.toX < this.x;
    this.play('hop', Infinity);
  }
}

// Home page easter egg: after the page sits idle, Moyen rises out of the Pengaturan Toko card to play,
// and hops back into it as soon as the vendor clicks, types, scrolls, or drags a file.
class MoyenVisit {
  static IDLE_MS = 75000;
  static NAP_MS = 60000;
  static LEAVE_MS = 400;
  // Moving the pointer only restarts the wait, so the vendor can still reach Moyen to click him.
  static WORK = ['pointerdown', 'keydown', 'wheel', 'dragenter'];

  // Never over the tutorial or a dialog, never for reduced motion, and only where the cards sit beside the
  // drop circle, so he cannot stand over another card's click area.
  static allowed() {
    return !document.hidden
      && !document.querySelector('.tour-shade, dialog[open]')
      && matchMedia('(min-width: 1101px)').matches
      && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  constructor(cards, door, floor) {
    Object.assign(this, { cards, door, floor, leaving: false });
    this.wait = () => this.restart();
    this.work = (event) => {
      if (this.moyen && this.moyen.actor.contains(event.target)) return;
      this.end();
      this.restart();
    };
    addEventListener('pointermove', this.wait, { passive: true });
    for (const type of MoyenVisit.WORK) addEventListener(type, this.work, { capture: true, passive: true });
    this.restart();
  }

  restart() {
    clearTimeout(this.timer);
    if (!this.floor.isConnected) {
      this.stop();
      return;
    }
    if (!this.moyen) this.timer = setTimeout(() => this.begin(), MoyenVisit.IDLE_MS);
  }

  stop() {
    clearTimeout(this.timer);
    clearTimeout(this.napTimer);
    removeEventListener('pointermove', this.wait);
    for (const type of MoyenVisit.WORK) removeEventListener(type, this.work, { capture: true });
  }

  begin() {
    if (!this.floor.isConnected || this.moyen) return;
    if (!MoyenVisit.allowed()) {
      this.restart();
      return;
    }
    this.moyen = new Moyen(this.cards, this.cards.indexOf(this.door) + 1);
    this.moyen.element.classList.add('is-visit');
    this.floor.before(this.moyen.element);
    this.napTimer = setTimeout(() => this.moyen.nap(), MoyenVisit.NAP_MS);
  }

  end() {
    clearTimeout(this.napTimer);
    if (!this.moyen || this.leaving) return;
    this.leaving = true;
    const { element } = this.moyen;
    this.moyen.leave(() => {
      element.classList.add('is-leaving');
      setTimeout(() => {
        element.remove();
        this.moyen = null;
        this.leaving = false;
        this.restart();
      }, MoyenVisit.LEAVE_MS);
    });
  }
}

// Base of all modules. A new module extends this class and registers in App.js.
class Module {
  constructor(app) {
    this.app = app;
  }

  async render() {
    throw new Error('Module must implement render()');
  }

  isDirty() {
    return false;
  }

  // A page can say what exactly would be lost, which helps more than a general warning.
  leaveMessage() {
    return 'Perubahan belum disimpan. Tinggalkan halaman ini?';
  }

  // A number is usually replaced, not extended, so typing 6 over 10 must not give 106.
  static selectOnFocus(input) {
    let clickGaveFocus = false;
    input.addEventListener('mousedown', () => { clickGaveFocus = document.activeElement !== input; });
    input.addEventListener('focus', () => input.select());
    // Only that click keeps the selection; a later click places the caret as usual.
    input.addEventListener('mouseup', (event) => { if (clickGaveFocus) event.preventDefault(); });
  }

  // A date field opens its calendar wherever it is clicked, not only on the small icon at its edge.
  static pickerOnClick(input) {
    input.addEventListener('click', () => {
      try {
        input.showPicker();
      } catch (error) {
        // Older browsers keep typing and the icon.
      }
    });
  }

  // Asks when the money reached the bank, since that is the date the books need, not the date of the click.
  // Returns that date, or null when the vendor goes back.
  async askPaidDate(invoices) {
    const today = DateUtil.today();
    const total = invoices.reduce((sum, invoice) => sum + invoice.totals.total, 0);
    const date = h('input', { type: 'date', value: today, max: today });
    Module.pickerOnClick(date);
    const error = h('p', { class: 'dialog-error', role: 'alert' });
    // The date box follows the browser language, so 11/05 is also spelled out and never read as 11 May.
    const spelled = h('span', {});
    const spell = () => { spelled.textContent = /^\d{4}-\d{2}-\d{2}$/.test(date.value) ? `${RangeCalendar.longDate(date.value)}. ` : ''; };
    spell();
    date.addEventListener('input', spell);
    // Most transfers are seen on the statement the same day or the next, so those are one tap.
    const quick = (label, iso) => h('button', {
      class: 'button button-small',
      type: 'button',
      onClick: () => {
        date.value = iso;
        spell();
        error.textContent = '';
      },
    }, label);
    const validate = () => {
      if (/^\d{4}-\d{2}-\d{2}$/.test(date.value) && date.value <= today) return true;
      error.textContent = 'Isi tanggal uang masuk, paling lambat hari ini.';
      date.focus();
      return false;
    };
    const confirmed = await Dialog.open('Tandai sudah dibayar', [
      h('p', {}, invoices.length === 1
        ? `${invoices[0].number}, ${Format.rupiah(total)}.`
        : `${invoices.length} invoice, total ${Format.rupiah(total)}. Cocokkan dengan uang yang masuk di rekening.`),
      invoices.length > 1 && h('ul', { class: 'paid-list' }, invoices.map((invoice) =>
        h('li', {}, `${invoice.number} • ${invoice.customer.name} • ${Format.rupiah(invoice.totals.total)}`))),
      this.field('Tanggal uang masuk', date, h('span', { 'aria-live': 'polite' }, spelled, 'Lihat di mutasi rekening'), true),
      h('div', { class: 'quick-dates' }, quick('Hari ini', today), quick('Kemarin', DateUtil.addDays(today, -1))),
      error,
    ], [
      { label: 'Kembali', value: false },
      { label: 'Ya, sudah dibayar', value: true, primary: true, validate },

    return confirmed ? date.value : null;

  // Every page opens the same way: where it leads back to, what it is, and its main actions.

class DataInvalidError extends Error {}
class DataConflictError extends Error {}
// A newer version wrote the file. It is valid data, so it must never be replaced by an older snapshot.
class DataVersionError extends DataInvalidError {}

// Data file format, shared by all storage backends.
class DataFormat {
  static APP = 'yearendproject';
  static SCHEMA = 1;

  static empty() {
    return { config: null, items: [], invoices: [], nextItemId: 1, nextInvoiceId: 1 };
  }

  static serialize(data, revision) {
    return JSON.stringify({
      app: DataFormat.APP,
      kind: 'data',
      schema: DataFormat.SCHEMA,
      revision,
      savedAt: new Date().toISOString(),
      data,
    });
  }

  static parse(text) {
    let file;
    try {
      file = JSON.parse(text);
    } catch (error) {
      throw new DataInvalidError('Berkas data rusak atau tidak lengkap.');
    }
    if (!file || file.app !== DataFormat.APP || file.kind !== 'data' || !file.data
      || !Array.isArray(file.data.items) || !Array.isArray(file.data.invoices)) {
      throw new DataInvalidError('Berkas ini bukan data ProjectYearEnd.');
    }
    if (file.schema !== DataFormat.SCHEMA) {
      throw new DataVersionError('Berkas data dibuat oleh versi situs yang lebih baru. Buka dengan versi terbaru.');
    }
    return { data: file.data, revision: file.revision };
  }

  // The revision is written near the start, so a short head is enough to read it.
  static revisionOf(head) {
    const match = head.match(/"revision":(\d+)/);
    return match ? Number(match[1]) : null;
  }
}

// All data lives in memory and every change is written to storage immediately.
// Changes run one at a time. If a write fails, memory stays unchanged.
class DataStore {
  constructor(backend) {
    this.backend = backend;
    this.queue = Promise.resolve();
  }

  async load() {
    this.data = (await this.backend.load()) || DataFormat.empty();
  }

  read(select) {
    return structuredClone(select(this.data));
  }

  update(change) {
    const run = async () => {
      const draft = structuredClone(this.data);
      const result = change(draft);
      await this.backend.save(draft);
      this.data = draft;
      return structuredClone(result);
    };
    const pending = this.queue.then(run, run);
    this.queue = pending.catch(() => {});
    return pending;
  }

  // Queued, so this tab's own save can never look like a change from another tab.
  isStale() {
    const pending = this.queue.then(() => this.backend.isStale());
    this.queue = pending.catch(() => {});
    return pending;
  }
}

// Stores data as a file in a folder the user picked, outside the browser.
class FileBackend {
  static DATA_FILE = 'yearendproject-data.json';
  static SNAPSHOT_FOLDER = 'history';
  static SNAPSHOT_KEEP = 14;

  constructor(directory) {
    this.directory = directory;
    this.revision = 0;
    this.recoveredFrom = null;
  }

  async readText() {
    try {
      const handle = await this.directory.getFileHandle(FileBackend.DATA_FILE);
      return await (await handle.getFile()).text();
    } catch (error) {
      if (error.name === 'NotFoundError') return null;
      throw error;
    }
  }

  // Writes go through a temp file: old content is replaced only after the new content is complete.
  static async writeFile(directory, name, text) {
    const handle = await directory.getFileHandle(name, { create: true });
    const writable = await handle.createWritable();
    try {
      await writable.write(text);
      await writable.close();
    } catch (error) {
      await writable.abort().catch(() => {});
      throw error;
    }
  }

  async snapshots() {
    const folder = await this.directory.getDirectoryHandle(FileBackend.SNAPSHOT_FOLDER, { create: true });
    const names = [];
    for await (const [name] of folder.entries()) {
      if (/^data-\d{4}-\d{2}-\d{2}\.json$/.test(name)) names.push(name);
    }
    return { folder, names: names.sort().reverse() };
  }

  async load() {
    const text = await this.readText();
    if (text === null) {
      // Reading snapshots also proves the folder still exists. A missing folder
      // must be an error, not shown as empty data.
      const { names } = await this.snapshots();
      return names.length > 0 ? this.recover(null, new DataInvalidError('Berkas data hilang.')) : null;
    }
    try {
      const { data, revision } = DataFormat.parse(text);
      this.revision = revision;
      return data;
    } catch (error) {
      if (!(error instanceof DataInvalidError) || error instanceof DataVersionError) throw error;
      return this.recover(text, error);
    }
  }

  // Main file corrupt or missing: keep the corrupt one as evidence, then use the newest intact snapshot.
  async recover(brokenText, originalError) {
    const { folder, names } = await this.snapshots();
    for (const name of names) {
      const file = await (await folder.getFileHandle(name)).getFile();
      const text = await file.text();
      try {
        const { data, revision } = DataFormat.parse(text);
        if (brokenText !== null) await FileBackend.writeFile(this.directory, `corrupt-${Date.now()}.json`, brokenText);
        await FileBackend.writeFile(this.directory, FileBackend.DATA_FILE, text);
        this.revision = revision;
        this.recoveredFrom = name;
        return data;
      } catch (error) {
        if (!(error instanceof DataInvalidError)) throw error;
      }
    }
    throw originalError;
  }

  async takeSnapshot(currentText) {
    const { folder, names } = await this.snapshots();
    const name = `data-${DateUtil.today()}.json`;
    if (names.includes(name)) return;
    await FileBackend.writeFile(folder, name, currentText);
    const outdated = [name, ...names].sort().reverse().slice(FileBackend.SNAPSHOT_KEEP);
    await Promise.all(outdated.map((old) => folder.removeEntry(old)));
  }

  // Runs on every window focus, so it reads only the start of a file that can be many megabytes.
  async isStale() {
    let file;
    try {
      file = await (await this.directory.getFileHandle(FileBackend.DATA_FILE)).getFile();
    } catch (error) {
      if (error.name === 'NotFoundError') return false;
      throw error;
    }
    const revision = DataFormat.revisionOf(await file.slice(0, 256).text());
    return revision !== null && revision !== this.revision;
  }

  async save(data) {
    const current = await this.readText();
    if (current !== null) {
      // Another tab saved a newer version, so this tab must not overwrite it.
      if (DataFormat.revisionOf(current.slice(0, 256)) !== this.revision) {
        throw new DataConflictError('Data sudah diubah dari tab atau jendela lain.');
      }
      await this.takeSnapshot(current);
    }
    const revision = this.revision + 1;
    await FileBackend.writeFile(this.directory, FileBackend.DATA_FILE, DataFormat.serialize(data, revision));
    this.revision = revision;
  }
}

// Fallback for browsers without folder access, like Firefox and Safari. Data is erased with browser data.
class BrowserBackend {
  static DATABASE = 'yearendproject-data';
  static STORE = 'files';
  static KEY = 'data';

  constructor() {
    this.revision = 0;
    this.recoveredFrom = null;
  }

  open() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(BrowserBackend.DATABASE, 1);
      request.onupgradeneeded = () => request.result.createObjectStore(BrowserBackend.STORE);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async run(mode, work) {
    const database = await this.open();
    try {
      return await new Promise((resolve, reject) => {
        const transaction = database.transaction(BrowserBackend.STORE, mode);
        const request = work(transaction.objectStore(BrowserBackend.STORE));
        transaction.oncomplete = () => resolve(request.result);
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    } finally {
      database.close();
    }
  }

  async load() {
    const text = await this.run('readonly', (store) => store.get(BrowserBackend.KEY));
    if (!text) return null;
    const { data, revision } = DataFormat.parse(text);
    this.revision = revision;
    return data;
  }

  async isStale() {
    const current = await this.run('readonly', (store) => store.get(BrowserBackend.KEY));
    const revision = current ? DataFormat.revisionOf(current.slice(0, 256)) : null;
    return revision !== null && revision !== this.revision;
  }

  // The check and the write share one transaction, so two tabs saving at once cannot both pass the check.
  async save(data) {
    const revision = this.revision + 1;
    const text = DataFormat.serialize(data, revision);
    let stale = false;
    try {
      await this.run('readwrite', (store) => {
        const read = store.get(BrowserBackend.KEY);
        read.onsuccess = () => {
          const current = read.result ? DataFormat.revisionOf(read.result.slice(0, 256)) : null;
          if (current !== null && current !== this.revision) {
            stale = true;
            read.transaction.abort();
          } else {
            store.put(text, BrowserBackend.KEY);
          }
        };
        return read;
      });
    } catch (error) {
      if (stale) throw new DataConflictError('Data sudah diubah dari tab atau jendela lain.');
      throw error;
    }
    this.revision = revision;
  }
}

// Picks the storage location and remembers the user data folder.
class StorageManager {
  static HANDLE_DATABASE = 'yearendproject-handle';
  static HANDLE_STORE = 'handles';
  static HANDLE_KEY = 'folder';
  // Old test databases that are no longer used.
  static RETIRED_DATABASES = ['kenanga-invoice', 'yearendproject'];

  static supportsFiles() {
    return typeof window.showDirectoryPicker === 'function';
  }

  static removeRetiredData() {
    if (!window.indexedDB) return;
    for (const name of StorageManager.RETIRED_DATABASES) indexedDB.deleteDatabase(name);
  }

  // Only a folder pointer is kept in the browser. If lost, just pick the folder again.
  static withHandleStore(mode, work) {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(StorageManager.HANDLE_DATABASE, 1);
      request.onupgradeneeded = () => request.result.createObjectStore(StorageManager.HANDLE_STORE);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => {
        const database = request.result;
        const transaction = database.transaction(StorageManager.HANDLE_STORE, mode);
        const action = work(transaction.objectStore(StorageManager.HANDLE_STORE));
        transaction.oncomplete = () => {
          database.close();
          resolve(action.result);
        };
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      };
    });
  }

  static async rememberedFolder() {
    try {
      return await StorageManager.withHandleStore('readonly', (store) => store.get(StorageManager.HANDLE_KEY));
    } catch (error) {
      return undefined;
    }
  }

  static async rememberFolder(folder) {
    try {
      await StorageManager.withHandleStore('readwrite', (store) => store.put(folder, StorageManager.HANDLE_KEY));
    } catch (error) {
      // The site keeps working. The user only needs to pick the folder again next time.
    }
  }

  static async chooseFolder() {
    const folder = await window.showDirectoryPicker({ id: 'yearendproject', mode: 'readwrite', startIn: 'documents' });
    await StorageManager.rememberFolder(folder);
    return folder;
  }

  static async hasPermission(folder) {
    return (await folder.queryPermission({ mode: 'readwrite' })) === 'granted';
  }

  static async requestPermission(folder) {
    return (await folder.requestPermission({ mode: 'readwrite' })) === 'granted';
  }
}

class ItemRepository {
  constructor(store) {
    this.store = store;
  }

  // Items saved before units were made uniform are shown with the uniform spelling too.
  async all() {
    const items = this.store.read((data) => data.items);
    const byAge = [...items].sort((a, b) => a.id - b.id);
    return items.map((item) => ({ ...item, unit: UnitCatalog.canonical(item.unit, byAge) }))
      .sort((a, b) => a.description.localeCompare(b.description, 'id'));
  }

  // Every write passes here, from the form, an import, or an invoice, so units are made uniform once.
  static put(data, item) {
    const others = data.items.filter((other) => other.id !== item.id).sort((a, b) => a.id - b.id);
    item = { ...item, unit: UnitCatalog.canonical(item.unit, others) };
    const index = data.items.findIndex((candidate) => candidate.id === item.id);
    if (index >= 0) {
      data.items[index] = item;
    } else {
      data.items.push({ ...item, id: data.nextItemId });
      data.nextItemId += 1;
    }
  }

  save(item) {
    return this.store.update((data) => ItemRepository.put(data, item));
  }

  // New items and changes from an invoice are written together.
  sync(added, changes) {
    return this.store.update((data) => {
      for (const item of added) ItemRepository.put(data, item);
      for (const { item, differences } of changes) {
        const values = Object.fromEntries(differences.map(({ key, invoice }) => [key, invoice]));
        ItemRepository.put(data, { ...item, ...values });
      }
    });
  }

  delete(id) {
    return this.store.update((data) => {
      data.items = data.items.filter((item) => item.id !== id);
    });
  }
}

  <script>
class InvoiceLockedError extends Error {}

class InvoiceRepository {
  constructor(store) {
    this.store = store;
  }

  async all() {
    const invoices = this.store.read((data) => data.invoices);
    return invoices.sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  }

  // Read on every page change for the menu alarm, so only the count is copied out of the store.
  async dueCount(today) {
    return this.store.read((data) => Reminder.due(data.invoices, today).length);
  }

  async get(id) {
    return this.store.read((data) => data.invoices.find((invoice) => invoice.id === id));
  }

  // Takes the next unused number, then advances the counter.
  static allocate(usedNumbers, rule, date, prefix) {
    let sequence = rule.next;
    let number = NumberFormatter.format(rule, date, sequence, prefix);
    while (usedNumbers.has(number)) {
      sequence += 1;
      number = NumberFormatter.format(rule, date, sequence, prefix);
    }
    rule.next = sequence + 1;
    return number;
  }

  // A customer's name as printed: no stray spaces. The key also ignores letter case.
  static customerName(name) {
    return name.trim().replace(/\s+/g, ' ');
  }

  static customerKey(name) {
    return InvoiceRepository.customerName(name).toLowerCase();
  }

  // Customers are remembered from earlier invoices, so no separate list needs keeping. The newest invoice wins,
  // and voided ones are skipped because an invoice is often voided for the wrong customer.
  static customers(invoices, config) {
    const known = new Map();
    for (const invoice of [...invoices].sort((a, b) => b.id - a.id)) {
      const name = InvoiceRepository.customerName(invoice.customer.name);
      const key = InvoiceRepository.customerKey(name);
      if (invoice.voided || !name || known.has(key)) continue;
      known.set(key, {
        ...invoice.customer,
        name,
        termDays: Number.isInteger(invoice.termDays) ? invoice.termDays : config.termDays,
        number: invoice.number,
        date: invoice.date,
      });
    }
    const main = config.customer.name.trim();
    if (main && !known.has(InvoiceRepository.customerKey(main))) {
      known.set(InvoiceRepository.customerKey(main), { ...config.customer, name: main, termDays: config.termDays });
    }
    return [...known.values()];
  }

  static AGING = ['Belum jatuh tempo', '1–30 hari', '31–60 hari', '61–90 hari', 'Lebih dari 90 hari'];

  // The column of the aging report, by whole days past the due date.
  static agingBucket(invoice, today) {
    const late = DateUtil.daysBetween(Reminder.dueDate(invoice), today);
    if (late <= 0) return 0;
    if (late <= 30) return 1;
    if (late <= 60) return 2;
    return late <= 90 ? 3 : 4;
  }

  // Money still owed, per customer and per age. A snoozed reminder still counts, because the money is still out.
  // The customer owing the most overdue money comes first, since that is who to call.
  static aging(invoices, today) {
    const groups = new Map();
    const open = invoices.filter((invoice) => !invoice.paid && !invoice.voided).sort((a, b) => b.id - a.id);
    for (const invoice of open) {
      const name = InvoiceRepository.customerName(invoice.customer.name);
      const key = InvoiceRepository.customerKey(name);
      if (!groups.has(key)) groups.set(key, { name, amounts: InvoiceRepository.AGING.map(() => 0), total: 0, invoices: [] });
      const group = groups.get(key);
      group.amounts[InvoiceRepository.agingBucket(invoice, today)] += invoice.totals.total;
      group.total += invoice.totals.total;
      group.invoices.push(invoice);
    }
    const overdue = (group) => group.total - group.amounts[0];
    const customers = [...groups.values()].sort((a, b) => overdue(b) - overdue(a) || b.total - a.total);
    for (const group of customers) group.invoices.sort((a, b) => Reminder.dueDate(a).localeCompare(Reminder.dueDate(b)));
    const amounts = InvoiceRepository.AGING.map((_, index) => customers.reduce((sum, group) => sum + group.amounts[index], 0));
    return { today, customers, amounts, total: amounts.reduce((sum, amount) => sum + amount, 0) };
  }

  static usedSjNumbers(invoices) {
    return new Set(invoices.map((invoice) => invoice.sjNumber).filter(Boolean));
  }

  // An issued invoice must stay the same even if store identity or bank details change.
  // The logo is not copied, to keep the data file small.
  static issuerFrom(config) {
    return {
      store: { ...config.store, logo: null },
      bank: { ...config.bank },
      closing: config.closing,
    };
  }

  static log(invoice, action, detail) {
    invoice.history = [...(invoice.history || []), { at: new Date().toISOString(), action, detail: detail || '' }];
  }

  // Number, counter, and invoice are saved together, so duplicate numbers are impossible.
  create(draft) {
    return this.store.update((data) => {
      const config = ConfigRepository.merge(data.config);
      const invoice = {
        ...draft,
        id: data.nextInvoiceId,
        totals: InvoiceCalculator.totals(draft),
        issuer: InvoiceRepository.issuerFrom(config),
        paid: false,
        voided: false,
        createdAt: new Date().toISOString(),
        // Frozen like the issuer, so a later change in settings never moves this invoice's due date.
        termDays: Number.isInteger(draft.termDays) ? draft.termDays : config.termDays,
      };
      const usedInvoiceNumbers = new Set(data.invoices.map((existing) => existing.number));
      invoice.number = InvoiceRepository.allocate(usedInvoiceNumbers, config.invoiceNumber, draft.date, 'INV');
      if (draft.includeSj) {
        invoice.sjNumber = InvoiceRepository.allocate(
          InvoiceRepository.usedSjNumbers(data.invoices), config.sjNumber, draft.date, 'SJ');
      }
      InvoiceRepository.log(invoice, 'Dibuat', Format.rupiah(invoice.totals.total));
      data.config = config;
      data.invoices.push(invoice);
      data.nextInvoiceId += 1;
      return invoice;
    });
  }

  // Changes always use the latest status, not the stale copy in a form.
  mutate(id, change) {
    return this.store.update((data) => {
      const config = ConfigRepository.merge(data.config);
      const invoice = data.invoices.find((candidate) => candidate.id === id);
      change(invoice, { config, existing: data.invoices });
      data.config = config;
      return invoice;
    });
  }

  static ensureDeliveryNote(invoice, config, existing) {
    invoice.includeSj = true;
    if (invoice.sjNumber) return;
    invoice.sjNumber = InvoiceRepository.allocate(
      InvoiceRepository.usedSjNumbers(existing), config.sjNumber, invoice.date, 'SJ');
    InvoiceRepository.log(invoice, 'Surat Jalan dibuat', invoice.sjNumber);
  }

  // A paid or voided invoice must not change value.
  revise(id, fields) {
    return this.mutate(id, (invoice, { config, existing }) => {
      if (invoice.paid || invoice.voided) throw new InvoiceLockedError('Invoice ini sudah dibayar atau dibatalkan.');
      const previous = invoice.totals.total;
      const previousTerm = invoice.termDays;
      Object.assign(invoice, fields);
      invoice.totals = InvoiceCalculator.totals(invoice);
      const change = previous === invoice.totals.total
        ? `Total tetap ${Format.rupiah(previous)}`
        : `Total ${Format.rupiah(previous)} menjadi ${Format.rupiah(invoice.totals.total)}`;
      // A longer term quiets the reminder, so the history keeps every change to it.
      const termChange = fields.termDays !== undefined && fields.termDays !== previousTerm
        ? ` • termin ${Number.isInteger(previousTerm) ? previousTerm : '1 bulan'} menjadi ${fields.termDays} hari`
        : '';
      InvoiceRepository.log(invoice, 'Diubah', `${change}${termChange}`);
      if (fields.includeSj) InvoiceRepository.ensureDeliveryNote(invoice, config, existing);
    });
  }

  // A delivery note can be added later to a saved invoice.
  addDeliveryNote(id) {
    return this.mutate(id, (invoice, { config, existing }) => {
      InvoiceRepository.ensureDeliveryNote(invoice, config, existing);
    });
  }

  setPaid(id, paid) {
    return this.mutate(id, (invoice) => {
      if (invoice.voided) throw new InvoiceLockedError('Invoice ini sudah dibatalkan.');
      if (invoice.paid === paid) return;
      // The bank date was typed in when it was marked paid, so it stays findable in the history after an unmark.
      const previous = invoice.paidAt;
      invoice.paid = paid;
      invoice.paidAt = paid ? DateUtil.today() : null;
      InvoiceRepository.log(invoice, paid ? 'Ditandai sudah dibayar' : 'Ditandai belum dibayar',
        !paid && previous ? `Sebelumnya uang masuk ${Format.date(previous)}` : '');
    });
  }

  // One hotel transfer often pays several invoices, so they are saved together:
  // if any of them was voided meanwhile, none change. Returns how many were newly marked.
  markPaid(ids, paidAt) {
    return this.store.update((data) => {
      const invoices = ids.map((id) => data.invoices.find((invoice) => invoice.id === id));
      if (invoices.some((invoice) => !invoice || invoice.voided)) {
        throw new InvoiceLockedError('Ada invoice yang sudah dibatalkan, jadi tidak ada yang ditandai.');
      }
      const unpaid = invoices.filter((invoice) => !invoice.paid);
      const total = unpaid.reduce((sum, invoice) => sum + invoice.totals.total, 0);
      for (const invoice of unpaid) {
        invoice.paid = true;
        invoice.paidAt = paidAt;
        const others = unpaid.filter((other) => other !== invoice).map((other) => other.number);
        const received = `Uang masuk ${Format.date(paidAt)}`;
        InvoiceRepository.log(invoice, 'Ditandai sudah dibayar', others.length > 0
          ? `${received} • bersama ${others.join(', ')} • total ${Format.rupiah(total)}`
          : received);
      }
      return unpaid.length;
    });
  }

  // Weekly, the usual follow-up pace for an overdue bill.
  snooze(id, today) {
    return this.mutate(id, (invoice) => {
      invoice.remindAfter = DateUtil.addDays(today, 7);
    });
  }

  // A voided invoice stays stored so its number is never reused.
  voidInvoice(id, reason) {
    return this.mutate(id, (invoice) => {
      if (invoice.paid) throw new InvoiceLockedError('Invoice yang sudah dibayar tidak bisa dibatalkan.');
      if (invoice.voided) return;
      invoice.voided = true;
      invoice.voidedAt = DateUtil.today();
      invoice.voidReason = reason;
      InvoiceRepository.log(invoice, 'Dibatalkan', `${reason} • ${Format.rupiah(invoice.totals.total)}`);
    });
  }
}

class TransferError extends Error {}

// Separate Export and Import for Invoices, DB, and Generate Config, for example when moving devices.
class TransferService {
  static SCHEMA = 1;
  static LABELS = { invoices: 'Invoice', items: 'Daftar Barang', config: 'Pengaturan Toko' };

  constructor(store) {
    this.store = store;
  }

  static fileName(kind) {
    return `yearendproject-${kind}-${DateUtil.today()}.json`;
  }

  static save(blob, name) {
    const url = URL.createObjectURL(blob);
    h('a', { href: url, download: name }).click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  static download(kind, payload) {
    const text = JSON.stringify({ app: DataFormat.APP, kind, schema: TransferService.SCHEMA, exportedAt: new Date().toISOString(), ...payload });
    TransferService.save(new Blob([text], { type: 'application/json' }), TransferService.fileName(kind));
  }

  static RECAP_HEADER = ['Tanggal', 'No. Invoice', 'No. Surat Jalan', 'No. PO', 'Pelanggan', 'Subtotal', 'Diskon', 'DPP', 'PPN',
    'Tarif PPN (%)', 'Total', 'Termin (hari)', 'Jatuh tempo', 'Status', 'Tanggal uang masuk', 'Keterangan'];

  // One row per invoice, oldest first, so the accountant copies nothing by hand.
  // Voided invoices stay listed, because their numbers must be accounted for, but carry no money cells,
  // so a SUM in Excel matches the total row. DPP and PPN are filled only where PPN was charged.
  static recapRows(invoices, totalLabel = 'TOTAL (tanpa yang dibatalkan)') {
    const sorted = [...invoices].sort((a, b) => a.date.localeCompare(b.date) || a.number.localeCompare(b.number));
    const money = (invoice) => {
      if (invoice.voided) return ['', '', '', '', '', ''];
      const { totals } = invoice;
      return invoice.ppnEnabled
        ? [totals.subtotal, totals.discount, totals.taxBase, totals.ppn, invoice.ppnRate, totals.total]
        : [totals.subtotal, totals.discount, '', '', '', totals.total];
    };
    const rows = sorted.map((invoice) => [
      { date: invoice.date },
      invoice.number,
      invoice.sjNumber || '',
      invoice.poNumber || '',
      invoice.customer.name,
      ...money(invoice),
      Number.isInteger(invoice.termDays) ? invoice.termDays : '',
      { date: Reminder.dueDate(invoice) },
      invoice.voided ? 'Dibatalkan' : (invoice.paid ? 'Sudah dibayar' : 'Belum dibayar'),
      invoice.paidAt ? { date: invoice.paidAt } : '',
      invoice.voided ? `${invoice.voidReason || 'Dibatalkan'} (total semula ${Format.rupiah(invoice.totals.total)})` : '',
    ]);
    const active = sorted.filter((invoice) => !invoice.voided);
    const sum = (key, list = active) => list.reduce((total, invoice) => total + invoice.totals[key], 0);
    const taxed = active.filter((invoice) => invoice.ppnEnabled);
    return [TransferService.RECAP_HEADER, ...rows,
      ['', '', '', '', totalLabel, sum('subtotal'), sum('discount'), sum('taxBase', taxed), sum('ppn', taxed), '', sum('total')]];
  }

  // The same columns as Daftar Barang on screen, so the list can be checked or shared with an accountant.
  static itemRows(items) {
    return [['Kode Barang PO', 'Nama Barang', 'Satuan', 'Harga'], ...items.map((item) => [item.code || '', item.description, item.unit || '', item.price])];
  }

  // One row per open invoice, its amount in its age column, so the accountant can filter, sort and sum.
  static agingRows(report) {
    const header = ['Pelanggan', 'No. Invoice', 'Tanggal', 'Jatuh tempo', 'Lewat (hari)', ...InvoiceRepository.AGING, 'Total'];
    const rows = report.customers.flatMap((group) => group.invoices.map((invoice) => {
      const due = Reminder.dueDate(invoice);
      const late = DateUtil.daysBetween(due, report.today);
      const bucket = InvoiceRepository.agingBucket(invoice, report.today);
      return [group.name, invoice.number, { date: invoice.date }, { date: due }, late > 0 ? late : '',
        ...InvoiceRepository.AGING.map((_, index) => (index === bucket ? invoice.totals.total : '')), invoice.totals.total];
    }));
    return [header, ...rows, ['TOTAL', '', '', '', '', ...report.amounts, report.total]];
  }

  // Extracted so file content can be tested without a real download.
  payload(kind) {
    return this.store.read((data) => {
      const config = ConfigRepository.merge(data.config);
      if (kind === 'invoices') {
        return { invoices: data.invoices, sequence: { invoice: config.invoiceNumber.next, sj: config.sjNumber.next } };
      }
      if (kind === 'items') return { items: data.items };
      return { config };
    });
  }

  async exportFile(kind) {
    TransferService.download(kind, this.payload(kind));
    if (kind === 'invoices') await this.store.update((data) => { data.lastExportAt = DateUtil.today(); });
  }

  lastExport() {
    return this.store.read((data) => data.lastExportAt);
  }

  // Reminders, the aging report and the recap read these fields, so a broken value is stopped here.
  static validInvoice(invoice) {
    return typeof invoice.number === 'string' && DateUtil.isValid(invoice.date)
      && Array.isArray(invoice.lines) && invoice.customer && typeof invoice.customer.name === 'string'
      && invoice.issuer && invoice.issuer.store
      && (invoice.termDays === undefined || invoice.termDays === null || Reminder.parseTerm(invoice.termDays) === invoice.termDays)
      && (!invoice.paidAt || DateUtil.isValid(invoice.paidAt))
      && InvoiceCalculator.isConsistent(invoice);
  }

  static validItem(item) {
    return typeof item.description === 'string' && item.description.trim() !== ''
      && typeof item.code === 'string' && Number.isSafeInteger(item.price) && item.price > 0;
  }

  // The whole file is checked first. One bad entry means nothing is imported.
  static parse(text, kind) {
    let file;
    try {
      file = JSON.parse(text);
    } catch (error) {
      throw new TransferError('Berkas ini tidak bisa dibaca.');
    }
    if (!file || file.app !== DataFormat.APP || !TransferService.LABELS[file.kind]) {
      throw new TransferError('Berkas ini bukan export ProjectYearEnd.');
    }
    if (file.kind !== kind) {
      throw new TransferError(`Berkas ini berisi ${TransferService.LABELS[file.kind]}, bukan ${TransferService.LABELS[kind]}.`);
    }
    if (file.schema !== TransferService.SCHEMA) throw new TransferError('Berkas ini dibuat oleh versi situs yang berbeda.');
    if (kind === 'invoices') {
      if (!Array.isArray(file.invoices)) throw new TransferError('Isi berkas tidak lengkap.');
      const broken = file.invoices.find((invoice) => !TransferService.validInvoice(invoice));
      if (broken) throw new TransferError(`Import dibatalkan: invoice ${broken.number || 'tanpa nomor'} rusak atau totalnya tidak cocok.`);
    } else if (kind === 'items') {
      if (!Array.isArray(file.items)) throw new TransferError('Isi berkas tidak lengkap.');
      const broken = file.items.find((item) => !TransferService.validItem(item));
      if (broken) throw new TransferError(`Import dibatalkan: data barang ${broken.description || 'tanpa nama'} tidak lengkap.`);
    } else if (!file.config || !file.config.store) {
      throw new TransferError('Isi berkas tidak lengkap.');
    }
    return file;
  }

  static sameInvoice(a, b) {
    const content = ({ id, ...rest }) => JSON.stringify(rest);
    return content(a) === content(b);
  }

  // Invoices are never overwritten: an existing number with different content is skipped and reported.
  previewInvoices(file) {
    const current = this.store.read((data) => data.invoices);
    const byNumber = new Map(current.map((invoice) => [invoice.number, invoice]));
    const fresh = [];
    const same = [];
    const conflicts = [];
    for (const invoice of file.invoices) {
      const existing = byNumber.get(invoice.number);
      if (!existing) fresh.push(invoice);
      else if (TransferService.sameInvoice(existing, invoice)) same.push(invoice);
      else conflicts.push(invoice);
    }
    return { fresh, same, conflicts };
  }

  importInvoices(file) {
    return this.store.update((data) => {
      const numbers = new Set(data.invoices.map((invoice) => invoice.number));
      const incoming = file.invoices.filter((invoice) => !numbers.has(invoice.number));
      for (const invoice of incoming) {
        data.invoices.push({ ...invoice, id: data.nextInvoiceId });
        data.nextInvoiceId += 1;
      }
      const config = ConfigRepository.merge(data.config);
      if (file.sequence) {
        config.invoiceNumber.next = Math.max(config.invoiceNumber.next, file.sequence.invoice || 1);
        config.sjNumber.next = Math.max(config.sjNumber.next, file.sequence.sj || 1);
      }
      data.config = config;
      // The imported file is itself a copy kept outside this computer.
      const exported = (file.exportedAt || '').slice(0, 10) || DateUtil.today();
      if (!data.lastExportAt || exported > data.lastExportAt) data.lastExportAt = exported;
      return incoming.length;
    });
  }

  static matchItem(items, item) {
    const text = (value) => value.trim().toLowerCase();
    return items.find((existing) => item.code && text(existing.code) === text(item.code))
      || items.find((existing) => text(existing.description) === text(item.description));
  }

  previewItems(file) {
    const current = this.store.read((data) => data.items);
    const updated = file.items.filter((item) => TransferService.matchItem(current, item)).length;
    return { added: file.items.length - updated, updated };
  }

  importItems(file) {
    return this.store.update((data) => {
      for (const item of file.items) {
        const existing = TransferService.matchItem(data.items, item);
        ItemRepository.put(data, { ...item, id: existing ? existing.id : undefined });
      }
    });
  }

  // Number counters must never go backward, so used numbers are not repeated.
  importConfig(file) {
    return this.store.update((data) => {
      const current = ConfigRepository.merge(data.config);
      const config = ConfigRepository.merge(file.config);
      config.invoiceNumber.next = Math.max(config.invoiceNumber.next, current.invoiceNumber.next);
      config.sjNumber.next = Math.max(config.sjNumber.next, current.sjNumber.next);
      data.config = config;
    });
  }
}

// Sheet skeleton shared by all documents. Each document type fills in its own parts.
class BaseDocument {
  constructor(invoice, config) {
    this.invoice = invoice;
    // Identity and bank details use the copy from issue time, not the latest settings.
    this.config = { ...invoice.issuer, store: { ...invoice.issuer.store, logo: config.store.logo } };
    this.hasCodes = invoice.lines.some((line) => line.code);
    this.tableClass = invoice.lines.some(PoLine.isPo) ? 'sheet-table is-po' : 'sheet-table';
  }

  get kicker() { throw new Error('Dokumen harus mengisi kicker'); }
  get title() { throw new Error('Dokumen harus mengisi title'); }
  get number() { throw new Error('Dokumen harus mengisi number'); }

  // Long names or addresses eat table space, so rows per page shrink until everything fits.
  // stage must already be in the page so sheets can be measured.
  renderInto(stage) {
    let fullPage = Paginator.FULL_PAGE;
    let lastPage = Paginator.LAST_PAGE;
    stage.replaceChildren(...this.render(fullPage, lastPage));
    while (lastPage > 1 && BaseDocument.overflows(stage)) {
      fullPage -= 1;
      lastPage -= 1;
      stage.replaceChildren(...this.render(fullPage, lastPage));
    }
  }

  static overflows(stage) {
    return [...stage.querySelectorAll('.sheet')].some((sheet) => sheet.scrollHeight > sheet.clientHeight);
  }

  // Department headings stay with their lines and repeat when a department continues on a new page.
  pages(fullPage, lastPage) {
    const rows = [];
    let department;
    this.invoice.lines.forEach((line, index) => {
      if (line.department && line.department !== department) rows.push({ heading: line.department });
      department = line.department;
      // A PO line keeps the PO's own number, so Receiving and AP match the right line.
      rows.push({ ...line, position: line.poLine || index + 1 });
    });
    const pages = Paginator.split(rows, fullPage, lastPage);
    pages.forEach((page, index) => {
      const next = pages[index + 1];
      if (!next) return;
      if (page[page.length - 1].heading) next.unshift(page.pop());
      else if (next[0].department) next.unshift({ heading: next[0].department });
    });
    return pages;
  }

  render(fullPage, lastPage) {
    const pages = this.pages(fullPage, lastPage);
    return pages.map((rows, index) => {
      const isLast = index === pages.length - 1;
      return h('section', { class: `sheet ${this.invoice.voided ? 'is-voided' : ''}` },
        this.top(index + 1, pages.length),
        this.store(),
        h('div', { class: 'sheet-parties' }, this.parties()),
        this.legend(),
        this.table(rows),
        isLast ? this.ending() : this.continuation(rows, pages, index));
    });
  }

  top(page, pageCount) {
    return h('div', { class: 'sheet-top' },
      h('div', {},
        h('div', { class: 'sheet-kicker' }, this.kicker),
        h('div', { class: 'sheet-title' }, this.title)),
      h('div', { class: 'sheet-meta' },
        h('div', {}, h('span', {}, 'NO.'), h('strong', {}, this.number)),
        h('div', {},
          h('span', {}, 'TANGGAL'),
          Format.date(this.invoice.date),
          h('small', {}, `HALAMAN ${page} / ${pageCount}`))));
  }

  store() {
    const store = this.config.store;
    const lineOne = [store.business, store.address].filter(Boolean).join('  •  ');
    const lineTwo = [store.phone, store.web].filter(Boolean).join('  •  ');
    const info = [store.hours && `Buka ${store.hours}`, store.npwp && `NPWP ${store.npwp}`].filter(Boolean).join('  •  ');
    const initial = (store.name || '?').trim().charAt(0).toUpperCase();
    return h('div', { class: 'sheet-store' },
      h('div', { class: 'sheet-store-main' },
        h('div', { class: 'sheet-logo' }, store.logo ? h('img', { src: store.logo, alt: '' }) : initial),
        h('div', {},
          h('div', { class: 'sheet-store-name' }, store.name),
          lineOne && h('div', { class: 'sheet-store-line' }, lineOne),
          lineTwo && h('div', { class: 'sheet-store-line' }, lineTwo))),
      info && h('div', { class: 'sheet-info' }, h('span', { class: 'sheet-label' }, 'Info Toko'), info));
  }

  party(label, main, ...details) {
    if (!main && !details.some(Boolean)) return h('div');
    return h('div', {},
      h('span', { class: 'sheet-label' }, label),
      main && h('strong', {}, main),
      details.filter(Boolean).map((detail) => h('small', {}, detail)));
  }

  continuation(rows, pages, index) {
    const lines = pages[index + 1].filter((row) => row.position);
    const first = lines[0].position;
    const last = lines[lines.length - 1].position;
    return h('div', { class: 'sheet-continue' },
      `LANJUTAN • ITEM ${first === last ? first : `${first}–${last}`} DI HALAMAN ${index + 2}`,
      h('small', {}, `HALAMAN ${index + 1} DARI ${pages.length}`));
  }

  position(row) {
    return String(row.position).padStart(2, '0');
  }

  legend() {
    const { lines } = this.invoice;
    if (!lines.some(PoLine.isPo)) return null;
    const counts = PoLine.count(lines, PoLine.delivery);
    return h('div', { class: 'sheet-legend' },
      ['full', 'partial', 'none'].map((tone) => this.legendItem(PoLine.DELIVERY_MARKS[tone], tone, PoLine.DELIVERY_LABELS[tone], counts[tone])),
      this.priceLegend());
  }

  legendItem(mark, tone, label, count = 0) {
    return h('span', {}, h('b', { class: `sheet-mark is-${tone}` }, mark), ` ${label} ${count}`);
  }

  priceLegend() {
    return null;
  }

  rowClass(row) {
    const delivery = PoLine.delivery(row);
    return delivery === 'partial' || delivery === 'none' ? `is-${delivery}` : null;
  }

  headingRow(row, columns) {
    return h('tr', { class: 'sheet-dept' }, h('td', { colspan: columns }, row.heading));
  }

  itemCell(row) {
    return h('td', {},
      h('div', { class: 'sheet-item' }, row.description),
      row.note && h('div', { class: 'sheet-line-note' }, row.note));
  }

  qtyCell(row) {
    const delivery = PoLine.delivery(row);
    if (!delivery) return h('td', { class: 'c-qty' }, Format.qty(row.qty));
    return h('td', { class: 'c-qty' },
      h('b', { class: `sheet-mark is-${delivery}` }, PoLine.DELIVERY_MARKS[delivery]),
      ` ${Format.qty(row.qty)}`,
      delivery !== 'full' && h('small', { class: 'sheet-of' }, `dari ${Format.qty(row.poQty)}`));
  }
}

class InvoiceDocument extends BaseDocument {
  get kicker() { return 'INVOICE'; }
  get title() { return 'TAGIHAN / BUKTI PEMBELIAN'; }
  get number() { return this.invoice.number; }

  parties() {
    const { customer, poNumber, sjNumber, includeSj } = this.invoice;
    const bank = this.config.bank;
    return [
      this.party('Pelanggan', customer.name, customer.attn && `Attn: ${customer.attn}`, customer.contact, customer.address),
      this.party('Pembayaran', bank.name ? `Transfer ${bank.name}` : 'Transfer bank', bank.account, bank.holder && `a.n. ${bank.holder}`),
      this.party('Referensi', poNumber && `PO: ${poNumber}`, includeSj && sjNumber && `SJ: ${sjNumber}`),
    ];
  }

  table(rows) {
    return h('table', { class: this.tableClass },
      h('thead', {}, h('tr', {},
        h('th', { class: 'c-no' }, 'NO.'),
        this.hasCodes && h('th', { class: 'c-code' }, 'KODE'),
        h('th', {}, 'ITEM / DESKRIPSI'),
        h('th', { class: 'c-qty' }, 'QTY'),
        h('th', { class: 'c-unit' }, 'SAT.'),
        h('th', { class: 'c-price' }, 'HARGA'),
        h('th', { class: 'c-amount' }, 'JUMLAH'))),
      h('tbody', {}, rows.map((row) => (row.heading ? this.headingRow(row, this.hasCodes ? 7 : 6) : h('tr', { class: this.rowClass(row) },
        h('td', { class: 'c-no' }, this.position(row)),
        this.hasCodes && h('td', { class: 'c-code' }, row.code),
        this.itemCell(row),
        this.qtyCell(row),
        h('td', { class: 'c-unit' }, row.unit),
        this.priceCell(row),
        h('td', { class: `c-amount ${InvoiceDocument.priceTone(row)}` }, Format.number(InvoiceCalculator.lineAmount(row))))))));
  }

  static priceTone(row) {
    const price = PoLine.price(row);
    return price === 'higher' || price === 'lower' ? `is-${price}` : '';
  }

  priceCell(row) {
    const tone = InvoiceDocument.priceTone(row);
    if (!tone) return h('td', { class: 'c-price' }, Format.number(row.price));
    return h('td', { class: `c-price ${tone}` },
      h('small', { class: 'sheet-was' }, Format.number(row.poPrice)),
      `${PoLine.PRICE_MARKS[PoLine.price(row)]} ${Format.number(row.price)}`);
  }

  priceLegend() {
    const counts = PoLine.count(this.invoice.lines, PoLine.price);
    return [
      this.legendItem(PoLine.PRICE_MARKS.higher, 'higher', 'Harga naik', counts.higher),
      this.legendItem(PoLine.PRICE_MARKS.lower, 'lower', 'Harga turun', counts.lower),
      this.legendItem('=', 'same', 'Harga tetap', counts.same),
    ];
  }

  ending() {
    const { totals } = this.invoice;
    return [
      h('div', { class: 'sheet-summary' },
        h('div', { class: 'sheet-note' }, this.invoice.note && `Catatan: ${this.invoice.note.replace(/\s*\n+\s*/g, ' • ')}`),
        h('div', { class: 'sheet-totals' },
          h('div', {}, h('span', {}, 'SUBTOTAL'), h('span', {}, Format.rupiah(totals.subtotal))),
          h('div', {}, h('span', {}, 'DISKON'), h('span', {}, Format.rupiah(totals.discount))),
          this.invoice.ppnEnabled && h('div', {},
            h('span', {}, `PPN ${String(this.invoice.ppnRate).replace('.', ',')}%`),
            h('span', {}, Format.rupiah(totals.ppn))),
          h('div', { class: 'sheet-grand' }, h('span', {}, 'TOTAL'), h('span', {}, Format.rupiah(totals.total))))),

// Reads positioned text from browser-generated PDFs without any library.
// shortcut: handles the Skia/PDF output of Marriott POs only; use pdf.js if other producers must be read.
class PdfText {
  static TOKENS = /<[0-9A-Fa-f\s]*>|\[|\]|\/[^\s/[\]<>()]+|[-+]?\d*\.?\d+|[A-Za-z*'"]+/g;
  static MAX_INFLATED_BYTES = 64 * 1024 * 1024;

  static multiply(a, b) {
    return [
      a[0] * b[0] + a[1] * b[2], a[0] * b[1] + a[1] * b[3],
      a[2] * b[0] + a[3] * b[2], a[2] * b[1] + a[3] * b[3],
      a[4] * b[0] + a[5] * b[2] + b[4], a[4] * b[1] + a[5] * b[3] + b[5],
    ];
  }

  // One pass over both markers, so a file with many objects and no endobj cannot freeze the tab.
  static objects(text) {
    const objects = new Map();
    const ends = [...text.matchAll(/endobj/g)].map((match) => match.index);
    let next = 0;
    for (const match of text.matchAll(/(\d+) 0 obj\b/g)) {
      const start = match.index + match[0].length;
      while (next < ends.length && ends[next] < start) next += 1;
      objects.set(Number(match[1]), { start, end: next < ends.length ? ends[next] : -1 });
    }
    return objects;
  }

  constructor(buffer) {
    this.bytes = new Uint8Array(buffer);
    this.text = new TextDecoder('latin1').decode(this.bytes);
    this.objects = PdfText.objects(this.text);
    this.inflatedBytes = 0;
  }

  body(id) {
    const object = this.objects.get(id);
    return object ? this.text.slice(object.start, object.end) : '';
  }

  // A small file can inflate to gigabytes, so the whole file shares one limit no real PO reaches.
  async inflate(raw) {
    const reader = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate')).getReader();
    const chunks = [];
    for (let part = await reader.read(); !part.done; part = await reader.read()) {
      this.inflatedBytes += part.value.length;
      if (this.inflatedBytes > PdfText.MAX_INFLATED_BYTES) {
        await reader.cancel();
        throw new PoParseError('File ini terlalu besar untuk sebuah PO. Periksa lagi filenya.');
      }
      chunks.push(part.value);
    }
    return new Blob(chunks).arrayBuffer();
  }

  async stream(id) {
    const { start } = this.objects.get(id);
    const head = this.text.indexOf('stream', start);
    const first = this.text.startsWith('\r\n', head + 6) ? head + 8 : head + 7;
    const dictionary = this.text.slice(start, head);
    const direct = dictionary.match(/\/Length (\d+)(?! 0 R)/);
    const length = direct ? Number(direct[1]) : Number(this.body(Number(dictionary.match(/\/Length (\d+) 0 R/)[1])).trim());
    const raw = this.bytes.slice(first, first + length);
    if (!dictionary.includes('FlateDecode')) return new TextDecoder('latin1').decode(raw);
    return new TextDecoder('latin1').decode(await this.inflate(raw));
  }

  static unicode(hex) {
    return (hex.match(/.{4}/g) || []).map((unit) => String.fromCharCode(parseInt(unit, 16))).join('');
  }

  static cmap(text) {
    const table = new Map();
    for (const [, block] of text.matchAll(/beginbfchar(.*?)endbfchar/gs)) {
      for (const [, code, value] of block.matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g)) {
        table.set(parseInt(code, 16), PdfText.unicode(value));
      }
    }
    for (const [, block] of text.matchAll(/beginbfrange(.*?)endbfrange/gs)) {
      for (const [, from, to, value] of block.matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g)) {
        const first = parseInt(from, 16);
        for (let code = first; code <= parseInt(to, 16); code += 1) {
          table.set(code, String.fromCharCode(parseInt(value, 16) + code - first));
        }
      }
      for (const [, from, list] of block.matchAll(/<([0-9A-Fa-f]+)>\s*<[0-9A-Fa-f]+>\s*\[(.*?)\]/gs)) {
        [...list.matchAll(/<([0-9A-Fa-f]+)>/g)].forEach(([, value], index) => {
          table.set(parseInt(from, 16) + index, PdfText.unicode(value));
        });
      }
    }
    return table;
  }

  async fonts(page) {
    const reference = page.match(/\/Resources\s+(\d+) 0 R/);
    const resources = reference ? this.body(Number(reference[1])) : page;
    const block = resources.match(/\/Font\s*<<(.*?)>>/s);
    const fonts = new Map();
    for (const [, name, id] of (block ? block[1] : '').matchAll(/\/(\S+)\s+(\d+) 0 R/g)) {
      const unicode = this.body(Number(id)).match(/\/ToUnicode\s+(\d+) 0 R/);
      if (unicode) fonts.set(name, PdfText.cmap(await this.stream(Number(unicode[1]))));
    }
    return fonts;
  }

  static decode(parts, table) {
    return parts.filter((part) => part.hex !== undefined).map(({ hex }) => (hex.match(/.{4}/g) || [])
      .map((unit) => (table && table.get(parseInt(unit, 16))) || '').join('')).join('');
  }

  static runs(content, fonts) {
    let matrix = [1, 0, 0, 1, 0, 0];
    let text = matrix;
    let line = matrix;
    let font = null;
    let args = [];
    let list = null;
    const saved = [];
    const runs = [];
    for (const [token] of content.matchAll(PdfText.TOKENS)) {
      if (token === '[') list = [];
      else if (token === ']') {
        args.push(list);
        list = null;
      } else if (token[0] === '<') (list || args).push({ hex: token.slice(1, -1).replace(/\s/g, '') });
      else if (token[0] === '/') args.push(token.slice(1));
      else if (/^[-+]?\d*\.?\d+$/.test(token)) (list || args).push(Number(token));
      else {
        const last = args.slice(-6);
        if (token === 'q') saved.push(matrix);
        else if (token === 'Q' && saved.length > 0) matrix = saved.pop();
        else if (token === 'cm') matrix = PdfText.multiply(last, matrix);
        else if (token === 'BT') text = line = [1, 0, 0, 1, 0, 0];
        else if (token === 'Tf') [font] = args.slice(-2);
        else if (token === 'Tm') text = line = last;
        else if (token === 'Td') text = line = PdfText.multiply([1, 0, 0, 1, ...args.slice(-2)], line);
        else if (token === 'Tj' || token === 'TJ') {
          const parts = args[args.length - 1];
          const position = PdfText.multiply(text, matrix);
          runs.push({
            x: position[4],
            y: Math.round(position[5] * 10) / 10,
            text: PdfText.decode(Array.isArray(parts) ? parts : [parts], fonts.get(font)),
          });
        }
        args = [];
      }
    }
    return runs;
  }

  // Returns one array of { x, y, text } runs per page, in reading order of the file.
  async pages() {
    const pages = [];
    for (const id of this.objects.keys()) {
      const body = this.body(id);
      if (/\/Type\s*\/Page\b/.test(body)) {
        const contents = body.match(/\/Contents\s+(\d+) 0 R/);
        if (contents) pages.push(PdfText.runs(await this.stream(Number(contents[1])), await this.fonts(body)));
      }
    }
    return pages;
  }
}

  <script>
// Turns a Lampung Marriott purchase order into an invoice draft. Rules come from real POs in 2024-2026.
class MarriottPoParser extends PoParser {
  static CUSTOMER_NAME = 'Lampung Marriott Resort & SPA';
  static NOISE_NOTE = /^(edit|update|received)$/i;
  static QTY_ROUNDING = 0.005;

  static clean(text) {
    return text.replace(/\s+/g, ' ').replace(/\s+,/g, ',').trim();
  }

  static money(text) {
    return Number(text.replace(/Rp|,/g, ''));
  }

  // Glyphs arrive one by one, so runs sharing a height are joined into one row.
  static rows(pages) {
    const rows = [];
    pages.forEach((runs, page) => {
      const byHeight = new Map();
      for (const run of runs) byHeight.set(run.y, [...(byHeight.get(run.y) || []), run]);
      [...byHeight.keys()].sort((a, b) => b - a).forEach((y) => {
        rows.push({ page, y, runs: byHeight.get(y).sort((a, b) => a.x - b.x) });
      });
    });
    return rows;
  }

  static text(row, from = -Infinity, to = Infinity) {
    return row.runs.filter(({ x }) => x >= from && x < to).map((run) => run.text).join('');
  }

  static find(rows, pattern, to) {
    for (const row of rows) {
      const match = MarriottPoParser.clean(MarriottPoParser.text(row, -Infinity, to)).match(pattern);
      if (match) return match;
    }
    return null;
  }

  static columnOf(rows, label) {
    for (const row of rows) {
      const run = row.runs.find(({ text }) => text.startsWith(label));
      if (run) return run.x;
    }
    throw new PoParseError('Isi PO tidak terbaca utuh. Periksa file PO, atau isi invoice sendiri.');
  }

  static address(rows, column) {
    const { clean, text } = MarriottPoParser;
    const start = rows.findIndex((row) => clean(text(row, -Infinity, column)).startsWith('Delivery:'));
    const lines = [];
    for (const row of rows.slice(start + 1)) {
      const line = clean(text(row, -Infinity, column));
      if (line.startsWith('Attn:')) break;
      if (line) lines.push(line);
    }
    // Only the street can wrap inside the narrow column; the last line is always the region.
    const region = lines.pop() || '';
    return lines.length > 0 ? `${lines.join(' ')}, ${region}` : region;
  }

  static notes(rows) {
    const { clean, text } = MarriottPoParser;
    const start = rows.findIndex((row) => text(row).includes('Attachments'));
    const end = rows.findIndex((row) => text(row).includes('Product Desc'));
    return rows.slice(start + 1, end)
      .map((row) => clean(text(row, -Infinity)).replace(/^\d+\.-\s*From buyer\s*-\s*/i, ''))
      .filter((line) => line && line !== 'No Notes' && !MarriottPoParser.NOISE_NOTE.test(line))
      .join(', ');
  }

  // A line comment is followed by an empty text row, which is how it differs from a wrapped name.
  static splitName(lines, commentEnd) {
    if (commentEnd === null) return { name: lines.join(' '), note: '' };
    let start = commentEnd;
    while (start > 0 && !lines[start].startsWith('(')) start -= 1;
    if (!lines[start].startsWith('(')) start = commentEnd;
    const note = lines.slice(start, commentEnd + 1).join(' ').replace(/^\(\s*|\s*\)$/g, '');
    return { name: [...lines.slice(0, start), ...lines.slice(commentEnd + 1)].join(' '), note };
  }

  // POs print qty with 2 decimals but bill on the real one, so 5.91 KG can be 5.912 KG.
  // The printed extension is what the hotel owes, so a qty it proves replaces the printed qty.
  static exactQty({ qty, price, extension }) {
    if (!extension || !price || InvoiceCalculator.lineAmount({ qty, price }) === extension) return qty;
    const exact = Math.round((extension / price) * 1000) / 1000;
    const isRounding = Math.abs(exact - qty) <= MarriottPoParser.QTY_ROUNDING;
    return isRounding && InvoiceCalculator.lineAmount({ qty: exact, price }) === extension ? exact : qty;
  }

  static finish(current) {
    const { name, note } = MarriottPoParser.splitName(current.lines, current.commentEnd);
    const qty = MarriottPoParser.exactQty(current);
    return {
      code: current.code,
      description: name,
      unit: current.unit,
      qty,
      price: current.price,
      poQty: qty,
      poPrice: current.price,
      department: current.department,
      note,
    };
  }

  static items(rows) {
    const { clean, text } = MarriottPoParser;
    const header = rows.findIndex((row) => text(row).includes('Product Desc'));
    const end = rows.findIndex((row) => text(row).includes('Sub Total'));
    const nameColumn = MarriottPoParser.columnOf(rows.slice(header), 'Pr');
    const packColumn = MarriottPoParser.columnOf(rows.slice(header), 'Pack');
    const lines = [];
    let department = '';
    let current = null;
    for (const row of rows.slice(header + 1, end)) {
      const whole = clean(text(row));
      const left = text(row, -Infinity, nameColumn - 1).replace(/[\s*]/g, '');
      const name = clean(text(row, nameColumn - 1, packColumn)).replace(/[\s`]+$/, '');
      const right = text(row, packColumn - 1).replace(/[\s/]/g, '');
      const anchor = left.match(/^(\d+)([A-Z]\S*)$/);
      const priced = right.match(/^([\d,]+\.\d+)([A-Za-z]+?)(Rp[\d,]+)$/);
      const extension = right.match(/^\d*(Rp[\d,]+)$/);
      if (whole.includes('Department:')) department = whole.split('Department:')[1].trim().replace(/^[0-9A-Z]+-/, '');
      else if (anchor) {
        if (current) lines.push(MarriottPoParser.finish(current));
        current = { code: anchor[2], department, lines: [], commentEnd: null };
      } else if (current && extension) current.extension = MarriottPoParser.money(extension[1]);
      else if (current && priced) {
        current.lines.push(name);
        current.qty = Number(priced[1].replace(/,/g, ''));
        current.unit = priced[2];
        current.price = MarriottPoParser.money(priced[3]);
      } else if (current && name) current.lines.push(name);
      else if (current && !whole && current.lines.length > 1) current.commentEnd = current.commentEnd ?? current.lines.length - 1;
    }
    if (current) lines.push(MarriottPoParser.finish(current));
    // The same item can repeat, so a line's place in the PO is what identifies it across deliveries.
    return lines.map((line, index) => ({ ...line, poLine: index + 1 }));
  }

  static draft(pages) {
    const { find, money } = MarriottPoParser;
    const rows = MarriottPoParser.rows(pages);
    if (!find(rows, /PURCHASE ORDER/i) || !find(rows, /Lampung Marriott/)) {
      throw new PoParseError('File ini bukan PO Lampung Marriott Resort & SPA.');
    }
    const supplierColumn = MarriottPoParser.columnOf(rows, 'Supplier');
    const lines = MarriottPoParser.items(rows);
    const total = find(rows, /Sub Total:\s*(Rp[\d,]+)/);
    const subTotal = total ? money(total[1]) : 0;
    const counted = lines.reduce((sum, line) => sum + InvoiceCalculator.lineAmount(line), 0);
    // A misread line must stop here rather than reach an invoice with a wrong amount.
    if (lines.length === 0 || counted !== subTotal) {
      throw new PoParseError('Isi PO tidak terbaca utuh. Periksa file PO, atau isi invoice sendiri.');
    }
    const attn = find(rows, /^Attn:\s*(.+)$/, supplierColumn - 1);
    const phone = find(rows, /^Phone:\s*(\+?[\d-]+)/, supplierColumn - 1);
    const supplier = find(rows, /Supplier:\s*(.+)$/);
    const status = find(rows, /Status:\s*(.+)$/);
    const subject = find(rows, /Subject:\s*(.+)$/);
    const delivery = find(rows, /Delivery date\s*:\s*(\d{2})\/(\d{2})\/(\d{4})/);
    const note = MarriottPoParser.notes(rows);
    const due = find(rows, /Total amount due:\s*(Rp[\d,]+)/);
    return {
      customer: {
        name: MarriottPoParser.CUSTOMER_NAME,
        attn: attn ? attn[1] : '',
        contact: phone ? phone[1] : '',
        address: MarriottPoParser.address(rows, supplierColumn - 1),
      },
      includeSj: true,
      // Confirmation copies title the same field "Confirming PO".
      poNumber: find(rows, /(?:PO NUMBER|Confirming PO)\s*:\s*(\S+?)(?:Delivery|\s|$)/)[1],
      ...(note && { note }),
      poTotal: subTotal,
      lines,
      review: {
        supplier: supplier ? supplier[1] : '',
        status: status ? status[1] : '',
        subject: subject ? subject[1] : '',
        deliveryDate: delivery ? `${delivery[3]}-${delivery[1]}-${delivery[2]}` : '',
        subTotal,
        totalDue: due ? money(due[1]) : null,
        departments: [...new Set(lines.map((line) => line.department).filter(Boolean))],
      },
    };
  }

  async parse(file) {
    return MarriottPoParser.draft(await new PdfText(await file.arrayBuffer()).pages());
  }
}
