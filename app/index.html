// Switches light or night mode on screen. Printed sheets do not change.
class Theme {
  static KEY = 'yearendproject-theme';

  static saved() {
    try {
      return localStorage.getItem(Theme.KEY);
    } catch (error) {
      return null;
    }
  }

  // Until the user chooses, follow the system setting.
  static system() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  static current() {
    return document.documentElement.dataset.theme;
  }

  static apply(theme) {
    document.documentElement.dataset.theme = theme;
  }

  static toggle() {
    const next = Theme.current() === 'dark' ? 'light' : 'dark';
    Theme.apply(next);
    try {
      localStorage.setItem(Theme.KEY, next);
    } catch (error) {
      // Stays applied until the page closes even if it cannot be remembered.
    }
    return next;
  }

  static followSystem(onChange) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (Theme.saved()) return;
      Theme.apply(Theme.system());
      onChange();
    });
  }
}

Theme.apply(Theme.saved() || Theme.system());

</script>
  <script>
// Short intro when the site opens on the home page, then the landing page appears in stages.
class Splash {
  static MINIMUM_MS = 1100;
  static FADE_MS = 350;

  static shouldPlay() {
    const isHome = !location.hash.replace(/^#\/?/, '');
    return isHome && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  static prepare() {
    if (Splash.shouldPlay()) document.documentElement.classList.add('show-splash');
  }

  static delay(milliseconds) {
    return new Promise((resolve) => setTimeout(resolve, milliseconds));
  }

  static async finish() {
    const splash = document.getElementById('splash');
    if (!splash) return;
    if (!document.documentElement.classList.contains('show-splash')) {
      splash.remove();
      return;
    }
    await Splash.delay(Math.max(0, Splash.MINIMUM_MS - performance.now()));
    splash.classList.add('is-leaving');
    const home = document.querySelector('.home');
    if (home) home.classList.add('is-intro');
    await Splash.delay(Splash.FADE_MS);
    splash.remove();
    document.documentElement.classList.remove('show-splash');
  }
}

Splash.prepare();

</script>

  <style>
* { box-sizing: border-box; }

/* A focused field must not hide behind the sticky header or save bar. */
html { scroll-padding: 84px 0 104px; }

body {
  background: var(--color-page);
  color: var(--color-text);
  font-family: var(--font);
  font-size: var(--text-body);
  font-variant-numeric: tabular-nums;
  line-height: 1.5;
  margin: 0;
  transition: background-color .2s, color .2s;
}

h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
p, li, .notice { text-wrap: pretty; }
h1 { color: var(--color-heading); font-size: var(--text-title); line-height: 1.25; }
h2 { color: var(--color-heading); font-size: var(--text-heading); line-height: 1.3; }
a { color: var(--color-primary-strong); }
.muted { color: var(--color-muted); }
.eyebrow { color: var(--color-primary-strong); font-size: var(--text-caption); font-weight: 700; letter-spacing: var(--tracking-caps); text-transform: uppercase; }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }

/* Continuous corners where the browser has them; others keep the plain radius. */
@supports (corner-shape: squircle) {
  .app-nav a, .button, .theme-toggle, .tour-exit, .panel, input, select, textarea, .notice, .stat, .segmented, .totals-grand, .home-card, .dialog, .tour-card, .toast, .number-preview, .logo-preview, .action-bar, .unit-column, .unit-tooltip, .table th, .table-stack tr, .table-stack tr.dept-row td { corner-shape: squircle; }
}

.view { animation: view-in .22s var(--ease) both; }
.view:focus { outline: none; }
@keyframes view-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.app-header {
  align-items: center;
  background: var(--color-page);
  border-bottom: 2px solid var(--color-line);
  display: flex;
  gap: var(--space-4);
  justify-content: space-between;
  padding: var(--space-3) var(--space-6);
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand { align-items: center; color: var(--color-heading); display: flex; flex: none; gap: var(--space-3); text-decoration: none; }
.brand strong { display: block; font-size: var(--text-figure); line-height: 1.1; }
.brand small { color: var(--color-muted); display: block; font-size: var(--text-tiny); font-weight: 600; letter-spacing: .05em; }
.brand-mark {
  align-items: center;
  background: var(--color-primary);
  border-radius: 50%;
  color: var(--color-on-primary);
  display: flex;
  flex: none;
  font-size: var(--text-figure);
  font-weight: 700;
  height: 38px;
  justify-content: center;
  width: 38px;
}
.app-nav { display: none; flex: 1; gap: var(--space-1); justify-content: center; }
body[data-route="module"] .app-nav { display: flex; }
.app-nav a { border-radius: var(--radius-small); color: var(--color-muted); font-size: var(--text-control); font-weight: 600; padding: var(--space-2) var(--space-3); text-decoration: none; transition: background-color .15s, color .15s; white-space: nowrap; }

.logo-preview { align-items: center; background: var(--color-primary-soft); border-radius: var(--radius-small); color: var(--color-primary-strong); display: flex; flex: none; font-size: var(--text-caption); font-weight: 700; height: 64px; justify-content: center; overflow: hidden; width: 72px; }
.logo-preview img { height: 100%; object-fit: contain; width: 100%; }
.logo-remove { margin-top: var(--space-2); }
.number-preview-row { margin-top: var(--space-4); }
.panel-text { margin-bottom: var(--space-3); }
.panel-spaced { margin-top: var(--space-5); }

.transfer-row { align-items: center; border-top: 1px solid var(--color-line); display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: space-between; padding: var(--space-3) 0; }
.transfer-row:last-of-type { padding-bottom: 0; }
.transfer-row strong { color: var(--color-heading); }
.transfer-row .muted { font-size: var(--text-small); }
.gate { align-items: center; display: flex; justify-content: center; min-height: calc(100vh - 70px); }
.gate-panel { max-width: 520px; width: 100%; }
.gate-panel h1 { margin: var(--space-1) 0 var(--space-3); }
.gate-panel p + p { margin-top: var(--space-2); }
.gate-panel .notice { margin: var(--space-3) 0 0; }
.gate-steps { margin: var(--space-3) 0 0; padding-left: var(--space-5); }
.gate-steps li + li { margin-top: var(--space-1); }
.gate-steps strong { color: var(--color-heading); }
.gate-actions { align-items: center; display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: space-between; margin-top: var(--space-5); }
.gate-actions .button-primary { flex: 1 1 200px; }
.link-button { background: none; border: 0; color: var(--color-muted); cursor: pointer; font: inherit; font-size: var(--text-small); padding: var(--space-2) 0; text-decoration: underline; text-underline-offset: 3px; }
.link-button:hover { color: var(--color-primary-strong); }
.void-reason { color: var(--color-muted); display: block; font-size: var(--text-caption); margin-top: 2px; max-width: 220px; overflow-wrap: anywhere; }
.compare-list { display: flex; flex-direction: column; max-height: 50vh; overflow-y: auto; }
.compare-item { border-top: 1px solid var(--color-line); display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) 0; }
.compare-item:last-child { padding-bottom: 0; }
.compare-head { align-items: center; display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: space-between; }
.compare-head strong { color: var(--color-heading); }
.compare-head .segmented button { font-size: var(--text-small); min-height: var(--control-height-small); padding: 0 var(--space-3); }
.compare-value { color: var(--color-muted); display: grid; font-size: var(--text-small); gap: var(--space-2); grid-template-columns: 72px minmax(0, 1fr) minmax(0, 1fr); }
.compare-value strong { color: var(--color-heading); }
.dialog-error { color: var(--color-danger); font-size: var(--text-small); font-weight: 600; }
.dialog-error:empty { display: none; }

.tabs { border-bottom: 2px solid var(--color-line); display: flex; gap: var(--space-2); margin-bottom: var(--space-4); }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--color-muted); cursor: pointer; font: inherit; font-size: var(--text-control); font-weight: 600; margin-bottom: -2px; padding: var(--space-2) var(--space-4); transition: color .15s; }
.tabs button:hover { color: var(--color-primary-strong); }
.tabs .is-active { border-bottom-color: var(--color-primary); color: var(--color-primary-strong); }

/* Short intro */
.splash {
  align-items: center;
  animation: splash-safety .3s linear 4s forwards;
  background: var(--color-page);
  display: none;
  flex-direction: column;
  inset: 0;
  justify-content: center;
  position: fixed;
  transition: opacity .35s ease;
  z-index: 50;
}
.show-splash .splash { display: flex; }
.splash.is-leaving { opacity: 0; pointer-events: none; }
.splash > * { animation: splash-in .55s var(--ease) both; }
.splash-mark { font-size: var(--text-display); height: 64px; margin-bottom: var(--space-3); width: 64px; }
.splash-name { animation-delay: .1s; color: var(--color-heading); font-size: var(--text-title); line-height: 1.2; }
.splash-tag { animation-delay: .18s; color: var(--color-muted); font-size: var(--text-caption); font-weight: 600; letter-spacing: .12em; }
.splash-line { animation: splash-line .9s var(--ease) .2s both; background: var(--color-primary); border-radius: 2px; height: 3px; margin-top: var(--space-4); transform-origin: left; width: 120px; }
@keyframes splash-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
@keyframes splash-line {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
/* Safety net: the intro still disappears if loading fails. */
@keyframes splash-safety {
  to { opacity: 0; visibility: hidden; }
}

/* Home page */
.home { display: flex; flex-direction: column; margin: 0 auto; max-width: calc(var(--home-width) + var(--space-6) * 2); min-height: calc(100vh - 70px); padding: var(--space-5) var(--space-6); }
.home-stage { align-items: center; display: grid; flex: 1; gap: var(--space-6); grid-template-columns: minmax(0, 1fr) 460px minmax(0, 1fr); margin: var(--space-5) 0; width: 100%; }
.home-side { display: flex; flex-direction: column; gap: 76px; position: relative; }
.home-card {
  align-items: center;
  background: var(--color-surface);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-large);
  color: inherit;
  display: flex;

}
.home-card:hover { background: var(--color-primary-soft); border-color: var(--color-primary); box-shadow: var(--shadow-raised); transform: translateY(-2px); }
.home-card::after { background: var(--color-line); content: ""; height: 1px; position: absolute; top: 50%; width: var(--space-6); }
.home-side-left .home-card::after { right: calc(var(--space-6) * -1); }
.home-side-right .home-card::after { left: calc(var(--space-6) * -1); }
.home-card-icon { align-items: center; background: var(--color-primary-soft); border-radius: 50%; color: var(--color-primary-strong); display: flex; flex: none; height: 46px; justify-content: center; transition: background-color .18s; width: 46px; }
.home-card:hover .home-card-icon { background: var(--color-surface); }
.home-card strong { color: var(--color-heading); display: block; font-size: var(--text-heading); }
.home-card small { color: var(--color-muted); font-size: var(--text-control); }
.home-card-badge { background: var(--color-warning); border-radius: var(--radius-pill); color: var(--color-surface); font-size: var(--text-caption); font-weight: 700; padding: 2px var(--space-2); position: absolute; right: var(--space-3); top: var(--space-3); }
.drop-circle {
  align-items: center;
  aspect-ratio: 1;
  background: var(--color-surface);
  border: 2px solid var(--color-line);
  border-radius: 50%;
  box-shadow: 8px 8px 0 var(--shadow-circle);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--space-6);
  text-align: center;
  transition: border-color .15s, background-color .15s, transform .18s var(--ease);
}
.drop-circle.is-over { background: var(--color-primary-soft); border-color: var(--color-primary); transform: scale(1.02); }
.drop-arrow { align-items: center; background: var(--color-primary-soft); border-radius: 50%; color: var(--color-primary-strong); display: flex; height: 96px; justify-content: center; margin-bottom: var(--space-4); width: 96px; }
.drop-circle.is-over .drop-arrow { animation: drop-bounce .7s ease-in-out infinite; }
@keyframes drop-bounce {
  50% { transform: translateY(6px); }
}
.drop-circle h1 { font-size: var(--text-display); }
.drop-circle .button { font-size: var(--text-control); max-width: 100%; min-height: 48px; width: 272px; }
.drop-circle .button-primary { letter-spacing: .02em; }
.drop-circle .button + .button { margin-top: var(--space-2); }
.drop-hint { color: var(--color-muted); font-size: var(--text-small); margin: var(--space-1) 0 var(--space-4); }
.home-footer { border-top: 2px solid var(--color-line); color: var(--color-muted); display: flex; flex-wrap: wrap; font-size: var(--text-small); gap: var(--space-3); justify-content: space-between; padding-top: var(--space-4); }
.home-footer strong { font-weight: 700; }
.home-notice { margin: var(--space-4) 0 0; }

/* Landing page appears in stages after the intro */
.home.is-intro .home-intro-text { animation: view-in .5s var(--ease) both; }
.home.is-intro .drop-circle { animation: circle-in .7s var(--ease) both; }

.home.is-intro .home-side-right .home-card { animation: card-right .55s var(--ease) both; }
.home.is-intro .home-card:nth-child(1) { animation-delay: .18s; }
.home.is-intro .home-card:nth-child(2) { animation-delay: .28s; }
.home.is-intro .home-card::after { animation: line-in .4s ease .55s both; }
.home.is-intro .home-footer { animation: view-in .5s var(--ease) .4s both; }
@keyframes circle-in {
  from { opacity: 0; transform: scale(.94); }
  to { opacity: 1; transform: none; }
}
@keyframes card-left {
  from { opacity: 0; transform: translateX(-18px); }
  to { opacity: 1; transform: none; }
}
@keyframes card-right {
  from { opacity: 0; transform: translateX(18px); }
  to { opacity: 1; transform: none; }
}
@keyframes line-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

.dialog { background: var(--color-surface); border: 0; border-radius: var(--radius); box-shadow: var(--shadow-dialog); color: var(--color-text); max-width: min(520px, calc(100vw - var(--space-4) * 2)); padding: var(--space-5); width: 100%; }
.dialog[open] { animation: dialog-in .18s var(--ease) both; }
.dialog::backdrop { animation: line-in .18s ease both; background: var(--color-backdrop); }
.dialog h2 { margin-bottom: var(--space-3); }
.dialog-body { display: flex; flex-direction: column; gap: var(--space-3); }
.dialog-body ol { margin: 0; padding-left: var(--space-5); }
.dialog-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: flex-end; margin-top: var(--space-5); }
@keyframes dialog-in {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to { opacity: 1; transform: none; }
}

.moyen-yard { border-bottom: 2px solid var(--color-line); height: 60px; margin-top: var(--space-6); position: relative; }
.moyen-ground .button { position: relative; z-index: 3; }
.moyen-actor { height: 64px; left: 0; position: absolute; top: 0; width: 64px; z-index: 2; }
.moyen-actor.is-talking { z-index: 6; }
.moyen { background: none; border: 0; border-radius: var(--radius-small); cursor: pointer; display: block; height: 64px; padding: 0; width: 64px; }
.moyen-sprite { background-repeat: no-repeat; background-size: auto 64px; display: block; height: 64px; image-rendering: pixelated; width: 64px; }
.moyen-bubble { background: var(--color-surface); border: 2px solid var(--color-heading); border-radius: var(--radius-small); bottom: 58px; box-shadow: var(--shadow-raised); color: var(--color-heading); font-size: var(--text-small); font-weight: 600; max-width: 240px; padding: var(--space-2) var(--space-3); pointer-events: none; position: absolute; width: max-content; }
.moyen-bubble[hidden] { display: none; }
.moyen-bubble em { color: var(--color-muted); font-weight: 400; white-space: nowrap; }
/* impeccable-disable-next-line side-tab -- the tail of Moyen's speech bubble (a rotated square), not a card accent border */
.moyen-bubble::after { background: var(--color-surface); border-bottom: 2px solid var(--color-heading); border-right: 2px solid var(--color-heading); bottom: -7px; content: ""; height: 12px; position: absolute; transform: rotate(45deg); width: 12px; }
.moyen-actor.is-left .moyen-bubble { left: var(--space-2); }
.moyen-actor.is-left .moyen-bubble::after { left: var(--space-5); }
.moyen-actor:not(.is-left) .moyen-bubble { right: var(--space-2); }
.moyen-actor:not(.is-left) .moyen-bubble::after { right: var(--space-5); }
.moyen-actor.is-below .moyen-bubble { bottom: auto; top: 60px; }
.moyen-actor.is-below .moyen-bubble::after { bottom: auto; top: -7px; transform: rotate(225deg); }
/* A home visit takes no space: he stands on the footer line, and only his own body takes clicks. */
.moyen-yard.is-visit { border: 0; height: 0; margin: 0; pointer-events: none; transition: opacity .4s var(--ease); }
.moyen-yard.is-visit .moyen { animation: tour-fade .4s var(--ease) both; pointer-events: auto; }
.moyen-yard.is-leaving { opacity: 0; }
/* Mid-hop he crosses cards and buttons, so a click there reaches what is under him. */
.moyen-yard.is-visit .is-leaping .moyen { pointer-events: none; }

/* Tutorial: the spotlight glides between targets and the card follows; one ring pulse marks each new target. */
.tour-shade { animation: tour-fade .35s var(--ease) both; background: var(--color-backdrop); inset: 0; position: fixed; z-index: 45; }
.tour-ring { border: 3px solid var(--color-focus); border-radius: var(--radius-large); pointer-events: none; position: fixed; z-index: 46; }
.tour-ring[hidden] { display: none; }
.tour-ring::after { border: 3px solid var(--color-focus); border-radius: inherit; content: ""; inset: -3px; opacity: 0; position: absolute; }
.tour-ring.is-new::after { animation: tour-pulse 1.1s var(--ease) 2; }
.tour-card { background: var(--color-surface); border-radius: var(--radius); box-shadow: var(--shadow-dialog); color: var(--color-text); display: flex; flex-direction: column; gap: var(--space-2); max-width: calc(100vw - var(--space-5)); padding: var(--space-5); position: fixed; transition: top .35s var(--ease), left .35s var(--ease); width: 380px; z-index: 46; }
.tour-card[hidden] { display: none; }
.tour-card:focus { outline: none; }
.tour-card.is-entering > * { animation: tour-rise .32s var(--ease) both; }
.tour-card.is-entering > :nth-child(2) { animation-delay: .05s; }
.tour-card.is-entering > :nth-child(3) { animation-delay: .1s; }
.tour-foot { align-items: center; display: flex; gap: var(--space-3); justify-content: space-between; margin-top: var(--space-2); min-height: var(--control-height); }
.tour-progress { align-items: center; color: var(--color-muted); display: flex; font-size: var(--text-small); gap: var(--space-2); }
.tour-dots { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
.tour-dots li { background: var(--color-line); border-radius: var(--radius-pill); height: 8px; transition: width .3s var(--ease), background-color .3s var(--ease); width: 8px; }
.tour-dots li.is-done { background: var(--color-primary); }
.tour-dots li.is-current { background: var(--color-primary); width: 24px; }
.tour-praise { align-items: center; animation: tour-rise .3s var(--ease) both; color: var(--color-primary-strong); display: flex; font-size: var(--text-heading); font-weight: 700; gap: var(--space-2); }
@keyframes tour-fade { from { opacity: 0; } }
@keyframes tour-rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes tour-pulse { from { inset: -3px; opacity: .8; } to { inset: -16px; opacity: 0; } }
.tour-exit { background: var(--color-surface); position: fixed; right: var(--space-6); top: 82px; z-index: 46; }

.toast {
  background: var(--color-toast);
  border-radius: var(--radius-small);
  bottom: var(--space-5);
  box-shadow: var(--shadow-raised);
  color: var(--color-on-toast);
  left: 50%;
  max-width: calc(100vw - var(--space-4) * 2);
  opacity: 0;
  padding: var(--space-3) var(--space-4);
  pointer-events: none;
  position: fixed;
  transform: translate(-50%, 8px);
  transition: opacity .2s, transform .2s var(--ease);
  z-index: 40;
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

/* At high browser zoom, sticky bars would cover the form the user is reading. */
@media (max-height: 620px) {
  html { scroll-padding: var(--space-4) 0; }
  .app-header, .action-bar { position: static; }
  /* The selection bar holds the only way to finish marking invoices paid, and it is short, so it stays in view. */
  .invoice-bar { position: sticky; }
  .invoice-bar small { display: none; }
}

@media (max-width: 1040px) {
  html { scroll-padding-top: 140px; }
  .app-header { flex-wrap: wrap; row-gap: var(--space-2); }
  body[data-route="module"] .app-nav { flex-basis: 100%; justify-content: flex-start; order: 1; overflow-x: auto; }
  .tour-exit { right: var(--space-4); top: 136px; }
}

@media (max-width: 1100px) {
  .home-stage { grid-template-columns: 1fr; justify-items: stretch; }
  .home-side { gap: var(--space-3); }
  .home-card::after { display: none; }
  .drop-circle { grid-row: 1; justify-self: center; max-width: 440px; width: 100%; }
}

@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:first-child, .stat:last-child { grid-column: 1 / -1; }
}

/* Wide tables become labelled cards, so nobody has to scroll sideways on a small screen. */
@media (max-width: 820px) {
  .table-scroll { overflow-x: visible; }
  .table-stack thead { display: none; }
  .table-stack, .table-stack tbody, .table-stack tfoot, .table-stack tr { display: block; width: 100%; }
  /* A phone card lists only the ages that hold money. */
  .aging-table td.is-zero { display: none; }

  .table-stack tr { border: 1px solid var(--color-line); border-radius: var(--radius-small); margin-bottom: var(--space-3); padding: var(--space-2) var(--space-3); }
  .table-stack tr.dept-row { border: 0; margin-bottom: var(--space-2); padding: 0; }
  .table-stack tr.dept-row td { border-radius: var(--radius-small); display: block; padding: var(--space-2) var(--space-3); text-align: left; }
  .table-stack td, .lines-table .col-code, .lines-table .col-description, .lines-table .col-qty, .lines-table .col-unit, .lines-table .col-price, .lines-table .col-amount, .lines-table.is-po .col-qty {
    align-items: center; border: 0; display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); justify-content: space-between; min-width: 0; padding: var(--space-1) 0; text-align: right; width: auto;
  }
  .table-stack td::before { color: var(--color-muted); content: attr(data-label); font-size: var(--text-caption); text-align: left; }
  .table-stack td:not([data-label])::before { display: none; }
  .table-stack td.empty { display: block; text-align: center; }
  .lines-table .qty-wrap input { flex: none; width: 72px; }
  .lines-table .col-remove { justify-content: flex-end; width: 100%; }
  .lines-table .col-remove:empty { display: none; }
  .line-name { flex: 1 1 60%; }
  .line-note, .price-hint { flex-basis: 100%; }
  .lines-table tbody tr:not(.dept-row) { display: grid; gap: var(--space-1) var(--space-3); grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lines-table .col-no { display: none; }
  .lines-table tr.is-partial { background: var(--color-warning-soft); }
  .lines-table tr.is-none { background: var(--color-danger-soft); }
  .lines-table tr.is-partial td, .lines-table tr.is-none td { background: none; }
  .lines-table .col-description, .lines-table .col-code, .lines-table .col-remove { grid-column: 1 / -1; }
  .lines-table .col-description { order: -2; }
  .lines-table .col-code { order: -1; }
  .lines-table .col-qty, .lines-table .col-unit, .lines-table .col-price, .lines-table .col-amount, .lines-table.is-po .col-qty { align-items: flex-start; flex-direction: column; flex-wrap: nowrap; justify-content: flex-start; text-align: left; }
  .lines-table td input, .lines-table .unit-combo { flex: none; max-width: none; width: 100%; }
  .lines-table.is-po .col-description, .lines-table.is-po .col-code { display: block; padding: 0; text-align: left; }
  .lines-table.is-po .col-description::before, .lines-table.is-po .col-code::before { display: none; }
  .lines-table.is-po .line-name { color: var(--color-heading); font-weight: 600; }
  .lines-table.is-po .col-code input { color: var(--color-muted); font-size: var(--text-caption); height: auto; }
  .lines-table.is-po .col-unit input { height: var(--control-height); }
  .brand { min-height: var(--control-height); }
  .back-link, .app-nav a { align-items: center; display: inline-flex; min-height: var(--control-height); }
  .segmented button, .tabs button { min-height: var(--control-height); }
  .table-stack td a { align-items: center; display: inline-flex; min-height: var(--control-height); }
  .link-button { min-height: var(--control-height); }
  .unit-group, .unit-option { min-height: var(--control-height); }
  /* A tick now chooses invoices to mark paid, so the whole label is a finger-sized target. */
  label.check { min-height: var(--control-height); }
}

@media (max-width: 700px) {
  .app-header { padding: var(--space-3) var(--space-4); }
  .page, .home { padding: var(--space-4); }
  .summary-grid { grid-template-columns: 1fr; }
  .panel { padding: var(--space-4); }
  .drop-circle { aspect-ratio: auto; border-radius: var(--radius-large); padding: var(--space-5); }
  .action-bar { gap: var(--space-2); padding: var(--space-2) var(--space-3); }
  .action-progress { flex-basis: 100%; order: 3; }
  /* An error takes its own top line, so the save button does not jump while the vendor reaches for it. */
  .action-message { flex-basis: 100%; order: -1; }
  .moyen-bubble { max-width: 200px; }
  .compare-value { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 0; }
  .compare-value span:first-child { grid-column: 1 / -1; }
  .document-stage { padding: var(--space-2); }
}

@media (max-width: 420px) {
  .brand small { display: none; }

// Builds elements through text nodes, so user text is never parsed as HTML.
function h(tag, attrs, ...children) {
  const element = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key.startsWith('on')) element.addEventListener(key.slice(2).toLowerCase(), value);
    else if (key === 'class') element.className = value;
    else if (key === 'value') element.value = value;
    else if (key === 'checked' || key === 'selected' || key === 'disabled') element[key] = true;
    else element.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    element.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return element;
}

// Dates are stored as YYYY-MM-DD text so time zones cannot shift them.
class DateUtil {
  static toIso(date) {
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${date.getFullYear()}-${month}-${day}`;
  }

  static parse(iso) {
    const [year, month, day] = iso.split('-').map(Number);
    return new Date(year, month - 1, day);
  }

  // A real calendar date in YYYY-MM-DD form, so 2026-02-30 or 2026-13-01 never reaches date math.
  static isValid(iso) {
    return typeof iso === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(iso) && DateUtil.toIso(DateUtil.parse(iso)) === iso;
  }

  static today() {
    return DateUtil.toIso(new Date());
  }

  static addDays(iso, days) {
    const date = DateUtil.parse(iso);
    date.setDate(date.getDate() + days);
    return DateUtil.toIso(date);
  }

  // Rounded, so a daylight-saving hour cannot turn 3 days into 2.
  static daysBetween(from, to) {
    return Math.round((DateUtil.parse(to) - DateUtil.parse(from)) / 86400000);
  }

  // 31 Jan + 1 month is the end of February, not a jump into March.
  static addMonths(iso, months) {
    const date = DateUtil.parse(iso);
    const day = date.getDate();
    date.setDate(1);
    date.setMonth(date.getMonth() + months);
    const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
    date.setDate(Math.min(day, lastDay));
    return DateUtil.toIso(date);
  }

  // Inclusive range for 'day', 'week' (starting Monday), or 'month' mode.
  static range(mode, anchor) {
    if (mode === 'day') return { from: anchor, to: anchor };
    if (mode === 'week') {
      const offset = (DateUtil.parse(anchor).getDay() + 6) % 7;
      const from = DateUtil.addDays(anchor, -offset);
      return { from, to: DateUtil.addDays(from, 6) };
    }
    const from = `${anchor.slice(0, 8)}01`;
    return { from, to: DateUtil.addDays(DateUtil.addMonths(from, 1), -1) };
  }

  // A week holds at most 7 days. A month holds at most one calendar month, so it stops the day before
  // the same date next month: from the 1st that is exactly 28, 29, 30 or 31 days, whatever the month.
  static maxRangeEnd(mode, from) {
    if (mode === 'week') return DateUtil.addDays(from, 6);
    const next = DateUtil.addMonths(from, 1);
    // A late start such as 31 Jan lands on the last day of a shorter month, and that day is already the end.
    return next.slice(8) < from.slice(8) ? next : DateUtil.addDays(next, -1);
  }

  static isWholeMonth({ from, to }) {
    return from.endsWith('-01') && to === DateUtil.range('month', from).to;
  }

  // A whole month moves to the whole next month, since months differ in length; any other range moves by its own length.
  static shiftPeriod(period, step) {
    if (DateUtil.isWholeMonth(period)) return DateUtil.range('month', DateUtil.addMonths(period.from, step));
    // A one-month cycle such as 15 Jan to 14 Feb moves by a month, so it stays on the 15th without gaps or overlaps.
    if (Math.abs(step) === 1 && period.to === DateUtil.maxRangeEnd('month', period.from)) {
      const from = step > 0 ? DateUtil.addDays(period.to, 1) : DateUtil.addMonths(period.from, -1);
      return { from, to: DateUtil.maxRangeEnd('month', from) };
    }
    const length = DateUtil.daysBetween(period.from, period.to) + 1;
    return { from: DateUtil.addDays(period.from, length * step), to: DateUtil.addDays(period.to, length * step) };
  }
}

class Format {
  static MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

  static number(value) {
    const sign = value < 0 ? '-' : '';
    return sign + String(Math.abs(Math.round(value))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  static rupiah(value) {
    return `Rp ${Format.number(value)}`;
  }

  static qty(value) {
    return String(Math.round(value * 1000) / 1000).replace('.', ',');
  }

  static date(iso) {
    const [year, month, day] = iso.split('-').map(Number);
    return `${day} ${Format.MONTHS[month - 1]} ${year}`;
  }

  // Whole rupiah: 12.500 or 12500 or Rp 12.500,00. Empty means 0.
  // Ambiguous text like 12.5 or 12.500,50 becomes NaN instead of a guess.
  static parseRupiah(text) {
    const cleaned = String(text ?? '').replace(/^\s*Rp\.?\s*/i, '').trim();
    if (cleaned === '') return 0;
    const match = cleaned.match(/^(\d+|\d{1,3}(?:\.\d{3})+)(?:,0+)?$/);
    return match ? Number(match[1].replace(/\./g, '')) : NaN;
  }

  // Qty may be decimal (2,5 kg). The dot in 1.000 means thousands, but 0.500 means a half.
  // Only plain digits are accepted, so 1e3 becomes NaN.
  static parseQty(text) {
    const trimmed = String(text ?? '').trim();
    const normalized = /^[1-9]\d{0,2}(\.\d{3})+(,\d+)?$/.test(trimmed) ? trimmed.replace(/\./g, '') : trimmed;
    return /^\d+([.,]\d+)?$/.test(normalized) ? Number(normalized.replace(',', '.')) : NaN;
  }

  // Invoices print at most 3 decimals, so a finer qty would not match when AP recalculates.
  static fitsThreeDecimals(qty) {
    return Math.abs(qty * 1000 - Math.round(qty * 1000)) < 1e-6;
  }
}

// Five number patterns the store can choose. Used for Invoice (SI) and delivery note (SJ).
class NumberFormatter {
  static PATTERNS = [
    { id: 'A', label: 'A: DD-MM-YY(Nomor)', needsInput: false },
    { id: 'B', label: 'B: INV-YY-(Nomor)', needsInput: false },
    { id: 'C', label: 'C: (Masukan)-DD-MM-(Nomor)', needsInput: true },
    { id: 'D', label: 'D: (Masukan)-MM(Nomor)', needsInput: true },
    { id: 'E', label: 'E: (Masukan)-(Nomor)', needsInput: true },
  ];

  static needsInput(pattern) {
    return NumberFormatter.PATTERNS.find((item) => item.id === pattern).needsInput;
  }

  // prefix is 'INV' or 'SJ', used by pattern B.
  static format(rule, isoDate, sequence, prefix) {
    const [year, month, day] = isoDate.split('-');
    const yy = year.slice(2);
    const number = String(sequence).padStart(rule.digits, '0');
    const input = (rule.input || '').trim();
    switch (rule.pattern) {
      case 'A': return `${day}-${month}-${yy}${number}`;
      case 'B': return `${prefix}-${yy}-${number}`;
      case 'C': return `${input}-${day}-${month}-${number}`;
      case 'D': return `${input}-${month}${number}`;
      case 'E': return `${input}-${number}`;
      default: throw new Error(`Pola nomor tidak dikenal: ${rule.pattern}`);
    }
  }
}

// A normal page holds 20 rows; the last holds 16 because of the totals and signature blocks.
class Paginator {
  static FULL_PAGE = 20;
  static LAST_PAGE = 16;

  static split(rows, fullPage = Paginator.FULL_PAGE, lastPage = Paginator.LAST_PAGE) {
    const pages = [];
    let start = 0;
    while (rows.length - start > lastPage) {
      // Keep at least one row so the totals page is never empty.
      const take = Math.min(fullPage, rows.length - start - 1);
      pages.push(rows.slice(start, start + take));
      start += take;
    }
    pages.push(rows.slice(start));
    return pages;
  }
}

// The only place that calculates money. All values are whole rupiah.
// Qty and rate are computed as integers first so 1,255 × 100 cannot drift from binary fractions.
class InvoiceCalculator {
  static MAX_TOTAL = 999999999999;

  static lineAmount(line) {
    return Math.round((Math.round(line.qty * 1000) * line.price) / 1000);
  }

  static totals(invoice) {
    const subtotal = invoice.lines.reduce((sum, line) => sum + InvoiceCalculator.lineAmount(line), 0);
    const discount = invoice.discount || 0;
    const taxBase = subtotal - discount;
    const ppn = invoice.ppnEnabled ? Math.round((taxBase * Math.round(invoice.ppnRate * 100)) / 10000) : 0;
    return { subtotal, discount, taxBase, ppn, total: taxBase + ppn };
  }

  // Reconciliation: the stored total must equal a recalculation from its lines.
  static isConsistent(invoice) {
    const expected = InvoiceCalculator.totals(invoice);
    return Boolean(invoice.totals) && Object.keys(expected).every((key) => expected[key] === invoice.totals[key]);
  }
}

// Compares an invoice line with the PO it came from. Manual lines have no status.
class PoLine {
  static DELIVERY_MARKS = { full: '●', partial: '◐', none: '○' };
  static DELIVERY_LABELS = { full: 'Lengkap', partial: 'Sebagian', none: 'Tidak ada' };
  static PRICE_MARKS = { higher: '▲', lower: '▼' };

  static isPo(line) {
    return line.poQty !== undefined;
  }

  static delivery(line) {
    if (!PoLine.isPo(line)) return null;
    if (!(line.qty > 0)) return 'none';
    return line.qty < line.poQty ? 'partial' : 'full';
  }

  static price(line) {
    if (!PoLine.isPo(line)) return null;
    if (line.price === line.poPrice) return 'same';
    return line.price < line.poPrice ? 'lower' : 'higher';
  }

  // A PO can arrive in parts, so only what earlier invoices have not billed is loaded.
  static remaining(draft, invoices) {
    const same = invoices.filter((invoice) => !invoice.voided && invoice.poNumber === draft.poNumber);
    const previous = same.filter((invoice) => invoice.lines.some(PoLine.isPo));
    const billedLines = previous.flatMap((invoice) => invoice.lines).filter(PoLine.isPo);
    const billed = (poLine) => billedLines
      .filter((line) => line.poLine === poLine)
      .reduce((sum, line) => sum + Math.round(line.qty * 1000), 0);
    // A revised PO can shift its lines or change qty and price, so the remainder may be wrong.
    const revised = billedLines.some((line) => draft.lines[line.poLine - 1]?.code !== line.code)
      || previous.some((invoice) => invoice.poTotal !== undefined && invoice.poTotal !== draft.poTotal);
    const lines = draft.lines
      .map((line) => {
        const left = (Math.round(line.poQty * 1000) - billed(line.poLine)) / 1000;
        return { ...line, qty: left, poQty: left };

// Checks before an invoice is saved. Results are warnings for the vendor, not blocks.

  static PRICE_TOLERANCE_PERCENT = 10;
  static BACKDATE_DAYS = 90;

  static findItem(line, items) {
    const text = (value) => (value || '').trim().toLowerCase();
    return items.find((item) => item.code && text(item.code) === text(line.code))
      || items.find((item) => text(item.description) === text(line.description));
  }

  // Price variance: line price compared with the DB price.
  static priceVariance(line, items) {
    const item = InvoiceAudit.findItem(line, items);
    if (!item || !(line.price > 0) || line.price === item.price) return null;
    const difference = line.price - item.price;
    return { dbPrice: item.price, difference, percent: (difference / item.price) * 100 };
  }

  static duplicateOf(draft, invoices, id) {
    return invoices.find((invoice) => {
      if (invoice.voided || invoice.id === id || invoice.totals.total !== draft.totals.total) return false;
      // Deliveries of one PO can match in total, and PoLine.remaining already stops double billing.
      if (draft.lines.some(PoLine.isPo) && invoice.lines.some(PoLine.isPo)) return false;
      if (draft.poNumber) return invoice.poNumber.toLowerCase() === draft.poNumber.toLowerCase();
      return invoice.date === draft.date && invoice.customer.name.toLowerCase() === draft.customer.name.toLowerCase();
    });
  }

  static repeatedLines(lines) {
    const seen = new Set();
    return lines.filter((line) => {
      const key = (line.code || line.description).toLowerCase();
      if (seen.has(key)) return true;
      seen.add(key);
      return false;
    });
  }

  static review(draft, { items, invoices, today, id }) {
    const warnings = [];
    const duplicate = InvoiceAudit.duplicateOf(draft, invoices, id);
    if (duplicate) {
      warnings.push(`Kemungkinan tagihan ganda: ${duplicate.number} bertanggal ${Format.date(duplicate.date)} punya total sama, ${Format.rupiah(duplicate.totals.total)}.`);
    }
    if (draft.date > today) warnings.push(`Tanggal invoice ${Format.date(draft.date)} ada di masa depan.`);
    if (draft.date < DateUtil.addDays(today, -InvoiceAudit.BACKDATE_DAYS)) {
      warnings.push(`Tanggal invoice ${Format.date(draft.date)} lebih dari ${InvoiceAudit.BACKDATE_DAYS} hari yang lalu.`);
    }
    for (const line of InvoiceAudit.repeatedLines(draft.lines.filter((line) => !PoLine.isPo(line)))) {

    if (!id) {
      for (const line of draft.lines.filter((candidate) => !PoLine.isPo(candidate))) {

        if (variance && Math.abs(variance.percent) >= InvoiceAudit.PRICE_TOLERANCE_PERCENT) {
          warnings.push(`${line.description}: harga ${Format.rupiah(line.price)} berbeda ${InvoiceAudit.percentText(variance.percent)} dari harga di Daftar Barang, ${Format.rupiah(variance.dbPrice)}.`);

      }
    }
    return warnings;

  static percentText(percent) {
    return `${percent > 0 ? '+' : ''}${(Math.round(percent * 10) / 10).toString().replace('.', ',')}%`;

// Compares invoice lines with the DB. New items are added directly, differences are confirmed by the vendor.
class ItemSync {
  static FIELDS = [
    { key: 'code', label: 'Kode PO' },
    { key: 'description', label: 'Nama barang' },
    { key: 'unit', label: 'Satuan' },
    { key: 'price', label: 'Harga' },
  ];

  static same(first, second) {
    return String(first ?? '').trim().toLowerCase() === String(second ?? '').trim().toLowerCase();
  }

  // When editing an old invoice, only lines actually edited are compared.
  static editedLines(lines, previous) {
    return lines.filter((line) => !previous.some((old) =>
      ItemSync.FIELDS.every(({ key }) => ItemSync.same(line[key], old[key]))));
  }

  // An empty line field is not a difference, so DB data is never erased.
  // A PO price belongs to one order, so it never replaces the vendor's own list price.
  static differences(line, item) {
    return ItemSync.FIELDS
      .filter(({ key }) => !(key === 'price' && PoLine.isPo(line)))
      .filter(({ key }) => line[key] && !ItemSync.same(line[key], item[key]))
      .map(({ key, label }) => ({ key, label, db: item[key], invoice: line[key] }));
  }

  static review(lines, items) {
    const added = [];
    const changes = [];
    const known = [...items];
    const compared = new Set();
    // A free PO item has no price to remember, and the DB requires one.
    for (const line of lines.filter(({ price }) => price > 0)) {
      const item = InvoiceAudit.findItem(line, known);
      if (!item) {
        const entry = { code: line.code, description: line.description, unit: line.unit, price: line.price };
        added.push(entry);
        known.push(entry);
      } else if (!added.includes(item) && !compared.has(item)) {
        compared.add(item);
        const differences = ItemSync.differences(line, item);
        if (differences.length > 0) changes.push({ item, differences });
      }
    }
    return { added, changes };
  }
}

// Invoices unpaid on their due date are raised with the vendor when the site opens.
class Reminder {
  static BACKUP_DAYS = 30;

  // Daily snapshots share a disk with the data, so a copy elsewhere is asked for monthly.
  static backupDue(lastExportAt, invoices, today) {
    if (invoices.length === 0) return false;
    // createdAt, because a first invoice may be dated weeks back on the day the site is set up.
    const since = lastExportAt || invoices.map((invoice) => invoice.createdAt || invoice.date).sort()[0];
    return since < DateUtil.addDays(today, -Reminder.BACKUP_DAYS);
  }

  // The term is copied onto each invoice when it is made. Invoices from before terms existed keep the old one-month rule.
  static dueDate(invoice) {
    return Number.isInteger(invoice.termDays) ? DateUtil.addDays(invoice.date, invoice.termDays) : DateUtil.addMonths(invoice.date, 1);
  }

  // One rule for Pengaturan and Buat Invoice: whole days from 0 to 180, so a typo such as 300 cannot mute reminders.
  static parseTerm(text) {
    const value = String(text ?? '').trim();
    return /^\d{1,3}$/.test(value) && Number(value) <= 180 ? Number(value) : null;
  }

  static isDue(invoice, today) {
    if (invoice.paid || invoice.voided) return false;
    if (Reminder.dueDate(invoice) > today) return false;
    return !invoice.remindAfter || invoice.remindAfter <= today;
  }

  // Most overdue first, so the money waiting longest is asked about first.
  static due(invoices, today) {
    return invoices.filter((invoice) => Reminder.isDue(invoice, today))
      .sort((a, b) => Reminder.dueDate(a).localeCompare(Reminder.dueDate(b)));
  }

  static dueText(invoice, today) {
    const late = DateUtil.daysBetween(Reminder.dueDate(invoice), today);
    if (late === 0) return 'Jatuh tempo hari ini';
    return late > 0 ? `Lewat ${late} hari dari jatuh tempo` : `Jatuh tempo ${Format.date(Reminder.dueDate(invoice))}`;
  }
}

        + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'],

  static zip(files) {
    const encoder = new TextEncoder();
    const parts = [];
    const directory = [];
    let offset = 0;
    for (const [name, text] of files) {
      const path = encoder.encode(name);
      const data = encoder.encode(text);
      const crc = Xlsx.crc32(data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034B50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true);
      local.setUint16(12, Xlsx.ZIP_DATE, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, data.length, true);
      local.setUint32(22, data.length, true);
      local.setUint16(26, path.length, true);
      parts.push(local, path, data);
      const entry = new DataView(new ArrayBuffer(46));
      entry.setUint32(0, 0x02014B50, true);
      entry.setUint16(4, 20, true);
      entry.setUint16(6, 20, true);
      entry.setUint16(8, 0x0800, true);
      entry.setUint16(14, Xlsx.ZIP_DATE, true);
      entry.setUint32(16, crc, true);
      entry.setUint32(20, data.length, true);
      entry.setUint32(24, data.length, true);
      entry.setUint16(28, path.length, true);
      entry.setUint32(42, offset, true);
      directory.push(entry, path);
      offset += 30 + path.length + data.length;
    }
    const size = directory.reduce((sum, part) => sum + part.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054B50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, size, true);
    end.setUint32(16, offset, true);
    return new Blob([...parts, ...directory, end], { type: Xlsx.TYPE });
  }
}

// Routes use the hash so they work when index.html is opened directly from a folder.
class Router {
  constructor(outlet, routes, onNavigate) {
    this.outlet = outlet;
    this.routes = routes;
    this.onNavigate = onNavigate;
    this.currentHash = null;
    this.current = null;
    this.asking = false;
  }

  start() {
    window.addEventListener('hashchange', () => this.resolve());
    window.addEventListener('beforeunload', (event) => {
      if (this.current && this.current.isDirty()) event.preventDefault();
    });
    return this.resolve();
  }

  go(path) {
    location.hash = `#/${path}`;
  }

  async resolve() {
    const hash = location.hash.replace(/^#\/?/, '');
    if (hash === this.currentHash || this.asking) return;
    if (this.current && this.current.isDirty()) {
      this.asking = true;
      const leave = await Dialog.confirm(this.current.leaveMessage(), 'Tinggalkan');
      this.asking = false;
      if (!leave) {
        location.hash = `#/${this.currentHash}`;
        return;
      }
    }
    this.currentHash = hash;
    const [name, ...params] = hash.split('/');
    this.current = (this.routes[name] || this.routes[''])();
    this.onNavigate(name);
    // Each page gets its own container, so a slow old page cannot stack on top.
    const view = h('div', { class: 'view', tabindex: '-1' });
    this.outlet.replaceChildren(view);
    window.scrollTo(0, 0);
    try {
      await this.current.render(view, params);
    } catch (error) {
      view.replaceChildren(h('div', { class: 'page' }, h('div', { class: 'notice notice-error', role: 'alert' },
        'Halaman ini gagal dibuka. Muat ulang situs, lalu coba lagi.')));
      throw error;
    }
    // Keyboard and screen reader users land directly in the new page content.
    if (this.hasNavigated) view.focus({ preventScroll: true });
    this.hasNavigated = true;
  }

  // Redraws the same page, for example after data changes.
  async refresh() {
    this.currentHash = null;
    await this.resolve();
  }
}

class Dialog {
  static MIN_TOAST_MS = 4000;
  static TOAST_MS_PER_CHAR = 80;

  static open(title, body, actions) {
    return new Promise((resolve) => {
      Dialog.count = (Dialog.count || 0) + 1;
      const titleId = `dialog-title-${Dialog.count}`;
      const dialog = h('dialog', { class: 'dialog no-print', 'aria-labelledby': titleId });
      // Changing page cancels the dialog, so its action cannot hit data no longer on screen.
      const cancelOnLeave = () => close(false);
      const close = (value) => {
        window.removeEventListener('hashchange', cancelOnLeave);
        dialog.close();
        dialog.remove();
        resolve(value);
      };
      dialog.append(
        h('h2', { id: titleId }, title),
        h('div', { class: 'dialog-body' }, body),
        h('div', { class: 'dialog-actions' }, actions.map((action) => h('button', {
          class: `button ${action.primary ? 'button-primary' : ''} ${action.danger ? 'button-danger' : ''}`,
          type: 'button',
          // Off by default: one stray Enter must never discard work or skip a warning.
          autofocus: action.focus,
          onClick: () => {
            if (!action.validate || action.validate()) close(action.value);
          },
        }, action.label))),
      );
      dialog.addEventListener('cancel', (event) => {
        event.preventDefault();
        close(false);
      });
      window.addEventListener('hashchange', cancelOnLeave);
      document.body.append(dialog);
      dialog.showModal();
    });
  }

  static confirm(message, confirmLabel = 'Lanjutkan', danger = false) {
    return Dialog.open('Konfirmasi', h('p', {}, message), [
      { label: 'Kembali', value: false },
      { label: confirmLabel, value: true, primary: !danger, danger },
    ]);
  }

  static toast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('is-visible');
    clearTimeout(Dialog.toastTimer);
    Dialog.toastTimer = setTimeout(() => toast.classList.remove('is-visible'), Math.max(Dialog.MIN_TOAST_MS, message.length * Dialog.TOAST_MS_PER_CHAR));
  }
}

// Unit of Measure list and closest-unit search.
class UnitCatalog {
  static GROUPS = [
    {
      label: 'Hitungan Tunggal',
      units: [
        { code: 'EA', name: 'Each', description: 'Per buah / Satuan tunggal', aliases: ['buah', 'satuan'] },
        { code: 'PC', name: 'Piece', description: 'Potong / Buah', aliases: ['pcs', 'potong'] },
        { code: 'PR', name: 'Pair', description: 'Pasang', aliases: ['pasang'] },
        { code: 'DZ', name: 'Dozen', description: 'Lusin (isi 12 buah)', aliases: ['lusin'] },
        { code: 'GRS', name: 'Gross', description: 'Gross (isi 144 buah)', aliases: [] },
      ],
    },
    {
      label: 'Kemasan / Wadah',
      units: [
        { code: 'BX', name: 'Box', description: 'Kotak / Boks', aliases: ['kotak', 'boks'] },
        { code: 'CTN', name: 'Carton', description: 'Karton / Kardus', aliases: ['karton', 'kardus'] },
        { code: 'CS', name: 'Case', description: 'Peti / Wadah besar', aliases: ['peti'] },
        { code: 'PK', name: 'Pack', description: 'Pak / Bungkus', aliases: ['pak', 'bungkus'] },
        { code: 'BND', name: 'Bundle', description: 'Ikatan / Bundel', aliases: ['ikatan', 'bundel'] },
        { code: 'BAG', name: 'Bag', description: 'Kantong / Karung / Sak', aliases: ['kantong', 'karung', 'sak'] },
        { code: 'BKT', name: 'Bucket', description: 'Ember', aliases: ['ember'] },
        { code: 'SET', name: 'Set', description: 'Set / Pasangan lengkap', aliases: [] },
        { code: 'PAL', name: 'Pallet', description: 'Palet (untuk pengiriman besar)', aliases: ['palet'] },
      ],
    },
    {
      label: 'Berat & Volume',
      units: [
        { code: 'KG', name: 'Kilogram', description: 'Kilogram', aliases: ['kilo'] },
        { code: 'G', name: 'Gram', description: 'Gram', aliases: ['gr'] },
        { code: 'L', name: 'Liter', description: 'Liter', aliases: ['ltr'] },
        { code: 'ML', name: 'Milliliter', description: 'Mililiter', aliases: ['mililiter'] },
        { code: 'GAL', name: 'Gallon', description: 'Galon', aliases: ['galon'] },
        { code: 'BBL', name: 'Barrel', description: 'Barel', aliases: ['barel'] },
      ],
    },
    {
      label: 'Panjang & Luas',
      units: [
        { code: 'M', name: 'Meter', description: 'Meter', aliases: [] },
        { code: 'CM', name: 'Centimeter', description: 'Sentimeter', aliases: ['sentimeter'] },
        { code: 'MM', name: 'Millimeter', description: 'Milimeter', aliases: ['milimeter'] },
        { code: 'IN', name: 'Inch', description: 'Inci', aliases: ['inci'] },
        { code: 'M2', name: 'Square Meter', description: 'Meter persegi', aliases: ['sqm', 'meter persegi'] },
        { code: 'RL', name: 'Roll', description: 'Gulungan / Rol', aliases: ['rol', 'gulungan'] },
      ],
    },
  ];

  static MAX_RESULTS = 6;
  // Short words are not corrected, so a custom unit like btl does not become BBL.
  static MIN_TYPO_LENGTH = 4;

  static all() {
    return UnitCatalog.GROUPS.flatMap((group) => group.units);
  }

  static tooltip(unit) {
    return `(${unit.name}) — ${unit.description}`;
  }

  // One spelling per unit, so kg and KG never sit side by side: the catalog's code first,
  // else the spelling already used in the list (the first item wins), else the text as typed.
  static canonical(text, items = []) {
    const unit = String(text ?? '').trim();
    const code = unit.toUpperCase();
    if (UnitCatalog.all().some((entry) => entry.code === code)) return code;
    const known = items.find((item) => String(item.unit ?? '').trim().toLowerCase() === unit.toLowerCase());
    return known ? known.unit.trim() : unit;
  }

  static isCode(text) {
    const code = text.trim().toUpperCase();
    return UnitCatalog.all().some((unit) => unit.code === code);
  }

  static distanceAtMostOne(a, b) {
    if (Math.abs(a.length - b.length) > 1) return false;
    let i = 0;
    while (i < a.length && i < b.length && a[i] === b[i]) i += 1;
    return a.slice(i + 1) === b.slice(i + 1)
      || a.slice(i) === b.slice(i + 1)
      || a.slice(i + 1) === b.slice(i);
  }

  static score(unit, query) {
    const code = unit.code.toLowerCase();
    const terms = [unit.name.toLowerCase(), ...unit.aliases];
    if (code === query) return 0;
    if (terms.includes(query)) return 1;
    if (code.startsWith(query)) return 2;
    if (terms.some((term) => term.startsWith(query))) return 3;
    if (query.length >= UnitCatalog.MIN_TYPO_LENGTH
      && terms.some((term) => UnitCatalog.distanceAtMostOne(query, term))) return 4;
    return null;
  }

  // Order: exact code, exact name, code prefix, name prefix, then a one-letter typo.
  static search(text) {
    const query = text.trim().toLowerCase();
    if (!query) return [];
    return UnitCatalog.all()
      .map((unit, index) => ({ unit, index, score: UnitCatalog.score(unit, query) }))
      .filter((match) => match.score !== null)
      .sort((a, b) => a.score - b.score || a.index - b.index)
      .slice(0, UnitCatalog.MAX_RESULTS)
      .map((match) => match.unit);
  }
}

// Unit field: type for a suggestion, or open the category menu with a flyout to the right.
// Other units can still be typed freely. The menu lives in body so the table cannot clip it.
class UnitCombobox {
  static GAP = 4;
  static HOVER_DELAY_MS = 130;
  static count = 0;

  static wrap(input) {
    return new UnitCombobox(input).element;
  }

  constructor(input) {
    UnitCombobox.count += 1;
    this.input = input;
    this.id = `unit-menu-${UnitCombobox.count}`;
    this.mode = null;
    this.input.setAttribute('role', 'combobox');
    this.input.setAttribute('autocomplete', 'off');
    this.input.setAttribute('aria-autocomplete', 'list');
    this.input.setAttribute('aria-expanded', 'false');
    this.input.setAttribute('aria-controls', this.id);
    this.input.addEventListener('input', () => this.onType());
    this.input.addEventListener('keydown', (event) => this.onKey(event));
    this.input.addEventListener('blur', () => this.close());

    const toggle = h('button', {
      class: 'unit-toggle',
      type: 'button',
      tabindex: '-1',
      'aria-label': 'Pilih satuan',
      title: 'Pilih satuan',
      onMouseDown: (event) => event.preventDefault(),
      onClick: (event) => {
        event.preventDefault();
        this.input.focus();
        if (this.mode === 'browse') this.close();
        else this.openBrowse();
      },
    }, '▾');
    this.element = h('div', { class: 'unit-combo' }, this.input, toggle);
  }

  onType() {
    const matches = UnitCatalog.search(this.input.value);
    if (matches.length === 0 || UnitCatalog.isCode(this.input.value) && this.input.value === matches[0].code) {
      this.close();
      return;
    }
    this.openSuggest(matches);
  }

  onKey(event) {
    if (!this.mode) {
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        this.openBrowse();
      }
      return;
    }
    if (event.key === 'Escape') {
      event.stopPropagation();
      this.close();
    } else if (this.mode === 'suggest') {
      this.onSuggestKey(event);
    } else {
      this.onBrowseKey(event);
    }
  }

  // Tab is not prevented, so the suggestion is accepted and focus moves to the next field.
  onSuggestKey(event) {
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      const step = event.key === 'ArrowDown' ? 1 : -1;
      this.active = (this.active + step + this.matches.length) % this.matches.length;
      this.drawSuggest();
    } else if (event.key === 'Tab') {
      this.pick(this.matches[this.active]);
    } else if (event.key === 'Enter') {
      event.preventDefault();
      event.stopPropagation();
      this.pick(this.matches[this.active]);
    }
  }

  onBrowseKey(event) {
    const group = UnitCatalog.GROUPS[this.groupIndex];
    const move = (index, length) => (index + (event.key === 'ArrowDown' ? 1 : -1) + length) % length;
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      if (this.unitIndex === null) this.groupIndex = move(this.groupIndex, UnitCatalog.GROUPS.length);
      else this.unitIndex = move(this.unitIndex, group.units.length);
    } else if (event.key === 'ArrowRight' && this.unitIndex === null) {
      event.preventDefault();
      this.unitIndex = 0;
    } else if (event.key === 'ArrowLeft') {
      event.preventDefault();
      this.unitIndex = null;
    } else if (event.key === 'Enter') {
      event.preventDefault();
      event.stopPropagation();
      if (this.unitIndex === null) {
        this.unitIndex = 0;
      } else {
        this.pick(group.units[this.unitIndex]);
        return;
      }
    } else if (event.key === 'Tab') {
      if (this.unitIndex === null) this.close();
      else this.pick(group.units[this.unitIndex]);
      return;
    } else {
      return;
    }
    this.drawBrowse();
  }

  // Fires input so the form using this field updates its data.
  pick(unit) {
    this.input.value = unit.code;
    this.close();
    this.input.dispatchEvent(new Event('input', { bubbles: true }));
    this.input.dispatchEvent(new Event('change', { bubbles: true }));
  }

  ensurePanel() {
    if (UnitCombobox.current && UnitCombobox.current !== this) UnitCombobox.current.close();
    UnitCombobox.current = this;
    if (this.panel) return;
    this.panel = h('div', { class: 'unit-menu no-print', id: this.id, onMouseDown: (event) => event.preventDefault() });
    document.body.append(this.panel);
    this.dismiss = () => this.close();
    window.addEventListener('scroll', this.dismiss, true);
    window.addEventListener('resize', this.dismiss);
    window.addEventListener('hashchange', this.dismiss);
    this.input.setAttribute('aria-expanded', 'true');
  }

  close() {
    this.mode = null;
    clearTimeout(this.hoverTimer);
    if (!this.panel) return;
    this.panel.remove();
    this.panel = null;
    window.removeEventListener('scroll', this.dismiss, true);
    window.removeEventListener('resize', this.dismiss);
    window.removeEventListener('hashchange', this.dismiss);
    this.input.setAttribute('aria-expanded', 'false');
    this.input.removeAttribute('aria-activedescendant');
    if (UnitCombobox.current === this) UnitCombobox.current = null;
  }

  openSuggest(matches) {
    this.ensurePanel();
    this.mode = 'suggest';
    this.matches = matches;
    this.active = 0;
    this.drawSuggest();
  }

  drawSuggest() {
    const list = h('div', { class: 'unit-column', role: 'listbox' },
      this.matches.map((unit, index) => {
        const isActive = index === this.active;
        return h('div', {
          class: `unit-option ${isActive ? 'is-active' : ''}`,
          id: isActive ? `${this.id}-active` : null,
          role: 'option',
          'aria-selected': String(isActive),
          onMouseMove: (event) => {
            if (!this.pointerMoved(event) || this.active === index) return;
            this.active = index;
            this.drawSuggest();
          },
          onClick: () => this.pick(unit),
        },
        h('strong', {}, unit.code),
        h('span', {}, UnitCatalog.tooltip(unit)));
      }),
      h('div', { class: 'unit-hint' }, 'Tab / Enter untuk memilih'));
    this.panel.replaceChildren(list);
    this.input.setAttribute('aria-activedescendant', `${this.id}-active`);
    this.place(list, this.input.getBoundingClientRect().left);
  }

  openBrowse() {
    this.ensurePanel();
    this.mode = 'browse';
    this.groupIndex = 0;
    this.unitIndex = null;
    this.drawBrowse();
  }

  drawBrowse() {
    const groups = h('div', { class: 'unit-column', role: 'menu' },
      UnitCatalog.GROUPS.map((group, index) => h('div', {
        class: `unit-group ${index === this.groupIndex ? 'is-active' : ''}`,
        id: index === this.groupIndex && this.unitIndex === null ? `${this.id}-active` : null,
        role: 'menuitem',
        'aria-haspopup': 'true',
        onMouseMove: (event) => {
          if (!this.pointerMoved(event)) return;
          // A cursor moving diagonally toward the flyout must not switch category.
          clearTimeout(this.hoverTimer);
          this.hoverTimer = setTimeout(() => this.showGroup(index), UnitCombobox.HOVER_DELAY_MS);
        },
        onClick: () => this.showGroup(index),
      }, `[${group.label}]`, h('span', { 'aria-hidden': 'true' }, '›'))));
    const units = UnitCatalog.GROUPS[this.groupIndex].units;
    const flyout = h('div', {
      class: 'unit-column unit-flyout',
      role: 'menu',
      onMouseEnter: () => clearTimeout(this.hoverTimer),
    },
      units.map((unit, index) => h('div', {
        class: `unit-option ${index === this.unitIndex ? 'is-active' : ''}`,
        id: index === this.unitIndex ? `${this.id}-active` : null,
        role: 'menuitem',
        onMouseMove: (event) => {
          if (!this.pointerMoved(event) || this.unitIndex === index) return;
          this.unitIndex = index;
          this.drawBrowse();
        },
        onClick: () => this.pick(units[index]),
      }, h('strong', {}, unit.code))));
    this.panel.replaceChildren(groups, flyout);
    this.input.setAttribute('aria-activedescendant', `${this.id}-active`);

    this.place(groups, this.input.getBoundingClientRect().left);
    const rowTop = groups.children[this.groupIndex].getBoundingClientRect().top;
    const groupsBox = groups.getBoundingClientRect();
    flyout.style.top = `${this.clampTop(rowTop, flyout.offsetHeight)}px`;
    const toRight = groupsBox.right + UnitCombobox.GAP + flyout.offsetWidth <= window.innerWidth;
    const flyoutLeft = toRight ? groupsBox.right + UnitCombobox.GAP : groupsBox.left - flyout.offsetWidth - UnitCombobox.GAP;
    flyout.style.left = `${flyoutLeft}px`;
    if (this.unitIndex !== null) this.showTooltip(flyout, units[this.unitIndex], toRight);
  }

  // Browsers fire mouse events when a menu redraws under a resting cursor.
  // Only real position changes count, so keyboard selection is not overridden.
  pointerMoved(event) {
    const isFirst = this.pointerX === undefined;
    const moved = event.clientX !== this.pointerX || event.clientY !== this.pointerY;
    this.pointerX = event.clientX;
    this.pointerY = event.clientY;
    return !isFirst && moved;
  }

  showGroup(index) {
    if (!this.panel || (this.groupIndex === index && this.unitIndex === null)) return;
    this.groupIndex = index;
    this.unitIndex = null;
    this.drawBrowse();
  }

  clampTop(top, height) {
    return Math.max(UnitCombobox.GAP, Math.min(top, window.innerHeight - height - UnitCombobox.GAP));
  }

  // Opens below the field, or above it when there is no room.
  place(column, left) {
    const box = this.input.getBoundingClientRect();
    const fitsBelow = box.bottom + UnitCombobox.GAP + column.offsetHeight <= window.innerHeight;
    const top = fitsBelow ? box.bottom + UnitCombobox.GAP : box.top - column.offsetHeight - UnitCombobox.GAP;
    column.style.top = `${this.clampTop(top, column.offsetHeight)}px`;
    column.style.left = `${Math.max(UnitCombobox.GAP, Math.min(left, window.innerWidth - column.offsetWidth - UnitCombobox.GAP))}px`;
  }

  showTooltip(flyout, unit, toRight) {
    const row = flyout.children[this.unitIndex].getBoundingClientRect();
    const tooltip = h('div', { class: 'unit-tooltip', role: 'tooltip' }, UnitCatalog.tooltip(unit));
    this.panel.append(tooltip);
    const box = flyout.getBoundingClientRect();
    const spaceRight = toRight && box.right + UnitCombobox.GAP + tooltip.offsetWidth <= window.innerWidth;
    const left = spaceRight ? box.right + UnitCombobox.GAP : box.left - tooltip.offsetWidth - UnitCombobox.GAP;
    tooltip.style.left = `${Math.max(UnitCombobox.GAP, left)}px`;
    tooltip.style.top = `${this.clampTop(row.top, tooltip.offsetHeight)}px`;
  }
}

      route: 'config', target: '.action-bar .button-primary', title: 'Simpan',
      text: 'Tekan tombol ini untuk menyimpan.',
      done: (app) => app.store.read((data) => Boolean(data.config && data.config.store.name.trim())),
    },
    {
      route: 'config', target: '.app-nav a[href="#/create"]', title: 'Buat invoice pertama',
      text: 'Tekan Buat Invoice.',
      done: () => Tour.route() === 'create',
    },
    {
      route: 'create', target: '[data-tour="customer"]', title: 'Nama pelanggan',
      text: 'Tulis nama hotel atau pelanggan. Wajib diisi.',
      button: 'Lanjut', ready: (target) => target.value.trim(),
    },
    {
      route: 'create', target: '[data-tour="lines"]', title: 'Isi barang',
      text: 'Ketik barang, banyak, dan harga. Totalnya dihitung sendiri.', button: 'Lanjut',
    },
    {
      route: 'create', target: '.action-bar .button-primary', title: 'Simpan invoice',
      text: 'Setelah disimpan, cetak dari halaman invoice. Bantuan selalu ada di kanan atas.', button: 'Selesai',
      // Saving opens the new invoice; without this the tour would pull the page back to the filled form.
      done: () => Tour.route() === 'invoice',
    },
  ];

  static shouldStart(storeName, seen) {
    return !storeName.trim() && !seen;
  }

  static seen() {
    try {
      return Boolean(localStorage.getItem(Tour.KEY));
    } catch (error) {
      return false;
    }
  }

  static route() {
    return location.hash.replace(/^#\/?/, '').split('/')[0];
  }

  // Clip-path also removes the hole from hit testing, so only the target stays clickable.
  static holePath({ left, top, width, height }) {
    const pad = Tour.HOLE_PADDING;
    const r = Tour.HOLE_RADIUS;
    const [x, y, w, h] = [left - pad, top - pad, width + pad * 2 - r * 2, height + pad * 2 - r * 2];
    const corner = (dx, dy) => `a${r} ${r} 0 0 1 ${dx} ${dy}`;
    return `path(evenodd, "M0 0H${innerWidth}V${innerHeight}H0Z`
      + `M${x + r} ${y}h${w}${corner(r, r)}v${h}${corner(-r, r)}h${-w}${corner(-r, -r)}v${-h}${corner(r, -r)}Z")`;
  }

  constructor(app) {
    this.app = app;
    this.index = 0;
    this.tick = this.tick.bind(this);
  }

  start() {
    this.still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.shade = h('div', { class: 'tour-shade no-print' });
    this.ring = h('div', { class: 'tour-ring no-print', 'aria-hidden': 'true', hidden: true });
    this.card = h('div', { class: 'tour-card no-print', role: 'dialog', 'aria-label': 'Tutorial', 'aria-live': 'polite', tabindex: '-1' });
    this.exitButton = h('button', {
      class: 'icon-button tour-exit no-print',
      type: 'button',
      title: 'Keluar dari tutorial',
      'aria-label': 'Keluar dari tutorial',
      onClick: () => this.exit(),
    }, Icon.create('close', 20));
    document.body.append(this.shade, this.ring, this.card, this.exitButton);
    this.show();
    this.tick();
  }

  show() {
    const step = Tour.STEPS[this.index];
    this.target = null;
    this.next = step.button && h('button', { class: 'button button-primary', type: 'button', onClick: () => this.advance(false) }, step.button);
    this.card.hidden = true;
    this.card.replaceChildren(
      h('h2', {}, step.title),
      h('p', {}, step.text),
      h('div', { class: 'tour-foot' },
        h('div', { class: 'tour-progress' },
          h('ol', { class: 'tour-dots', 'aria-hidden': 'true' },
            Tour.STEPS.map((_, index) => h('li', { class: index < this.index ? 'is-done' : index === this.index ? 'is-current' : '' }))),
          h('span', {}, `${this.index + 1} dari ${Tour.STEPS.length}`)),
        this.next));
  }

  // A step the user completed by acting earns a short "Bagus!" before the next one appears.
  advance(praise) {
    this.index += 1;
    if (this.index === Tour.STEPS.length) {
      this.end(true);
      return;
    }
    if (!praise) {
      this.show();
      return;
    }
    this.praising = true;
    // The old target may now sit over a different field, so nothing is highlighted or clickable during the praise.
    this.shade.style.clipPath = 'none';
    this.ring.hidden = true;
    this.card.hidden = false;
    this.card.replaceChildren(h('p', { class: 'tour-praise' }, Icon.create('check', 24), 'Bagus!'));
    setTimeout(() => {
      this.praising = false;
      if (this.shade.isConnected) this.show();
    }, Tour.PRAISE_MS);
  }

  tick() {
    const step = Tour.STEPS[this.index];
    if (this.praising) {
      // Wait for the praise to finish before moving on.
    } else if (step.done && step.done(this.app)) this.advance(true);
    else if (Tour.route() !== step.route) location.hash = `#/${step.route}`;
    else this.place(document.querySelector(step.target), step);
    if (this.shade.isConnected) this.frame = requestAnimationFrame(this.tick);
  }

  place(target, step) {
    if (!target) {
      this.shade.style.clipPath = 'none';
      this.ring.hidden = true;
      return;
    }
    if (target !== this.target) {
      this.target = target;
      target.scrollIntoView({ block: 'center', behavior: this.still ? 'auto' : 'smooth' });
      (this.next && !step.ready ? this.next : target).focus({ preventScroll: true });
      this.card.hidden = false;
      Tour.replay(this.card, 'is-entering');
      Tour.replay(this.ring, 'is-new');
    }
    if (step.ready) this.next.disabled = !step.ready(target);
    const goal = target.getBoundingClientRect();
    const glide = (from, to) => (this.still || from === undefined ? to : from + (to - from) * Tour.GLIDE);
    const now = this.rect || {};
    this.rect = {
      left: glide(now.left, goal.left),
      top: glide(now.top, goal.top),
      width: glide(now.width, goal.width),
      height: glide(now.height, goal.height),
    };
    this.shade.style.clipPath = Tour.holePath(this.rect);
    const pad = Tour.HOLE_PADDING;
    Object.assign(this.ring.style, {
      left: `${this.rect.left - pad}px`,
      top: `${this.rect.top - pad}px`,
      width: `${this.rect.width + pad * 2}px`,
      height: `${this.rect.height + pad * 2}px`,
    });
    this.ring.hidden = false;
    const gap = Tour.GAP;
    const height = this.card.offsetHeight;
    const above = goal.top - height - gap;
    const below = goal.bottom + gap;
    // A target taller than the screen, such as the item rows on a phone, leaves no free side,
    // so the card moves to the half of the screen away from the field being typed in.
    const typing = target.contains(document.activeElement) ? document.activeElement.getBoundingClientRect() : null;
    const clear = typing && typing.top + typing.height / 2 > innerHeight / 2 ? gap : innerHeight - height - gap;
    const top = below + height + gap <= innerHeight ? below : (above >= gap ? above : clear);
    this.card.style.top = `${top}px`;
    this.card.style.left = `${Math.max(gap, Math.min(goal.left, innerWidth - this.card.offsetWidth - gap))}px`;
  }

  // Restarts a one-shot CSS animation on an element that stays in the page.
  static replay(element, name) {
    element.classList.remove(name);
    void element.offsetWidth;
    element.classList.add(name);
  }

  async exit() {
    const confirmed = await Dialog.confirm('Keluar dari tutorial? Tutorial tidak akan muncul lagi. Langkah singkatnya tetap ada di Bantuan.', 'Keluar');
    if (confirmed) this.end(false);
  }

  end(finished) {
    cancelAnimationFrame(this.frame);
    for (const part of [this.shade, this.ring, this.card, this.exitButton]) part.remove();
    try {
      localStorage.setItem(Tour.KEY, '1');
    } catch (error) {
      // The tour shows again next time only if the store name is still empty.
    }
    if (finished) Dialog.toast('Tutorial selesai. Anda siap membuat invoice.');
  }
}
